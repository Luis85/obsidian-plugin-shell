version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: increase
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 3
      semver-major-days: 7
    groups:
      # One weekly pull request for every minor and patch update; majors stay separate.
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
  # Standalone projects (projects/README.md): Dependabot reads only this root file.
  - package-ecosystem: npm
    directory: /projects/companion
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: increase
    cooldown:
