name: Setup npm policy compatibility
on:
  push:
    branches: [main]
    paths: &setup-inputs
      - 'package.json'
      - 'package-lock.json'
      - 'tooling/setup.mjs'
      - 'tooling/setup/**'
      - 'src/shared/platform/**'
      - 'tooling/testing/check-npm-install-policy.mjs'
      - 'tooling/testing/local-npm-registry.mjs'
      - 'src/shared/tests/npm-install.checks.mjs'
      - 'tests/tooling/setup-identity*.mjs'
      - '.gitattributes'
      - '.nvmrc'
      - '.github/workflows/setup-compatibility.yml'
      - '!projects/**'
  # The complete verify gates already run on every pull request in CI's
  # showcase and template-authoring jobs (qualified toolchain). This matrix proves the npm
  # install policy and toolchain rows, so it runs when those inputs change.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *setup-inputs
  # release.yml calls this workflow with tier release: every matrix leg, whatever the path filters say.
  workflow_call:
    inputs:
      tier:
        description: integration (ready pull requests and main) or release (every matrix leg)
        type: string
        default: integration
  workflow_dispatch:
    inputs:
      tier:
        description: integration (three-OS matrices run Linux only) or release (every matrix leg)
        type: choice
        options: [integration, release]
        default: integration
permissions:
  contents: read
concurrency:
  group: setup-policy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  setup:
    name: ${{ matrix.os }} / Node ${{ matrix.node }} / npm ${{ matrix.npm }}
    if: inputs.tier == 'release' || (github.event.pull_request.draft != true && !startsWith(github.head_ref, 'release/'))
    runs-on: ${{ matrix.os }}
    # Every leg runs the fresh install under the forwarded configuration and the
    # real policy fixture without any dependency cache (cold on purpose: the rows
    # qualify npm's install policy). The Ubuntu Node 24.15.0 / npm 12 leg then runs
    # every verify gate once: the only complete verify on Node 24.15.0, measured at
    # about 39 minutes earlier and 58 on the bfe0a5f7 pull request run, so it gets
    # 75 minutes. Windows legs run no complete verify (the npm 12 leg measured 91
    # minutes with it); the npm 12 leg runs the targeted gates below, estimated at
    # 20-30 minutes (not yet measured), and the deferred legs about 1-5 minutes,
    # so Windows gets 60 (room for a runner about 1.7 times slower).
    # This is a job budget, not a test deadline or product performance threshold.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 75 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: '24.15.0'
            npm: '12.0.2'
            verify: complete
          # Windows on Node 24.15.0 / npm 12 defers the complete verify and runs
          # only what npm 12 and this Node can change on Windows: the dependency
          # policy, the build, types and built artifacts, and the setup suite
          # (install policy, staged build, identity, harness preview). The other
          # gates run on this toolchain on Ubuntu (the leg above) and on Windows
          # with the qualified toolchain ("Showcase / windows-latest"); their
          # Windows x Node 24.15.0 x npm 12 combination is no longer run, in the
          # release tier either.
          - os: windows-latest
            node: '24.15.0'
            npm: '12.0.2'
            verify: deferred
            targeted: true
          # The qualified Node 24.21.0 (.nvmrc) / npm 11.19.1 legs defer the
          # identical complete verify, which ci.yml runs on every ready pull
          # request (a main push is the tree its merge-ref run qualified) and in
          # the release tier, for the same OS and toolchain: Ubuntu in
          # "Template authoring / renamed feature" (npm run verify after setup)
          # and Windows in "Showcase / windows-latest" (fresh setup with the
          # complete verify).
          - os: ubuntu-24.04
            node: '24.21.0'
            npm: '11.19.1'
            verify: deferred
          - os: windows-latest
            node: '24.21.0'
            npm: '11.19.1'
            verify: deferred
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Put temporary files on a Dev Drive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/prepare-windows-runner.ps1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Provision exact npm in runner scratch directory, not globally
        shell: pwsh
        run: |
          $tool = Join-Path $env:RUNNER_TEMP 'shell-policy-npm'
          npm install --prefix "$tool" --ignore-scripts --no-fund --package-lock=false npm@${{ matrix.npm }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "QUALIFIED_NPM_CLI=$(Join-Path $tool 'node_modules/npm/bin/npm-cli.js')" >> $env:GITHUB_ENV
      - name: Run fresh setup with the problematic forwarded configuration
        shell: pwsh
        env:
          npm_config_allow_scripts: unrelated-globally-approved-package
          SETUP_VERIFY: ${{ matrix.verify }}
        run: |
          $extra = @()
          if ($env:SETUP_VERIFY -eq 'deferred') { $extra += '--defer-verify' }
          node "$env:QUALIFIED_NPM_CLI" run setup -- --yes --no-interaction @extra
      - name: Targeted gates on this toolchain (dependency policy, build, types, artifacts, setup suite)
        if: matrix.targeted
        shell: pwsh
        run: |
          node "$env:QUALIFIED_NPM_CLI" run verify -- --only dependency-policy,build,typecheck,artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tooling/testing/suites.mjs setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reproduce EALLOWSCRIPTS and prove scoped approval using actual npm
        shell: pwsh
        run: node tooling/testing/check-npm-install-policy.mjs --npm-cli "$env:QUALIFIED_NPM_CLI"
      - name: Retain non-secret compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: setup-policy-${{ matrix.os }}-npm-${{ matrix.npm }}
          path: |
            reports/setup-policy/
            reports/verification/
          retention-days: 7
          if-no-files-found: warn
