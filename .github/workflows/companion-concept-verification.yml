name: Companion concept source verification
on:
  pull_request:
    paths:
      - 'docs/concepts/companion/**'
      - 'scripts/concepts/**'
      - 'scripts/companion/**'
      - 'tests/tooling/companion-project.checks.mjs'
      - 'tests/tooling/companion-details.checks.mjs'
      - 'package.json'
      - 'tests/concepts/**'
      - 'tests/tooling/test-data-*'
      - '.fallowrc.json'
      - 'scripts/quality/maintainability-inventory.mjs'
      - 'tests/tooling/maintainability.checks.mjs'
      - '.github/workflows/companion-concept-verification.yml'
  push:
    branches: [main]
    paths:
      - 'docs/concepts/companion/**'
      - 'scripts/concepts/**'
      - 'scripts/companion/**'
      - 'tests/tooling/companion-project.checks.mjs'
      - 'tests/tooling/companion-details.checks.mjs'
      - 'package.json'
      - 'tests/concepts/**'
      - 'tests/tooling/test-data-*'
      - '.fallowrc.json'
      - 'scripts/quality/maintainability-inventory.mjs'
      - 'tests/tooling/maintainability.checks.mjs'
      - '.github/workflows/companion-concept-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: companion-concept-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Parse all concept Python sources without executing them or writing bytecode
        shell: bash
        run: |
          python3 -B - <<'PYTHON'
          import hashlib, json
          from pathlib import Path
          files = sorted(path for root in ['scripts/concepts', 'tests/concepts'] for path in Path(root).rglob('*.py'))
          if not files:
              raise SystemExit('No concept Python inputs found')
          records = []
          for path in files:
              if path.is_symlink() or not path.is_file():
                  raise SystemExit('Non-regular Python input: ' + str(path))
              raw = path.read_bytes()
              compile(raw, str(path), 'exec', dont_inherit=True)
              records.append({'path': str(path), 'sha256': hashlib.sha256(raw).hexdigest(), 'bytes': len(raw)})
          print(json.dumps({'status': 'passed', 'scope': 'Python syntax only; no execution or JS complexity claim', 'files': records}))
          PYTHON
      - name: Check exact offline concept assembly
        run: python3 scripts/concepts/build-companion.py --check
      - name: Exercise assembly, inventory and tamper rejection
        run: python3 -B tests/concepts/companion-assembly.test.py
      - name: Check authored JavaScript syntax without executing project operations
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for file in docs/concepts/companion/src/*.js; do
            node --check "$file"
            count=$((count + 1))
          done
          test "$count" -gt 0
          echo "Syntax checked $count concept modules. Browser and native evidence are separate."
      - name: Exercise real test-data generators, file safety and loopback adapters
        run: node --test tests/tooling/test-data-*.checks.mjs
      - name: Exercise full-project JSON and read-only shell handoff
        run: node --test tests/tooling/companion-project.checks.mjs tests/tooling/companion-storymaps.checks.mjs tests/tooling/companion-details.checks.mjs
      - name: Package exact review source without Git metadata or credentials
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz HEAD -o "$RUNNER_TEMP/companion-review-source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/companion-review-source.commit"
          sha256sum "$RUNNER_TEMP/companion-review-source.tar.gz" > "$RUNNER_TEMP/companion-review-source.sha256"
      - name: Preserve reproducible review source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: companion-review-source
          path: |
            ${{ runner.temp }}/companion-review-source.tar.gz
            ${{ runner.temp }}/companion-review-source.commit
            ${{ runner.temp }}/companion-review-source.sha256
          retention-days: 7
          if-no-files-found: error
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Provision isolated pinned browser test tooling
        shell: bash
        run: |
          set -euo pipefail
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/companion-browsers"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/companion-browser-env"
          "$RUNNER_TEMP/companion-browser-env/bin/python" -m pip install playwright==1.57.0
          "$RUNNER_TEMP/companion-browser-env/bin/python" -m playwright install chromium
          "$RUNNER_TEMP/companion-browser-env/bin/python" - <<'PYTHON'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write('CHROMIUM_EXECUTABLE=' + pw.chromium.executable_path + '\n')
          PYTHON
      - name: Exercise current concept and real-origin storage on one exact artifact
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/companion-browser-env/bin/python" scripts/concepts/run-browser-checks.py --real-storage
      - name: Retain concept evidence even when a check fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: companion-browser-evidence
          path: |
            reports/concepts/
            docs/concepts/companion/index.html
          retention-days: 7
          if-no-files-found: error
