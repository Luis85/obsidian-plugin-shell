name: Companion concept source verification
on:
  pull_request:
    paths:
      - 'docs/concepts/companion/**'
      - 'scripts/concepts/**'
      - 'tests/concepts/**'
      - '.github/workflows/companion-concept-verification.yml'
  push:
    branches: [main]
    paths:
      - 'docs/concepts/companion/**'
      - 'scripts/concepts/**'
      - '.github/workflows/companion-concept-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: companion-concept-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Check exact offline concept assembly
        run: python3 scripts/concepts/build-companion.py --check
      - name: Check authored JavaScript syntax without executing project operations
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for file in docs/concepts/companion/src/*.js; do
            node --check "$file"
            count=$((count + 1))
          done
          test "$count" -gt 0
          echo "Syntax checked $count concept modules. Browser and native evidence are separate."
