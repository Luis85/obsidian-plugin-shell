name: Companion prepared delivery (temporary)
on:
  push:
    branches: [docs/companion-plugin-prd]
    paths: [.github/workflows/companion-delivery.yml]
permissions:
  contents: read
jobs:
  candidate:
    if: github.repository == 'Luis85/obsidian-plugin-shell' && github.ref == 'refs/heads/docs/companion-plugin-prd'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Recover only the hash-bound reviewed manifest
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: python3 -B .github/companion-delivery.py recover
      - name: Apply and verify exact sources without an API token
        run: python3 -B .github/companion-delivery.py apply
      - name: Create verified Git objects without updating any ref
        env:
          GH_WRITE_TOKEN: ${{ github.token }}
        run: python3 -B .github/companion-delivery.py publish
      - name: Preserve exact delivery receipt for explicit fast-forward
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: companion-delivery-receipt
          path: ${{ runner.temp }}/delivery-receipt.json
          retention-days: 7
          if-no-files-found: error
