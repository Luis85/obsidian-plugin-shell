name: Materialize reviewed JSON starter patch
on:
  push:
    branches: ['feat/json-starters-on-pr5']
    paths: ['.workbench-transfer/**', '.github/workflows/json-starters-transfer.yml']
permissions:
  contents: read
concurrency:
  group: json-starters-transfer
  cancel-in-progress: false
jobs:
  materialize:
    if: github.repository == 'Luis85/obsidian-plugin-shell' && github.ref == 'refs/heads/feat/json-starters-on-pr5'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Check provenance and apply exact reviewed source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '40799d9489e0bd436a47f819732292e8a35a4774'
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, lzma, os, re, subprocess
          root = Path('.workbench-transfer')
          payload = b''.join((root / f'patch-{i:02d}.xz-part').read_bytes() for i in range(6))
          assert len(payload) == 52008
          assert hashlib.sha256(payload).hexdigest() == '7aa41d0798b745afa185d3369f090935de5ab113c1c6811a636f4d62ccef2a4a'
          patch = lzma.decompress(payload)
          assert len(patch) == 1181364
          assert hashlib.sha256(patch).hexdigest() == 'f15af32f39065621b3806e23e5766779c22fc528bb85d03218f1e4933bdc7676'
          pairs = re.findall(r'^diff --git a/(\S+) b/(\S+)$', patch.decode('utf-8'), re.M)
          assert len(pairs) == 44
          assert all(a == b and not a.startswith('.') and '..' not in a.split('/') for a, b in pairs)
          paths = [a for a, _ in pairs]
          assert len(set(paths)) == 44
          file = Path(os.environ['RUNNER_TEMP']) / 'reviewed-json-starters.patch'
          file.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(file)], check=True)
          subprocess.run(['git', 'apply', str(file)], check=True)
          subprocess.run(['git', 'add', '--', *paths], check=True)
          actual = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().strip('\0').split('\0')
          assert sorted(actual) == sorted(paths), actual
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          print('Verified exact patch and staged all 44 implementation files.')
          PY
      - name: Fast-forward the feature branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feat/json-starters-on-pr5 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(starters): external JSON definitions and independent release packs'
          git push origin HEAD:refs/heads/feat/json-starters-on-pr5
          echo "Materialized source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
