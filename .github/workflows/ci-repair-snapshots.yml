name: CI repair snapshots
on:
  push:
    branches: [chore/ci-repair-snapshots-20260927]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0d8fc1159b226e96bd71117024378c98903a6695
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Retain actual branch history, without Git configuration or credentials
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/repair-snapshots"
          git bundle create "$RUNNER_TEMP/repair-snapshots/branches.bundle" \
            refs/remotes/origin/main \
            refs/remotes/origin/docs/companion-plugin-prd \
            refs/remotes/origin/docs/mvp-json-clickdummy-pr5 \
            refs/remotes/origin/feat/mvp-journey-lens-core \
            refs/remotes/origin/feat/hindsight-opt-in-memory \
            refs/remotes/origin/refactor/dedicated-project-compiler \
            refs/remotes/origin/docs/jev-prompt-editor-prototype \
            refs/remotes/origin/feat/mvp-concept-intake \
            refs/remotes/origin/feat/native-file-extension-starters
          git bundle list-heads "$RUNNER_TEMP/repair-snapshots/branches.bundle" > "$RUNNER_TEMP/repair-snapshots/heads.txt"
      - name: Install the repository's exact locked toolchain locally
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/qualified-npm" --ignore-scripts --no-fund --package-lock=false npm@11.19.1
          node "$RUNNER_TEMP/qualified-npm/node_modules/npm/bin/npm-cli.js" ci --no-fund
          cp "$(command -v node)" "$RUNNER_TEMP/repair-snapshots/node"
          tar -czf "$RUNNER_TEMP/repair-snapshots/node-modules.tar.gz" node_modules
          tar -czf "$RUNNER_TEMP/repair-snapshots/qualified-npm.tar.gz" -C "$RUNNER_TEMP/qualified-npm" node_modules/npm
          sha256sum package-lock.json > "$RUNNER_TEMP/repair-snapshots/lockfile.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-repair-snapshots
          path: ${{ runner.temp }}/repair-snapshots/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
