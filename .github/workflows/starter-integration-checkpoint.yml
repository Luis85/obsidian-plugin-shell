name: Integrate tested Companion starter checkpoint
on:
  push:
    branches: [feat/json-starters-on-pr5]
    paths: [.github/workflows/starter-integration-checkpoint.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'Luis85/obsidian-plugin-shell' && github.ref == 'refs/heads/feat/json-starters-on-pr5'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Restore exact tested source over the reconciled PR5 base
        env:
          BASE: 1a078d235043db2157efbcc702878e120264fc14
          FEATURE: 358aaa651139fe3a83ae15afa428f4e9dfac2658
        run: |
          test "$(git rev-parse HEAD^)" = "$FEATURE"
          git fetch --no-tags origin "$BASE"
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          def git(*args): return subprocess.check_output(['git', *args], text=True).strip()
          start = git('rev-parse','HEAD')
          encoded = ''.join(pathlib.Path(f'.github/starter-integration-transport/{i}.b64').read_text() for i in range(9))
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'ba623a40a1ef36a2648105498fce0c2b0d9eb0cf84ab4f3e2f47435a909d8097'
          payload = json.loads(raw)
          pathlib.Path(os.environ['RUNNER_TEMP'],'integration.json').write_bytes(raw)
          git('read-tree','--reset','-u',os.environ['BASE'])
          git('checkout',os.environ['FEATURE'],'--',*payload['restore'])
          git('update-index','--refresh')
          patch = pathlib.Path(os.environ['RUNNER_TEMP'],'integration.patch')
          patch.write_text(payload['patch'])
          git('apply','--check','--index',str(patch))
          git('apply','--index',str(patch))
          migration = pathlib.Path('.starter-golden-migration.mjs')
          migration.write_text(payload['migration'])
          try: subprocess.run(['node',str(migration)],check=True)
          finally: migration.unlink()
          for name, expected in payload['files'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == expected, name
          git('add','--','configs/starters/companion-plugin.json')
          git('diff','--cached','--check')
          inventory = git('ls-files')
          assert 'starter-integration-transport/' not in inventory
          assert '.github/workflows/starter-checkpoint.yml' not in inventory
          assert '.github/workflows/starter-integration-checkpoint.yml' not in inventory
          pathlib.Path(os.environ['RUNNER_TEMP'],'start-head').write_text(start)
          PY
      - name: Verify dependency-free compatibility and retained source assembly
        run: |
          node --test tests/tooling/starter-authoring.checks.mjs tests/tooling/starter-manual.checks.mjs tests/tooling/framework-manual.checks.mjs
          node scripts/documentation/manual.mjs
          node scripts/documentation/manual.mjs --check
          python3 scripts/concepts/build-companion.py --check
      - name: Publish source checkpoint with the actual PR5 parent
        env:
          BASE: 1a078d235043db2157efbcc702878e120264fc14
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          START=$(cat "$RUNNER_TEMP/start-head")
          TREE=$(git write-tree)
          COMMIT=$(printf '%s\n' 'feat(companion): canonical JSON starter and empty-start setup workflow' '' 'Reconcile PR5 1a078d2 while preserving all typed-Markdown, handout and prototype-manager changes. The golden starter is now the editable source; compatibility project exports are derived. Remove embedded starter and self-project seed data from the modern prototype. Retain frozen v5 assembly.' '' 'Exact source hashes verified; local qualified tests: 84 core, 5 compiled distribution, 12 rendered DOM fixtures, framework TypeScript 6 and modern build passed. Full generated native Companion parity remains open.' | git commit-tree "$TREE" -p "$START" -p "$BASE")
          git push origin "$COMMIT":refs/heads/feat/json-starters-on-pr5
          echo "Pushed $COMMIT" >> "$GITHUB_STEP_SUMMARY"
          echo "$COMMIT" > "$RUNNER_TEMP/source-commit"
      - name: Qualify the integrated source with exact locked tools
        run: |
          npm install --prefix "$RUNNER_TEMP/qualified-npm" --ignore-scripts --no-audit --no-fund npm@11.19.1
          node "$RUNNER_TEMP/qualified-npm/node_modules/npm/bin/npm-cli.js" ci --no-audit --no-fund
          node node_modules/typescript/bin/tsc --noEmit --project tsconfig.framework.json
          node --test --test-concurrency=1 tests/tooling/starter-*.checks.mjs tests/tooling/framework-manual.checks.mjs
          node scripts/concepts/build-mvp.mjs
      - name: Real file-origin empty-start browser acceptance
        run: |
          node node_modules/playwright/cli.js install --with-deps chromium
          node tests/concepts/companion-starters.browser.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: companion-starter-checkpoint
          path: |
            ${{ runner.temp }}/source-commit
            reports/companion-mvp/build.json
          retention-days: 7
          if-no-files-found: ignore
