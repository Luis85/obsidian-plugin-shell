name: Optional Storybook qualification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/companion/**'
      - 'scripts/compiler/**'
      - 'bin/compiler/**'
      - 'scripts/framework/**'
      - 'scripts/bundling/**'
      - 'tests/tooling/compiler-storybook*.checks.mjs'
      - 'package*.json'
      - '.github/workflows/optional-storybook.yml'
permissions:
  contents: read
concurrency:
  group: optional-storybook-${{ github.ref }}
  cancel-in-progress: true
jobs:
  optional-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Select qualified npm
        run: |
          npm install --prefix "$RUNNER_TEMP/qualified-npm" --ignore-scripts --no-fund --package-lock=false npm@11.19.1
          echo "QUALIFIED_NPM=$RUNNER_TEMP/qualified-npm/node_modules/npm/bin/npm-cli.js" >> "$GITHUB_ENV"
      - name: Install unchanged root toolchain and check contracts
        run: |
          node "$QUALIFIED_NPM" ci --no-fund
          node "$QUALIFIED_NPM" run typecheck:compiler
          node --test --test-concurrency=1 tests/tooling/compiler-storybook*.checks.mjs
      - name: Resolve fresh consumer dependencies only from versions published at least 24 hours ago
        run: node -e "console.log('npm_config_before=' + new Date(Date.now() - 864e5).toISOString())" >> "$GITHUB_ENV"
      - name: Qualify explicitly opted-in generated workspace
        run: |
          node node_modules/@playwright/test/cli.js install --with-deps chromium
          node scripts/compiler/qualify-storybook.mjs
      - name: Retain evidence, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: optional-storybook-evidence
          path: reports/storybook-qualification
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
