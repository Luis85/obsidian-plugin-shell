name: Maintenance status
on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'
permissions:
  contents: read
concurrency:
  group: maintenance-status
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Discover stable versions and explicit unavailable sources
        run: node scripts/maintenance/status.mjs
      - name: Retain discovery including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: maintenance-status
          path: reports/maintenance/
          if-no-files-found: error
      - name: Show report
        if: always()
        run: cat reports/maintenance/status.md >> "$GITHUB_STEP_SUMMARY"
