name: Maintenance status
on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'
permissions:
  contents: read
concurrency:
  group: maintenance-status
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Discover stable versions and explicit unavailable sources
        run: node tooling/maintenance/status.mjs
      - name: Retain discovery including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maintenance-status
          path: reports/maintenance/
          retention-days: 14
          if-no-files-found: error
      - name: Show report
        if: always()
        run: cat reports/maintenance/status.md >> "$GITHUB_STEP_SUMMARY"
