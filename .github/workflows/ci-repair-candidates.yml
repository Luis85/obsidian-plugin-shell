name: CI repair candidate transport
on:
  push:
    branches: [chore/ci-repair-snapshots-20260927]
    paths: [.ci-repair/candidates.json]
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify and import the exact locally tested Git objects
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, re, subprocess
          from pathlib import Path
          data = json.loads(Path('.ci-repair/candidates.json').read_text())
          assert set(data) == {'batch', 'sha256', 'carrier', 'bundle'}
          assert re.fullmatch('[a-z]', data['batch'])
          assert re.fullmatch('[a-f0-9]{40}', data['carrier'])
          raw = base64.b64decode(data['bundle'], validate=True)
          assert hashlib.sha256(raw).hexdigest() == data['sha256']
          bundle = Path(os.environ['RUNNER_TEMP']) / 'ci-repair.bundle'
          bundle.write_bytes(raw)
          subprocess.run(['git', 'bundle', 'verify', str(bundle)], check=True)
          ref = 'refs/repair/candidates-' + data['batch']
          subprocess.run(['git', 'fetch', str(bundle), ref + ':' + ref], check=True)
          actual = subprocess.check_output(['git', 'rev-parse', ref], text=True).strip()
          assert actual == data['carrier']
          # Never update a feature, PR base, or default branch from this workflow.
          # Publication to the existing PRs is a separate authenticated connector operation.
          target = 'refs/heads/chore/ci-repair-objects-20260927-' + data['batch']
          subprocess.run(['git', 'push', 'origin', actual + ':' + target], check=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Verified candidate objects: `' + actual + '`\n\nTemporary staging ref: `' + target + '`\n')
          PY
