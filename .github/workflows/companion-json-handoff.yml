name: Temporary companion JSON assembly
on:
  push:
    branches: [chore/companion-json-handoff]
    paths:
      - '.github/companion-json-handoff/**'
      - '.github/workflows/companion-json-handoff.yml'
permissions:
  contents: write
concurrency:
  group: companion-json-handoff
  cancel-in-progress: false
jobs:
  assemble:
    if: github.repository == 'Luis85/obsidian-plugin-shell' && github.ref == 'refs/heads/chore/companion-json-handoff'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Validate source identities and apply readable source patches
        shell: bash
        env:
          EXPECTED_EVENT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 -B - <<'PYTHON'
          import hashlib, json, os, subprocess
          from pathlib import Path
          helper = Path('.github/companion-json-handoff')
          raw = (helper / 'manifest.json').read_bytes()
          if hashlib.sha256(raw).hexdigest() != '702847970301fa6f42e839064f1fd45d77309a3bb59f389f7fd8860cca1865cc':
              raise SystemExit('Manifest identity mismatch')
          m = json.loads(raw)
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          if git('rev-parse', 'HEAD') != os.environ['EXPECTED_EVENT']:
              raise SystemExit('Unexpected checkout')
          subprocess.run(['git', 'merge-base', '--is-ancestor', m['base'], 'HEAD'], check=True)
          helpers = {str(helper / name) for name in [*m['patches'], 'manifest.json']}
          helpers.add('.github/workflows/companion-json-handoff.yml')
          if set(git('diff', '--name-only', m['base'], 'HEAD').splitlines()) != set(m['direct']) | helpers:
              raise SystemExit('Unexpected staging changes')
          for name, entry in m['files'].items():
              path = Path(name)
              if path.is_absolute() or '..' in path.parts or any(p.is_symlink() for p in [path, *path.parents]):
                  raise SystemExit('Unsafe source path: ' + name)
              expected = entry['after_sha256'] if name in m['direct'] else entry['before_sha256']
              if expected is None:
                  if path.exists():
                      raise SystemExit('New output already exists: ' + name)
              elif not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest() != expected:
                  raise SystemExit('Source identity mismatch: ' + name)
          patches = []
          for name, digest in m['patches'].items():
              path = helper / name
              if hashlib.sha256(path.read_bytes()).hexdigest() != digest:
                  raise SystemExit('Readable patch identity mismatch: ' + name)
              patches.append(str(path))
          subprocess.run(['git', 'apply', '--check', *patches], check=True)
          subprocess.run(['git', 'apply', *patches], check=True)
          generated = {'docs/concepts/companion/index.html', 'docs/concepts/companion/companion-project.json'}
          for name, entry in m['files'].items():
              if name not in generated and hashlib.sha256(Path(name).read_bytes()).hexdigest() != entry['after_sha256']:
                  raise SystemExit('Patched source identity mismatch: ' + name)
          print('Reviewed source files match; no unrelated source was changed.')
          PYTHON
          python3 -B scripts/concepts/build-companion.py
      - name: Provision isolated pinned browser tooling
        shell: bash
        run: |
          set -euo pipefail
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/companion-browsers"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/companion-browser-env"
          "$RUNNER_TEMP/companion-browser-env/bin/python" -m pip install playwright==1.57.0
          "$RUNNER_TEMP/companion-browser-env/bin/python" -m playwright install chromium
          "$RUNNER_TEMP/companion-browser-env/bin/python" - <<'PYTHON'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write('CHROMIUM_EXECUTABLE=' + pw.chromium.executable_path + '\n')
          PYTHON
      - name: Export the built-in project through the actual browser codec
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/companion-browser-env/bin/python" - <<'PYTHON'
          import hashlib, json, os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          m = json.loads(Path('.github/companion-json-handoff/manifest.json').read_text())
          html = Path('docs/concepts/companion/index.html')
          if hashlib.sha256(html.read_bytes()).hexdigest() != m['files'][str(html)]['after_sha256']:
              raise SystemExit('Assembled HTML differs from reviewed candidate')
          storage = "<script>window.__saved={};Object.defineProperty(window,'localStorage',{value:{getItem:k=>__saved[k]??null,setItem:(k,v)=>{__saved[k]=v},removeItem:k=>delete __saved[k]}});</script>"
          with sync_playwright() as pw:
              browser = pw.chromium.launch(executable_path=os.environ['CHROMIUM_EXECUTABLE'], headless=True, args=['--no-sandbox'])
              page = browser.new_page()
              errors, requests = [], []
              page.on('pageerror', lambda error: errors.append(str(error)))
              page.on('request', lambda request: requests.append(request.url))
              page.route('**/*', lambda route: route.abort())
              page.set_content(storage + html.read_text())
              raw = page.evaluate('companionJson(companionExampleProject())').encode('utf-8')
              browser.close()
          path = Path('docs/concepts/companion/companion-project.json')
          if errors or requests or hashlib.sha256(raw).hexdigest() != m['files'][str(path)]['after_sha256']:
              raise SystemExit('Self-project export differs from reviewed candidate')
          path.write_bytes(raw)
          for name, entry in m['files'].items():
              raw = Path(name).read_bytes()
              if len(raw) != entry['bytes'] or hashlib.sha256(raw).hexdigest() != entry['after_sha256']:
                  raise SystemExit('Final file differs: ' + name)
          print('All 26 files, including HTML and full project JSON, are byte-identical to the handover.')
          PYTHON
      - name: Verify assembly and executable shell contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/concepts/build-companion.py --check
          python3 -B tests/concepts/companion-assembly.test.py
          for file in docs/concepts/companion/src/*.js scripts/companion/*.mjs; do node --check "$file"; done
          node --test tests/tooling/companion-project.checks.mjs tests/tooling/test-data-*.checks.mjs
          git diff --check
      - name: Verify browser round trips and actual-origin storage
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/companion-browser-env/bin/python" scripts/concepts/run-browser-checks.py --real-storage
      - name: Retain candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: companion-json-handoff-evidence
          path: |
            reports/concepts/
            docs/concepts/companion/index.html
            docs/concepts/companion/companion-project.json
          retention-days: 7
          if-no-files-found: error
      - name: Commit assembled source only to the staging branch
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PYTHON'
          import json, subprocess
          from pathlib import Path
          m = json.loads(Path('.github/companion-json-handoff/manifest.json').read_text())
          subprocess.run(['git', 'add', '--', *m['files']], check=True)
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if changed != set(m['files']) - set(m['direct']):
              raise SystemExit('Unexpected staged paths')
          PYTHON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(companion): integrate full-project JSON handoff and rebuild prototype'
          git push origin HEAD:refs/heads/chore/companion-json-handoff
