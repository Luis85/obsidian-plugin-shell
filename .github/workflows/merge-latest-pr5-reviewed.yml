name: Merge latest PR5 into PR54 with reviewed resolutions
on:
  push:
    branches: [chore/companion-starter-build-inputs]
    paths: [.github/workflows/merge-latest-pr5-reviewed.yml]
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/json-starters-on-pr5
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Merge PR5 and resolve the two overlapping files
        shell: bash
        env:
          EXPECTED_HEAD: 9edfcbb810592a8a47b591545d80ecd5241a470a
          PR5_HEAD: 84c5f2082b303740aa17d6ddc70cf5d2e75f15c3
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin "$PR5_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          set +e
          git merge --no-commit --no-ff "$PR5_HEAD"
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Conflicts: %s\n' "${conflicts[*]}"
            test "${#conflicts[@]}" -eq 2
            printf '%s\n' "${conflicts[@]}" | sort > "$RUNNER_TEMP/conflicts"
            printf '%s\n' scripts/framework/help-text.ts shell.mjs | sort > "$RUNNER_TEMP/expected"
            diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/conflicts"

            # Start from latest PR5 behavior, then add the orthogonal PR54 starter behavior.
            git checkout --theirs -- shell.mjs scripts/framework/help-text.ts
            python3 - <<'PY'
          from pathlib import Path

          shell = Path('shell.mjs')
          text = shell.read_text()
          old = "const legacyFlags = ['--starter', '--from', '--list', '--id', '--name', '--author', '--extension', '--extensions', '--install', '--inside-vault', '--storybook', '--storybook-stories', '--airship', '--no-airship', '--yes', '--dry-run', '--plan-out', '--timeout'];"
          new = "const legacyFlags = ['--starter', '--from', '--list', '--id', '--name', '--author', '--extension', '--extensions', '--install', '--inside-vault', '--storybook', '--storybook-stories', '--airship', '--no-airship', '--yes', '--dry-run', '--plan-out', '--timeout', '--values', '--answers', '--run', '--trust-processes'];"
          assert text.count(old) == 1
          shell.write_text(text.replace(old, new))

          help_file = Path('scripts/framework/help-text.ts')
          text = help_file.read_text()

          anchor = "  { id: 'prototypes', title: 'Prototype versions and variants', commands: prototypeCommands.map(command => command.id) },\n"
          starter_group = "  { id: 'starters', title: 'External project starters', commands: ['starters list', 'starters show', 'starters validate', 'starters schema', 'starters add', 'starters edit', 'starters run', 'starters pack'] },\n"
          assert text.count(anchor) == 1 and starter_group not in text
          text = text.replace(anchor, anchor + starter_group)

          anchor = "  resolutions: { description: 'JSON mapping of exact entity#/field conflict keys to markdown or project. Stale or unused resolutions are rejected.' },\n"
          starter_options = (
            "  values: { description: 'Project-relative JSON file containing declared starter input values.' },\n"
            "  answers: { description: 'Inline JSON input values; cannot be combined with --values.' },\n"
            "  run: { description: 'Comma-separated declared processes to run after creation, with fresh --trust-processes.' },\n"
            "  'trust-processes': { description: 'Explicitly trust the reviewed project code and declared process steps; never portable approval.' },\n"
            "  process: { description: 'One or more comma-separated process IDs from the generated starter receipt.' },\n"
            "  project: { description: 'Generated project directory containing .workbench/starter.json.' },\n"
          )
          assert text.count(anchor) == 1 and "  values: { description: 'Project-relative JSON file" not in text
          text = text.replace(anchor, anchor + starter_options)

          anchor = "const examples: Record<string, string[]> = {\n"
          starter_examples = (
            "  'starters list': ['node shell.mjs starters list --json'],\n"
            "  'starters show': ['node shell.mjs starters show webapp --json'],\n"
            "  'starters validate': ['node shell.mjs starters validate --json'],\n"
            "  'starters schema': ['node shell.mjs starters schema --json'],\n"
            "  'starters add': ['node shell.mjs starters add --input my-starter.json --dry-run'],\n"
            "  'starters edit': ['node shell.mjs starters edit webapp --input edited-webapp.json --plan-out starter-edit.plan.json'],\n"
            "  'starters pack': ['node shell.mjs starters pack --out ./workbench-starters.zip --yes'],\n"
            "  'starters run': ['node shell.mjs starters run --project ../my-app --process verify,build --dry-run', 'node shell.mjs starters run --project ../my-app --process build --yes --trust-processes'],\n"
          )
          assert text.count(anchor) == 1 and "'starters list':" not in text
          text = text.replace(anchor, anchor + starter_examples)

          old = "  if (entry.effect === 'process') return ['dry-run', ...(['setup resume', 'docs recover'].includes(entry.id) ? ['apply'] : []), ...(['install', 'storybook install', 'airship install', 'airship start', 'airship doctor', 'framework pack', 'setup resume', 'docs recover'].includes(entry.id) ? ['yes'] : []), 'timeout', ...shared];"
          new = "  if (entry.effect === 'process') return ['dry-run', ...(['setup resume', 'starters run', 'docs recover'].includes(entry.id) ? ['apply'] : []), ...(['install', 'storybook install', 'airship install', 'airship start', 'airship doctor', 'framework pack', 'starters pack', 'starters run', 'setup resume', 'docs recover'].includes(entry.id) ? ['yes'] : []), 'timeout', ...shared];"
          assert text.count(old) == 1
          text = text.replace(old, new)

          help_file.write_text(text)
          PY
            git add shell.mjs scripts/framework/help-text.ts
          fi

          test -z "$(git diff --name-only --diff-filter=U)"
          grep -q "'settings', 'project-setup', 'first-run'" shell.mjs
          grep -q -- "--trust-processes" shell.mjs
          grep -q "id: 'starters'" scripts/framework/help-text.ts
          grep -q "'prototypes compare'" scripts/framework/help-text.ts
          grep -q "'starters run'" scripts/framework/help-text.ts
          git diff --check
          git diff --cached --check
          git commit -m 'merge: reconcile latest PR5 Angular setup with JSON starters'
      - name: Focused compatibility checks
        run: |
          node --experimental-strip-types --test --test-concurrency=1 tests/tooling/starter-*.checks.mjs tests/tooling/framework-manual.checks.mjs
          node --experimental-strip-types scripts/documentation/manual.mjs
          node --experimental-strip-types scripts/documentation/manual.mjs --check
          node --experimental-strip-types --test tests/tooling/interactive-maker-first-run-domain.checks.mjs tests/tooling/interactive-maker-setup-domain.checks.mjs tests/tooling/companion-prototypes.checks.mjs
      - name: Qualified framework typecheck
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/typescript/bin/tsc --noEmit --project tsconfig.framework.json
      - name: Push reconciled PR54 head
        run: git push origin HEAD:refs/heads/feat/json-starters-on-pr5
