name: Finalize reviewed companion concept and retire assembly helper
on:
  push:
    branches: [docs/companion-plugin-prd]
    paths: ['.github/workflows/companion-concept-assembly.yml']
permissions:
  contents: read
concurrency:
  group: companion-concept-assembly
  cancel-in-progress: false
jobs:
  assemble:
    if: github.repository == 'Luis85/obsidian-plugin-shell' && github.ref == 'refs/heads/docs/companion-plugin-prd'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Rebuild from reviewed readable source and existing pinned vendor bytes
        run: |
          set -euo pipefail
          python3 scripts/concepts/build-companion.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          target = Path('docs/concepts/companion/index.html')
          expected = 'd25dd5a892c09760a202f1663e2d14f8a6d2567ae91ca5ce3b920e3dc99207d7'
          actual = hashlib.sha256(target.read_bytes()).hexdigest()
          if actual != expected:
              for path in sorted(Path('docs/concepts/companion/src').glob('*')):
                  if path.is_file():
                      raw = path.read_bytes()
                      oid = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
                      print(path, oid)
              raise SystemExit('Accepted concept hash differs: ' + actual)
          assert target.stat().st_size == 1062056
          print('Accepted offline HTML hash verified:', actual)
          PY
          python3 scripts/concepts/build-companion.py --check
      - name: Commit exact generated asset and retire this temporary write-enabled helper
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch='docs/companion-plugin-prd'
          current="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$current" = "$EXPECTED_HEAD" || { echo 'Branch advanced; stop for reconciliation.'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/concepts/companion/index.html
          git rm .github/workflows/companion-concept-assembly.yml
          git commit -m 'build(concept): commit accepted reconciled HTML and retire assembly helper'
          git push origin "HEAD:refs/heads/$branch"
