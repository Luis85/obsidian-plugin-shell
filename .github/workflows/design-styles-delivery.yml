name: Design styles isolated source qualification
on:
  push:
    branches: [work/design-styles-delivery]
permissions:
  contents: write
concurrency:
  group: design-styles-delivery
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Reconstruct and verify the clean feature tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          encoded = ''.join(Path(f'.delivery/design-styles-{i}.b64').read_text() for i in [1,2,3])
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 170211
          assert hashlib.sha256(patch).hexdigest() == '3b74b53d1bc3e590e99b2097faadb10ece649a64a6181ccfaeda3a67517cbd30'
          Path(os.environ['RUNNER_TEMP'], 'design-styles.patch').write_bytes(patch)
          PY
          SOURCE_DIR="$RUNNER_TEMP/design-styles-source"
          git worktree add --detach "$SOURCE_DIR" 851c7ff0e44b7a5da36fbe0e956d4bf5282cf35d
          cd "$SOURCE_DIR"
          git apply --check "$RUNNER_TEMP/design-styles.patch"
          git apply "$RUNNER_TEMP/design-styles.patch"
          python3 scripts/concepts/build-companion.py
          git add .
          TREE="$(git write-tree)"
          test "$TREE" = e7f139b5511ffb5625100a78abe20edd1ab54f08
          test ! -e .delivery
          test ! -e .github/workflows/design-styles-delivery.yml
          COMMIT="$(git -c user.name=OpenAI -c user.email=noreply@openai.com commit-tree "$TREE" -p 851c7ff0e44b7a5da36fbe0e956d4bf5282cf35d -m 'feat(companion): compile design-system JSON into scoped Nuxt UI styles')"
          git checkout --detach "$COMMIT"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$COMMIT" >> "$GITHUB_ENV"
          mkdir -p reports/design-styles
          printf '{"commit":"%s","tree":"%s","base":"851c7ff0e44b7a5da36fbe0e956d4bf5282cf35d"}\n' "$COMMIT" "$TREE" > reports/design-styles/source.json
          cat reports/design-styles/source.json
      - name: Retain the verified source on an isolated branch only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin "$SOURCE_COMMIT:refs/heads/work/design-styles-source"
      - name: Install pinned dependencies in the clean source workspace
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          npm install --prefix "$RUNNER_TEMP/styles-npm" --ignore-scripts --no-fund --package-lock=false npm@11.19.1
          echo "QUALIFIED_NPM=$RUNNER_TEMP/styles-npm/node_modules/npm/bin/npm-cli.js" >> "$GITHUB_ENV"
          node "$RUNNER_TEMP/styles-npm/node_modules/npm/bin/npm-cli.js" ci --no-fund
      - name: Typecheck, lint and build the framework
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          node "$QUALIFIED_NPM" run typecheck:generator
          node "$QUALIFIED_NPM" run typecheck
          node "$QUALIFIED_NPM" run lint
          node scripts/bundling/build.mjs
      - name: Run unchanged structural and dependency gates
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          node scripts/quality/check-analyzer.mjs
          node scripts/quality/check-repository.mjs
          node scripts/quality/check-source.mjs
          node scripts/quality/check-architecture.mjs
          node scripts/styles/check-tokens.mjs
          python3 scripts/concepts/build-companion.py --check
          python3 -B tests/concepts/companion-assembly.test.py
      - name: Test generator contracts, ownership and legacy JSON handoff
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          node --test tests/tooling/project-generator*.checks.mjs tests/tooling/file-plan*.checks.mjs tests/tooling/companion-project.checks.mjs | tee reports/design-styles/generator.log
          node --test tests/tooling/companion-details.checks.mjs tests/tooling/companion-storymaps.checks.mjs tests/tooling/test-data-*.checks.mjs | tee reports/design-styles/contracts.log
      - name: Independently generate, install, typecheck, build and test the companion project
        run: cd "$SOURCE_DIR" && node scripts/companion/qualify-project.mjs
      - name: Verify generated styles against real Nuxt UI controls
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          node node_modules/@playwright/test/cli.js install --with-deps chromium
          node scripts/companion/qualify-styles.mjs
      - name: Preserve source and verification artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/design-styles-evidence"
          if test -n "${SOURCE_DIR:-}"; then
            cd "$SOURCE_DIR"
            git archive --format=tar.gz HEAD -o "$RUNNER_TEMP/design-styles-evidence/source.tar.gz"
            cp -R reports "$RUNNER_TEMP/design-styles-evidence/reports"
            if test -f reports/project-generator/target.txt; then
              TARGET="$(cat reports/project-generator/target.txt)"
              tar --exclude=node_modules --exclude=dist --exclude=dist-harness --exclude=reports --exclude='*.ttf' --exclude='*.otf' --exclude='*.woff' --exclude='*.woff2' -czf "$RUNNER_TEMP/design-styles-evidence/generated-companion.tar.gz" -C "$TARGET" .
              if test -d "$TARGET/test-results"; then cp -R "$TARGET/test-results" "$RUNNER_TEMP/design-styles-evidence/nuxt-test-results"; fi
            fi
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: design-styles-qualification
          path: ${{ runner.temp }}/design-styles-evidence/
          retention-days: 7
          if-no-files-found: warn
