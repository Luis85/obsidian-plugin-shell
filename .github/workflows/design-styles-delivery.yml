name: Design styles combined source qualification
on:
  push:
    branches: [work/design-styles-delivery]
permissions:
  contents: write
concurrency:
  group: design-styles-delivery
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Integrate the exact concurrent PR head without replacing its changes
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_PARENT=681e93d7d74048155b2fec87cd5f3e155a1ebf73
          STORY_PARENT=5ddc7a278ba639fdc78b9294a55dfdc99c5279d2
          SOURCE_DIR="$RUNNER_TEMP/design-styles-source"
          git worktree add --detach "$SOURCE_DIR" "$SOURCE_PARENT"
          cd "$SOURCE_DIR"
          if ! git -c user.name=OpenAI -c user.email=noreply@openai.com merge --no-commit --no-ff "$STORY_PARENT"; then
            EXPECTED=$'scripts/concepts/build-companion.py\nscripts/concepts/run-browser-checks.py'
            test "$(git diff --name-only --diff-filter=U)" = "$EXPECTED"
            git checkout --ours scripts/concepts/build-companion.py scripts/concepts/run-browser-checks.py
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/concepts/build-companion.py')
          s = p.read_text()
          old = "'storymap-model.js','storymap-actions.js'"
          assert s.count(old) == 1
          p.write_text(s.replace(old, "'storymap-model.js','storymap-review.js','storymap-actions.js'"))
          p = Path('scripts/concepts/run-browser-checks.py')
          s = p.read_text()
          old = "    ('design-styles', 'design-styles/checks.json'),\n"
          assert s.count(old) == 1
          p.write_text(s.replace(old, old + "    ('storymap-polish', 'storymap-polish/checks.json'),\n"))
          p = Path('tests/tooling/companion-boundaries.checks.mjs')
          s = p.read_text()
          assert s.count('entry.length, 128,') == 1
          p.write_text(s.replace('entry.length, 128,', 'entry.length, 129,'))
          PY
          python3 scripts/concepts/build-companion.py
          git add .
          TREE="$(git write-tree)"
          test "$TREE" = 3e2eab38cc3b3ff1d66f62e922df5a6b687ded0d
          test ! -e .delivery
          test ! -e .github/workflows/design-styles-delivery.yml
          git diff --exit-code "$SOURCE_PARENT" -- .github
          git -c user.name=OpenAI -c user.email=noreply@openai.com commit -m 'feat(companion): integrate generated design-system styles with concurrent Storymaps polish'
          COMMIT="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$SOURCE_PARENT" "$COMMIT"
          git merge-base --is-ancestor "$STORY_PARENT" "$COMMIT"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$COMMIT" >> "$GITHUB_ENV"
          mkdir -p reports/design-styles
          printf '{"commit":"%s","tree":"%s","pr_base":"%s"}\n' "$COMMIT" "$TREE" "$STORY_PARENT" > reports/design-styles/source.json
          cat reports/design-styles/source.json
      - name: Retain the combined source on the isolated feature branch only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin "$SOURCE_COMMIT:refs/heads/work/design-styles-source"
      - name: Install pinned dependencies in the clean source workspace
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          npm install --prefix "$RUNNER_TEMP/styles-npm" --ignore-scripts --no-fund --package-lock=false npm@11.19.1
          echo "QUALIFIED_NPM=$RUNNER_TEMP/styles-npm/node_modules/npm/bin/npm-cli.js" >> "$GITHUB_ENV"
          node "$RUNNER_TEMP/styles-npm/node_modules/npm/bin/npm-cli.js" ci --no-fund
      - name: Typecheck, lint and build the framework
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          node "$QUALIFIED_NPM" run typecheck:generator
          node "$QUALIFIED_NPM" run typecheck
          node "$QUALIFIED_NPM" run lint
          node scripts/bundling/build.mjs
      - name: Run unchanged structural and dependency gates
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          node scripts/quality/check-analyzer.mjs
          node scripts/quality/check-repository.mjs
          node scripts/quality/check-source.mjs
          node scripts/quality/check-architecture.mjs
          node scripts/styles/check-tokens.mjs
          python3 scripts/concepts/build-companion.py --check
          python3 -B tests/concepts/companion-assembly.test.py
      - name: Test generator, ownership, legacy JSON, boundaries and editor contracts
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          node --test tests/tooling/project-generator*.checks.mjs tests/tooling/file-plan*.checks.mjs tests/tooling/companion-project.checks.mjs tests/tooling/companion-boundaries.checks.mjs tests/tooling/companion-details.checks.mjs tests/tooling/companion-storymaps.checks.mjs tests/tooling/test-data-*.checks.mjs | tee reports/design-styles/contracts.log
      - name: Independently generate, install, typecheck, build and test the companion project
        run: cd "$SOURCE_DIR" && node scripts/companion/qualify-project.mjs
      - name: Verify generated styles against real Nuxt UI controls
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          node node_modules/@playwright/test/cli.js install --with-deps chromium
          node scripts/companion/qualify-styles.mjs
      - name: Preserve source and verification artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/design-styles-evidence"
          if test -n "${SOURCE_DIR:-}"; then
            cd "$SOURCE_DIR"
            git archive --format=tar.gz HEAD -o "$RUNNER_TEMP/design-styles-evidence/source.tar.gz"
            cp -R reports "$RUNNER_TEMP/design-styles-evidence/reports"
            if test -f reports/project-generator/target.txt; then
              TARGET="$(cat reports/project-generator/target.txt)"
              tar --exclude=node_modules --exclude=dist --exclude=dist-harness --exclude=reports --exclude='*.ttf' --exclude='*.otf' --exclude='*.woff' --exclude='*.woff2' -czf "$RUNNER_TEMP/design-styles-evidence/generated-companion.tar.gz" -C "$TARGET" .
              if test -d "$TARGET/reports/e2e"; then cp -R "$TARGET/reports/e2e" "$RUNNER_TEMP/design-styles-evidence/nuxt-test-results"; fi
            fi
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: design-styles-qualification
          path: ${{ runner.temp }}/design-styles-evidence/
          retention-days: 7
          if-no-files-found: warn
