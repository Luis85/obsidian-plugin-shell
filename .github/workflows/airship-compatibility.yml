name: Airship generated-project compatibility
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: airship-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Select qualified npm
        run: |
          npm install --prefix "$RUNNER_TEMP/qualified-npm" --ignore-scripts --no-fund --package-lock=false npm@11.19.1
          echo "QUALIFIED_NPM=$RUNNER_TEMP/qualified-npm/node_modules/npm/bin/npm-cli.js" >> "$GITHUB_ENV"
      - name: Install and validate source contracts
        run: |
          node "$QUALIFIED_NPM" ci --no-fund
          node "$QUALIFIED_NPM" run typecheck:framework
          node "$QUALIFIED_NPM" run typecheck:compiler
          node "$QUALIFIED_NPM" run check:compiler-architecture
          node "$QUALIFIED_NPM" run test:airship
          node scripts/testing/suites.mjs --check
          python -B scripts/concepts/build-companion.py --check
      - name: Qualify actual generated preview and pinned Airship
        if: runner.os == 'Linux'
        run: |
          node node_modules/@playwright/test/cli.js install --with-deps chromium
          node scripts/airship/qualify.mjs
      - name: Retain named compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: airship-compatibility-${{ matrix.os }}
          path: |
            reports/airship-qualification/evidence.json
            reports/airship-qualification/servers.log
            reports/airship-qualification/airship-preview.png
          if-no-files-found: ignore
          retention-days: 7
