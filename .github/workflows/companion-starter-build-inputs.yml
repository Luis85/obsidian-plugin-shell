name: Companion starter build inputs
on:
  push:
    branches: [chore/companion-starter-build-inputs]
    paths: [.github/workflows/companion-starter-build-inputs.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0b3124ab05a7e906d578e91b94e31bf4132f2ae8
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Capture source identity
        run: |
          mkdir -p "$RUNNER_TEMP/starter-inputs"
          git archive --format=tar.gz -o "$RUNNER_TEMP/starter-inputs/source.tar.gz" HEAD
          git ls-tree -r HEAD > "$RUNNER_TEMP/starter-inputs/source-tree.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/starter-inputs/source-sha.txt"
      - name: Install locked build dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/qualified-npm" --ignore-scripts --no-audit --no-fund npm@11.19.1
          node "$RUNNER_TEMP/qualified-npm/node_modules/npm/bin/npm-cli.js" ci --no-audit --no-fund
      - name: Capture build dependencies without credentials or font binaries
        run: |
          tar --exclude='*.woff' --exclude='*.woff2' --exclude='*.ttf' --exclude='*.otf' --exclude='*.eot' -czf "$RUNNER_TEMP/starter-inputs/dependencies.tar.gz" node_modules
          mkdir -p "$RUNNER_TEMP/starter-inputs/toolchain"
          cp "$(command -v node)" "$RUNNER_TEMP/starter-inputs/toolchain/node"
          cp -R "$RUNNER_TEMP/qualified-npm/node_modules/npm" "$RUNNER_TEMP/starter-inputs/toolchain/npm"
          cd "$RUNNER_TEMP/starter-inputs"
          tar -czf toolchain.tar.gz toolchain
          rm -rf toolchain
          sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: companion-starter-build-inputs
          path: ${{ runner.temp }}/starter-inputs/
          retention-days: 1
          if-no-files-found: error
