name: Dev
# Dev tier: fast feedback on every pull-request event, drafts included, so idea
# and prototype work is never slowed down by the heavy gates. Marking a draft
# ready for review starts the Integration tier (ci.yml and the other pull-request
# workflows); release.yml is the Release tier. Branch protection requires
# "Dev checks" and "CI result".
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'projects/**'
permissions:
  contents: read
concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    name: Dev checks
    runs-on: ubuntu-24.04
    # Targets about ten minutes: the locked install, diff-scoped checks and the
    # clean-checkout regression. A configuration or dependency manifest change widens
    # lint and tests to the full roots; 20 is a job budget, not a test deadline.
    timeout-minutes: 20
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      # Full history: the diff-scoped checks compare with the pull request base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-qualified
        with:
          install: 'true'
          install-flags: --no-fund
      # Every check below runs even after an earlier one failed, so one push
      # reports all of its findings.
      # Typecheck, lint and eslint on changed files, related Vitest tests and the
      # maker type-check. The node --test suites the diff selects are listed as
      # skipped (--skip-suites): they take minutes each and run in the Integration
      # tier (ci.yml verify and the path-filtered workflows), not here.
      - name: Agent fast gate on the diff against the base branch
        run: |
          mkdir -p reports/dev
          git rev-parse HEAD > reports/dev/source-commit.txt
          node bin/app check --fast --skip-suites --base "origin/$BASE_REF" --json > reports/dev/check.json
      - name: Fresh-checkout build, portability and strict typecheck regressions
        if: ${{ !cancelled() }}
        run: |
          mkdir -p reports/dev
          set -o pipefail
          node --test src/cli/tests/framework-checkout-build.checks.mjs 2>&1 | tee reports/dev/checkout-build.txt
      - name: Test suite registration and documentation
        if: ${{ !cancelled() }}
        run: node tooling/testing/suites.mjs --check
      - name: Repository policy (workflows, composite actions, owned CSS, root Markdown)
        if: ${{ !cancelled() }}
        run: node "$QUALIFIED_NPM" run check:repository
      - name: Changelog structure
        if: ${{ !cancelled() }}
        run: node src/cli/tooling/release/changelog.mjs check
      - name: Self-review guard (advisory here, blocking in CI)
        if: ${{ !cancelled() }}
        run: node "$QUALIFIED_NPM" run check:self-review -- --base "origin/$BASE_REF" --warn-only
      - name: Retain Dev check results for this revision
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev-check-results
          path: reports/dev/
          retention-days: 7
          if-no-files-found: warn
