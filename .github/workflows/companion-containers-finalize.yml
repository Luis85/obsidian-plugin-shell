name: Finalize reviewed container and connection concept
on:
  push:
    branches: [docs/companion-plugin-prd]
    paths: ['.concept-transfer/manifest.json']
permissions:
  contents: read
concurrency:
  group: companion-concept-finalize
  cancel-in-progress: false
jobs:
  finalize:
    if: github.repository == 'Luis85/obsidian-plugin-shell' && github.ref == 'refs/heads/docs/companion-plugin-prd'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify preimages and rebuild the exact reviewed artifact
        run: python3 .concept-transfer/apply.py
      - name: Commit the requested concept and retire this temporary helper
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch='docs/companion-plugin-prd'
          current="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$current" = "$EXPECTED_HEAD" || { echo 'Branch advanced; refusing to replace concurrent work.'; exit 1; }
          git rm -r .concept-transfer .github/workflows/companion-containers-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(concept): clarify view containers and repair connection geometry'
          git push origin "HEAD:refs/heads/$branch"
