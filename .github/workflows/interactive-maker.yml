name: Interactive maker qualification
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths-ignore:
      - 'projects/**'
  # release.yml calls this workflow with tier release: every matrix leg, whatever the path filters say.
  workflow_call:
    inputs:
      tier:
        description: integration (ready pull requests and main) or release (every matrix leg)
        type: string
        default: integration
      e2e:
        description: also run the opt-in end-to-end steps (real browser, real Obsidian); tier release always runs them
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tier:
        description: integration (three-OS matrices run Linux only) or release (every matrix leg)
        type: choice
        options: [integration, release]
        default: integration
      e2e:
        description: also run the opt-in end-to-end steps (real browser, real Obsidian); tier release always runs them
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: interactive-maker-${{ github.ref }}${{ github.event.action == 'labeled' && format('-label-{0}', github.event.label.name) || '' }}
  cancel-in-progress: true
jobs:
  maker:
    if: inputs.tier == 'release' || ((github.event.action != 'labeled' || github.event.label.name == 'e2e') && github.event.pull_request.draft != true && !startsWith(github.head_ref, 'release/'))
    strategy:
      fail-fast: false
      matrix:
        # Integration (ready pull requests, main) runs the Linux leg; the release tier runs every OS.
        os: ${{ fromJSON(inputs.tier == 'release' && '["ubuntu-24.04", "windows-latest", "macos-latest"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-qualified
        with:
          install: 'true'
          install-flags: --no-fund
      - name: TypeScript and both source linters
        run: |
          node "$QUALIFIED_NPM" run typecheck:maker
          node node_modules/eslint/bin/eslint.js -c configs/lint/eslint.config.mjs src/cli plugins --max-warnings 0
          node node_modules/oxlint/bin/oxlint -c configs/lint/oxlintrc.json src/cli plugins --no-ignore --deny-warnings
          node "$QUALIFIED_NPM" run check:plugins
      - name: Workbench plugin contracts
        if: ${{ !cancelled() }}
        run: |
          mkdir -p reports/maker
          set -o pipefail
          node "$QUALIFIED_NPM" run test:plugins 2>&1 | tee reports/maker/plugins.log
      - name: Enable the example extension for the plugin-provided starter
        id: extension
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: |
          cp plugins/example-extension/config.json "$RUNNER_TEMP/example-extension-config.json"
          node --input-type=module - <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'plugins/example-extension/config.json';
          const config = JSON.parse(await readFile(path, 'utf8'));
          await writeFile(path, JSON.stringify({ ...config, enabled: true }, null, 2) + '\n');
          NODE
      - name: Qualify plugin-provided React starter without the browser smoke
        if: ${{ !cancelled() && runner.os == 'Linux' && !(inputs.tier == 'release' || inputs.e2e == true || contains(github.event.pull_request.labels.*.name, 'e2e')) }}
        run: node scripts/compiler/qualify-project-starters.mjs --starter webapp-react --execute --no-browser
      - name: Resolve the pinned Playwright version
        id: playwright
        if: ${{ !cancelled() && runner.os == 'Linux' && (inputs.tier == 'release' || inputs.e2e == true || contains(github.event.pull_request.labels.*.name, 'e2e')) }}
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      # Same key as ci.yml and setup-qualified, so every workflow shares one browser download.
      - name: Restore the pinned Chromium download
        if: ${{ !cancelled() && runner.os == 'Linux' && (inputs.tier == 'release' || inputs.e2e == true || contains(github.event.pull_request.labels.*.name, 'e2e')) }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Qualify plugin-provided React starter
        if: ${{ !cancelled() && runner.os == 'Linux' && (inputs.tier == 'release' || inputs.e2e == true || contains(github.event.pull_request.labels.*.name, 'e2e')) }}
        run: |
          node node_modules/@playwright/test/cli.js install --with-deps chromium
          node scripts/compiler/qualify-project-starters.mjs --starter webapp-react --execute
      - name: Restore the example extension configuration
        if: ${{ always() && steps.extension.outcome != 'skipped' }}
        run: cp "$RUNNER_TEMP/example-extension-config.json" plugins/example-extension/config.json
      - name: Actual pseudo-terminal authoring and restoration
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: node "$QUALIFIED_NPM" run test:maker:pty
      # The one run of the maker tests: interactive, agent, compiler and safe-write contracts under the coverage gate.
      - name: Interactive, agent, compiler and safe-write contracts with coverage
        if: ${{ !cancelled() }}
        run: |
          mkdir -p reports/maker
          set -o pipefail
          node "$QUALIFIED_NPM" run test:coverage:maker 2>&1 | tee reports/maker/tests.log
      - name: Source inventory gate
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: |
          node scripts/testing/suites.mjs --check
          node "$QUALIFIED_NPM" run check:source
      - name: Repository analyzer and architecture gates
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: node "$QUALIFIED_NPM" run check:analyzer
      - name: Production maintainability gate
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: node "$QUALIFIED_NPM" run check:maintainability
      - name: Retain exact qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maker-qualification-${{ matrix.os }}
          path: |
            reports/maker
            reports/maker-pty
            reports/maker-coverage
            reports/project-starters/webapp-react
            reports/maintainability
            reports/analyzer
          if-no-files-found: ignore
          retention-days: 7
