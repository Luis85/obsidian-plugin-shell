name: Assemble reconciled PR21 source
on:
  push:
    branches: [work/pr21-review-sync-20260925]
permissions:
  contents: write
jobs:
  assemble:
    if: ${{ contains(github.event.head_commit.message, 'stage reconciled PR21 review') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify and assemble exact reconciled source
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, lzma, hashlib, pathlib, subprocess
          raw = ''.join(pathlib.Path(f'.delivery/pr21-{i}.b64').read_text() for i in range(4))
          patch = lzma.decompress(base64.b64decode(raw, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '53399354125efdff6a6b55979ede2a6335634ec65100067d254655d117b294a9'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          subprocess.run(['python3', 'scripts/concepts/build-companion.py'], check=True)
          for i in range(4):
              pathlib.Path(f'.delivery/pr21-{i}.b64').unlink()
          pathlib.Path('.github/workflows/pr21-review-sync.yml').unlink()
          PY
          git add -A
          test "$(git write-tree)" = "7a61f4e370a8ef134d0f8ae058681a6d7293c4c1"
          # Workflow edits are published separately by the authorized connector.
          git restore --source=HEAD --staged --worktree .github/workflows/project-generator.yml .github/workflows/pr21-review-sync.yml
          git diff --cached --quiet -- .github/workflows
          git -c user.name='OpenAI' -c user.email='noreply@openai.com' commit -m 'build: retain verified reconciled PR21 source'
          git push origin HEAD:refs/heads/work/pr21-review-sync-20260925
