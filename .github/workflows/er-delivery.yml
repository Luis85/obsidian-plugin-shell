name: Exact ER review delivery (temporary)
on:
  push:
    branches: [docs/companion-plugin-prd]
    paths: [.github/workflows/er-delivery.yml]
permissions:
  contents: read
jobs:
  candidate:
    if: github.repository == 'Luis85/obsidian-plugin-shell' && github.ref == 'refs/heads/docs/companion-plugin-prd'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Verify idle-port fix and exact artifact without an API token
        run: python3 -B .github/er-finish/finalize.py apply
      - name: Create verified objects only, with no ref update
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/er-finish/finalize.py publish
      - name: Preserve final candidate receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: er-finish-receipt
          path: ${{ runner.temp }}/er-finish-receipt.json
          retention-days: 7
          if-no-files-found: error
