name: Projects-only required checks
# Shell workflows ignore projects/**. Report their required names only after the
# changed projects' own CI succeeds for this exact pull-request head.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    paths:
      - 'projects/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: projects-required-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    name: Projects-only scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      projects-only: ${{ steps.scope.outputs.projects-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether the pull request changes only projects/**
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qv '^projects/'; then only=true; else only=false; fi
          echo "projects-only=$only" >> "$GITHUB_OUTPUT"
          echo "Changes only under projects/: $only"
  project-ci:
    name: Changed project CI
    needs: scope
    if: needs.scope.outputs.projects-only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Require successful CI for every changed project
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/projects/required-checks.mjs
  report:
    needs: [scope, project-ci]
    if: always()
    strategy:
      matrix:
        check: ['Dev checks', 'Definition of Ready', 'CI result', 'Definition of Done']
    name: ${{ needs.scope.outputs.projects-only == 'true' && matrix.check || format('{0} (shell changes)', matrix.check) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report the required check
        env:
          PROJECTS_ONLY: ${{ needs.scope.outputs.projects-only }}
          CHECK: ${{ matrix.check }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          PROJECT_CI_RESULT: ${{ needs.project-ci.result }}
        run: |
          test "$SCOPE_RESULT" = success
          if [ "$PROJECTS_ONLY" = true ]; then
            test "$PROJECT_CI_RESULT" = success
            echo "Project CI passed for this head; reporting $CHECK."
          else
            echo "The shell changed too: $CHECK comes from the shell workflows, not from here."
          fi
