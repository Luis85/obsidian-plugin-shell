name: Finalize reviewed unified companion concept
on:
  push:
    branches: [docs/companion-plugin-prd]
    paths: ['.concept-transfer/manifest.json']
permissions:
  contents: read
concurrency:
  group: companion-concept-finalization
  cancel-in-progress: false
jobs:
  finalize:
    if: github.repository == 'Luis85/obsidian-plugin-shell' && github.ref == 'refs/heads/docs/companion-plugin-prd'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Reconstruct reviewed source and verify the exact tested artifact
        run: |
          test "$(git rev-parse HEAD^)" = 'd22cc1c86aece83624713a2d3da30d1fd048e6ed'
          python3 .concept-transfer/apply.py
      - name: Commit the reviewed concept and remove this one-time helper
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch='docs/companion-plugin-prd'
          current="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$current" = "$EXPECTED_HEAD" || { echo 'Branch advanced; reconciliation required.'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/concepts/companion scripts/concepts tests/concepts
          git rm -r .concept-transfer .github/workflows/companion-concept-finalize.yml
          git commit -m 'feat(concept): unify components, section drop zones and stable connectors'
          git push origin "HEAD:refs/heads/$branch"
