name: Reconcile latest PR5 into PR54
on:
  push:
    branches: [chore/companion-starter-build-inputs]
    paths: [.github/workflows/reconcile-latest-pr5-pr54.yml]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/json-starters-on-pr5
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Merge current PR5 and resolve reviewed overlaps
        shell: bash
        env:
          EXPECTED_FEATURE: 9edfcbb810592a8a47b591545d80ecd5241a470a
          PR5: 84c5f2082b303740aa17d6ddc70cf5d2e75f15c3
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_FEATURE"
          git fetch --no-tags origin "$PR5"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          set +e
          git merge --no-commit --no-ff "$PR5"
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Conflicts: %s\n' "${conflicts[*]}"
            for f in "${conflicts[@]}"; do
              case "$f" in
                shell.mjs|scripts/framework/help-text.ts) ;;
                *) echo "Unexpected conflict: $f" >&2; exit 1 ;;
              esac
            done
            if printf '%s\n' "${conflicts[@]}" | grep -qx 'shell.mjs'; then
              git checkout --theirs -- shell.mjs
              python3 - <<'PY'
from pathlib import Path
p=Path('shell.mjs')
s=p.read_text()
old="const legacyFlags = ['--starter', '--from', '--list', '--id', '--name', '--author', '--extension', '--extensions', '--install', '--inside-vault', '--storybook', '--storybook-stories', '--airship', '--no-airship', '--yes', '--dry-run', '--plan-out', '--timeout'];"
new="const legacyFlags = ['--starter', '--from', '--list', '--id', '--name', '--author', '--extension', '--extensions', '--install', '--inside-vault', '--storybook', '--storybook-stories', '--airship', '--no-airship', '--yes', '--dry-run', '--plan-out', '--timeout', '--values', '--answers', '--run', '--trust-processes'];"
assert s.count(old)==1, 'legacyFlags anchor changed'
s=s.replace(old,new)
p.write_text(s)
PY
              git add shell.mjs
            fi
            if printf '%s\n' "${conflicts[@]}" | grep -qx 'scripts/framework/help-text.ts'; then
              git checkout --theirs -- scripts/framework/help-text.ts
              python3 - <<'PY'
from pathlib import Path
p=Path('scripts/framework/help-text.ts')
s=p.read_text()
def once(old,new):
    global s
    assert s.count(old)==1, old[:100]
    s=s.replace(old,new,1)
once(
"  { id: 'start', title: 'Start a project', commands: ['new', 'setup', 'setup status', 'setup resume', 'project inspect', 'project import', 'project schema', 'project validate', 'project measure', 'generate', 'concept schema', 'concept inspect', 'concept import'] },\n",
"  { id: 'start', title: 'Start a project', commands: ['new', 'setup', 'setup status', 'setup resume', 'project inspect', 'project import', 'project schema', 'project validate', 'project measure', 'generate', 'concept schema', 'concept inspect', 'concept import'] },\n  { id: 'starters', title: 'External project starters', commands: ['starters list', 'starters show', 'starters validate', 'starters schema', 'starters add', 'starters edit', 'starters run', 'starters pack'] },\n")
once(
"const specific: Record<string, OptionHelp> = {\n",
"const specific: Record<string, OptionHelp> = {\n  values: { description: 'Project-relative JSON file containing declared starter input values.' },\n  answers: { description: 'Inline JSON input values; cannot be combined with --values.' },\n  run: { description: 'Comma-separated declared processes to run after creation, with fresh --trust-processes.' },\n  'trust-processes': { description: 'Explicitly trust the reviewed project code and declared process steps; never portable approval.' },\n  process: { description: 'One or more comma-separated process IDs from the generated starter receipt.' },\n  project: { description: 'Generated project directory containing .workbench/starter.json.' },\n")
once(
"const examples: Record<string, string[]> = {\n",
"const examples: Record<string, string[]> = {\n  'starters list': ['node shell.mjs starters list --json'],\n  'starters show': ['node shell.mjs starters show webapp --json'],\n  'starters validate': ['node shell.mjs starters validate --json'],\n  'starters schema': ['node shell.mjs starters schema --json'],\n  'starters add': ['node shell.mjs starters add --input my-starter.json --dry-run'],\n  'starters edit': ['node shell.mjs starters edit webapp --input edited-webapp.json --plan-out starter-edit.plan.json'],\n  'starters pack': ['node shell.mjs starters pack --out ./workbench-starters.zip --yes'],\n  'starters run': ['node shell.mjs starters run --project ../my-app --process verify,build --dry-run', 'node shell.mjs starters run --project ../my-app --process build --yes --trust-processes'],\n")
old="  if (entry.effect === 'process') return ['dry-run', ...(['setup resume', 'docs recover'].includes(entry.id) ? ['apply'] : []), ...(['install', 'storybook install', 'airship install', 'airship start', 'airship doctor', 'framework pack', 'setup resume', 'docs recover'].includes(entry.id) ? ['yes'] : []), 'timeout', ...shared];"
new="  if (entry.effect === 'process') return ['dry-run', ...(['setup resume', 'starters run', 'docs recover'].includes(entry.id) ? ['apply'] : []), ...(['install', 'storybook install', 'airship install', 'airship start', 'airship doctor', 'framework pack', 'starters pack', 'starters run', 'setup resume', 'docs recover'].includes(entry.id) ? ['yes'] : []), 'timeout', ...shared];"
once(old,new)
p.write_text(s)
PY
              git add scripts/framework/help-text.ts
            fi
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check
          git diff --cached --check
      - name: Run dependency-free merged regressions
        run: |
          node --experimental-strip-types --test --test-concurrency=1 tests/tooling/starter-*.checks.mjs tests/tooling/framework-manual.checks.mjs
          node --experimental-strip-types scripts/documentation/manual.mjs
          node --experimental-strip-types scripts/documentation/manual.mjs --check
      - name: Commit and push merge checkpoint
        shell: bash
        run: |
          git commit -m 'merge: reconcile latest PR5 Angular setup with JSON starters' -m 'Preserve PR5 first-run, Angular setup and interactive-maker changes while retaining external starter routing and help metadata. Only shell.mjs and help-text.ts overlap; both are combined explicitly. Starter/manual regressions pass before this fast-forward push.'
          git push origin HEAD:refs/heads/feat/json-starters-on-pr5
