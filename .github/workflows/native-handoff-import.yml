name: Recover requested native sources
on:
  push:
    branches: [chore/native-source-handoff]
permissions:
  contents: read
jobs:
  recover:
    if: contains(github.event.head_commit.message, '[native-handoff-import]')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: chore/native-source-handoff
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Expand exact delivered source without replacing the active implementation
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = 967047e479f0552aa90073e1d6d15542f934ea1e
          mkdir "$RUNNER_TEMP/native-source-snapshot"
          git archive 24bde52e33b2d6e212b71d86e1b1ae045a8153d6 | tar -x -C "$RUNNER_TEMP/native-source-snapshot"
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { brotliDecompressSync } from 'node:zlib';
          const hash = data => createHash('sha256').update(data).digest('hex');
          const packed = Buffer.concat([1,2,3,4].map(n => readFileSync(`.github/native-handoff/part${n}.br`)));
          if (hash(packed) !== '7142f4e0396a9ceb5ed7811c8426880226bee22287bb7bcdbb9196f32fcbdfc1') throw Error('Transport mismatch');
          const patch = brotliDecompressSync(packed, { maxOutputLength: 1048576 });
          if (hash(patch) !== '5ade5c201656466d8bd94f47ed9f24eef8d33c1263f2bac9a37f6cb3302122ad') throw Error('Source patch mismatch');
          writeFileSync(process.env.RUNNER_TEMP + '/native-source.patch', patch);
          JS
          cd "$RUNNER_TEMP/native-source-snapshot"
          git apply --check "$RUNNER_TEMP/native-source.patch"
          git apply "$RUNNER_TEMP/native-source.patch"
          python3 scripts/concepts/build-companion.py
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, shutil
          root = pathlib.Path.cwd()
          snapshot = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-source-snapshot'
          patch = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-source.patch').read_text(encoding='utf-8')
          records = []
          for block in re.split(r'(?=^diff --git )', patch, flags=re.M):
              if not block.startswith('diff --git '):
                  continue
              match = re.match(r'diff --git a/(\S+) b/(\S+)\n', block)
              assert match and match[1] == match[2], 'Unexpected patch path'
              name = match[1]
              status = 'D' if '\ndeleted file mode ' in block else 'A' if '\nnew file mode ' in block else 'M'
              records.append({'status': status, 'path': name})
          records.append({'status': 'M', 'path': 'docs/concepts/companion/index.html'})
          assert len(records) == 49 and len({r['path'] for r in records}) == 49
          for r in records:
              p = pathlib.PurePosixPath(r['path'])
              assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
              file = snapshot / p
              if r['status'] == 'D':
                  assert r['path'] == '.github/workflows/native-integration-verification.yml' and not file.exists()
              else:
                  assert file.is_file() and not file.is_symlink()
                  data = file.read_bytes()
                  r.update(bytes=len(data), sha256=hashlib.sha256(data).hexdigest())
          records.sort(key=lambda r: r['path'])
          listing = ''.join(f"{r['status']} {r.get('sha256', '-')} {r.get('bytes', 0)} {r['path']}\n" for r in records)
          assert hashlib.sha256(listing.encode()).hexdigest() == 'c5585ea87132145a185ff4445b9ab70d157cf927271455d5c86b70c8da9a546e', 'Delivered inventory mismatch'
          target = root / 'docs/concepts/native-file-integration-handoff'
          assert not (target / 'source').exists()
          for r in records:
              if r['status'] == 'D':
                  continue
              dest = target / 'source' / r['path']
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(snapshot / r['path'], dest)
          manifest = {'schemaVersion': 1, 'repository': 'Luis85/obsidian-plugin-shell', 'baselineCommit': '24bde52e33b2d6e212b71d86e1b1ae045a8153d6', 'publicationBase': '8942680c6d29700c4f3440da447c14a767e78472', 'sourceArchiveSha256': '1128ff12a3e13bd5c8ae4b9ce9f65e7b2b0f441ae634ac482a8714f291785000', 'sourceOnlyPatchSha256': '5ade5c201656466d8bd94f47ed9f24eef8d33c1263f2bac9a37f6cb3302122ad', 'files': records}
          (target / 'MANIFEST.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          file = root / 'scripts/framework/distribution.ts'
          text = file.read_text(encoding='utf-8')
          old = "'docs/concepts/jev-prompt-editor/',"
          assert text.count(old) == 1
          text = text.replace(old, old + " 'docs/concepts/native-file-integration-handoff/',")
          old = "'tests/tooling/jev-concept-distribution.checks.mjs'"
          assert text.count(old) == 1
          text = text.replace(old, old + ", 'tests/tooling/project-generator-native-handoff.checks.mjs'")
          file.write_text(text, encoding='utf-8')
          file = root / 'scripts/companion/compiler/framework-docs.ts'
          text = file.read_text(encoding='utf-8')
          old = "|| path.startsWith('docs/concepts/jev-prompt-editor/')"
          assert text.count(old) == 1
          text = text.replace(old, "|| path.startsWith('docs/concepts/native-file-integration-handoff/') || path === 'tests/tooling/project-generator-native-handoff.checks.mjs'\n    " + old)
          file.write_text(text, encoding='utf-8')
          print('Recovered 48 exact source files; one deletion retained as historical metadata.')
          PY
          python3 docs/concepts/native-file-integration-handoff/restore.py --check
          node --test tests/tooling/project-generator-native-handoff.checks.mjs
          git rm .github/native-handoff/part1.br .github/native-handoff/part2.br .github/native-handoff/part3.br .github/native-handoff/part4.br .github/workflows/native-handoff-import.yml
          git add docs/concepts/native-file-integration-handoff scripts/framework/distribution.ts scripts/companion/compiler/framework-docs.ts
          # The hash-verified historical generated HTML retains six original trailing spaces.
          # Check all other new source; no repository rule or active artifact is changed.
          git diff --cached --check -- . ':(exclude)docs/concepts/native-file-integration-handoff/source/docs/concepts/companion/index.html'
          test "$(git write-tree | xargs -I{} git rev-parse {}:docs/concepts/native-file-integration-handoff/source)" = c0f6b4be694d15717ba7688382223b7b7ac175d7
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(native): publish all recovered source files and isolate the alternative from active generators'
          git push origin HEAD:refs/heads/chore/native-source-handoff
