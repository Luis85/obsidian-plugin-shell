name: Companion latest source reconciliation
on:
  push:
    branches: [chore/companion-starter-build-inputs]
    paths: [.github/workflows/companion-sync-latest.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7efe9bfd4915720c045422be1234206b1af2cc98
          persist-credentials: false
      - name: Archive exact source
        run: |
          mkdir -p "$RUNNER_TEMP/source"
          git archive --format=tar.gz -o "$RUNNER_TEMP/source/pr5.tar.gz" HEAD
          git ls-tree -r HEAD > "$RUNNER_TEMP/source/tree.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/source/sha.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: companion-pr5-latest-source
          path: ${{ runner.temp }}/source/
          retention-days: 1
