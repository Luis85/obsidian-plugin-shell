name: Site templates
# Maintainer-only: renders every opt-in Astro site template (templates/sites) with the
# shell's own site commands into a scratch shell root, twice (zero collections, and one
# snapshot of the tests/fixtures/sites vault), then runs npm ci and npm run build in each
# rendered site with its own exact lock. The shell itself never installs Astro.
on:
  pull_request:
    paths: &site-template-inputs
      - 'templates/sites/**'
      - 'bin/domain/site-template.ts'
      - 'bin/domain/site-collections.ts'
      - 'bin/adapters/site-templates.ts'
      - 'bin/adapters/framework/site-command.ts'
      - 'scripts/testing/qualify-site-templates.mjs'
      - 'tests/fixtures/sites/**'
      - '.github/workflows/site-templates.yml'
      - '!projects/**'
  push:
    branches: [main]
    paths: *site-template-inputs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-templates-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Render and build every site template
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-qualified
        with:
          install: 'true'
          install-flags: --no-fund --ignore-scripts
      - name: Render each template with zero and one collection, then npm ci and npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: node scripts/testing/qualify-site-templates.mjs --out reports/site-templates.json
      - name: Retain the qualification summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-templates
          path: reports/site-templates.json
          if-no-files-found: warn
          retention-days: 7
