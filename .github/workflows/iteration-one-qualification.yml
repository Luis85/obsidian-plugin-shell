name: First iteration qualification
on:
  push:
    branches: [build/iteration-one]
    paths: [.stage/**, .github/workflows/iteration-one-qualification.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 24.21.0, package-manager-cache: false }
      - name: Materialize and retain the reviewed source tree
        run: python3 .stage/materialize.py
        env: { GH_TOKEN: '${{ github.token }}' }
      - name: Install the qualified exact dependency graph
        run: npm ci
      - name: Verify the first iteration and previous baseline
        run: npm run verify
      - name: Measure selected core coverage
        run: npm run test:coverage
      - name: Provision selected Chromium
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Test actual served showcase
        run: npm run test:e2e
      - name: Provision optional native smoke launcher
        if: always()
        run: npm install --prefix .native-runner --save-exact obsidian-launcher@3.2.1
      - name: Test exact candidate in isolated Obsidian
        if: always()
        run: xvfb-run -a node scripts/testing/check-native.mjs --allow-download
      - name: Retain actual results and installable candidate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: iteration-one-evidence
          path: |
            reports/
            dist/
            package-lock.json
          retention-days: 3
          if-no-files-found: error
