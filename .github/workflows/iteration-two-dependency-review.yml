name: Iteration two dependency investigation
on:
  push:
    branches: [build/iteration-two]
    paths: ['.github/workflows/iteration-two-dependency-review.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Inspect current primary registry metadata and supported parent updates
        run: |
          mkdir -p reports/dependency-review
          for pkg in eslint-plugin-obsidianmd @microsoft/eslint-plugin-sdl eslint-plugin-import eslint-plugin-react; do
            npm view "$pkg" version dependencies peerDependencies dist --json > "reports/dependency-review/$(echo "$pkg" | tr '/@' '__').json"
          done
          cp package-lock.json reports/dependency-review/before-lock.json
          npm update --package-lock-only --ignore-scripts @microsoft/eslint-plugin-sdl eslint-plugin-import eslint-plugin-react
          npm dedupe --package-lock-only --ignore-scripts
          cp package-lock.json reports/dependency-review/after-lock.json
          git diff --stat > reports/dependency-review/diff-stat.txt
          npm ci
          npm explain eslint --json > reports/dependency-review/eslint.json
          npm ls --all --json > reports/dependency-review/tree.json
          npm run verify > reports/dependency-review/verify.txt 2>&1
          npm audit --json > reports/dependency-review/audit.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: iteration-two-dependency-review
          path: reports/dependency-review/
          retention-days: 7
          if-no-files-found: error
