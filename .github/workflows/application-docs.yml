name: Typed Markdown documentation
# Also owns the command handbook: the former shell-cli-manual.yml contracts were
# a subset of the qualify job, so its dependency-free checks run here before the
# install and its HTML site builds in the site job below.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/cli/launcher.mjs'
      - 'src/cli/documentation/**'
      - 'src/cli/adapters/settings-documentation.ts'
      - 'src/cli/adapters/framework/**'
      - 'src/cli/adapters/framework-cli.ts'
      - 'src/cli/presentation/terminal/**'
      - 'src/tui/**'
      - 'src/cli/compiler/domain/**'
      - 'src/shared/platform/file-plan*.ts'
      - 'tooling/documentation/**'
      - 'src/cli/tests/framework-docs-*'
      - 'tooling/tests/framework-manual.checks.mjs'
      - 'src/cli/tests/interactive-maker-documentation-*'
      - 'src/cli/tests/fixtures/application-docs/**'
      - 'tooling/documentation/**'
      - 'docs/user-manual/shell-cli/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/actions/setup-qualified/**'
      - '.github/workflows/application-docs.yml'
      - '!projects/**'
  # release.yml calls this workflow with tier release: every matrix leg, whatever the path filters say.
  workflow_call:
    inputs:
      tier:
        description: integration (ready pull requests and main) or release (every matrix leg)
        type: string
        default: integration
  workflow_dispatch:
    inputs:
      tier:
        description: integration (three-OS matrices run Linux only) or release (every matrix leg)
        type: choice
        options: [integration, release]
        default: integration
permissions:
  contents: read
concurrency:
  group: application-docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    if: inputs.tier == 'release' || (github.event.pull_request.draft != true && !startsWith(github.head_ref, 'release/'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Retain exact review source without local secrets or dependencies
        run: |
          mkdir -p reports/application-docs
          git rev-parse HEAD > reports/application-docs/checkout.txt
          git archive --format=tar.gz HEAD -o reports/application-docs/source.tgz
      - uses: ./.github/actions/setup-qualified
      # These run before any dependency is installed: the manual tooling must stay
      # dependency-free. --check compares the committed handbook with the command
      # catalog without regenerating it first, so a stale handbook fails here.
      - name: Dependency-free manual contracts, committed-handbook drift and authored-example audit
        run: |
          set -o pipefail
          node --test tooling/tests/framework-manual.checks.mjs 2>&1 | tee reports/application-docs/manual-contracts.log
          node --experimental-strip-types tooling/documentation/manual.mjs --check 2>&1 | tee reports/application-docs/manual.log
          node --experimental-strip-types tooling/documentation/audit.mjs 2>&1 | tee -a reports/application-docs/manual.log
      - name: Retain the checked command handbook
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shell-cli-manual-markdown-${{ matrix.os }}
          path: docs/user-manual/shell-cli/
          retention-days: 7
          if-no-files-found: error
      - name: Install the committed dependency lock without lifecycle scripts
        run: node "$QUALIFIED_NPM" ci --ignore-scripts --no-audit --no-fund
      - name: Build the standalone CLI for documentation and setup contracts
        run: node "$QUALIFIED_NPM" run build:cli
      - name: Record exact toolchain
        run: |
          node -p 'JSON.stringify({node:process.version,yaml:require("yaml/package.json").version,typescript:require("typescript/package.json").version},null,2)' > reports/application-docs/toolchain.json
      - name: Full repository analyzer and architecture gates
        if: runner.os == 'Linux'
        run: |
          set -o pipefail
          node tooling/quality/check-analyzer.mjs 2>&1 | tee reports/application-docs/analyzer.log
          node tooling/quality/check-architecture.mjs 2>&1 | tee reports/application-docs/architecture.log
          node tooling/compiler/check-architecture.mjs 2>&1 | tee -a reports/application-docs/architecture.log
      - name: Require and execute every documentation contract suite
        run: |
          set -o pipefail
          node -e 'for(const name of ["model","codec","operations","kit","safety"])if(!require("node:fs").existsSync("tests/tooling/framework-docs-"+name+".checks.mjs"))throw Error("Missing documentation suite: "+name)'
          node --experimental-strip-types --test src/cli/tests/framework-docs-model.checks.mjs src/cli/tests/framework-docs-codec.checks.mjs src/cli/tests/framework-docs-operations.checks.mjs src/cli/tests/framework-docs-kit.checks.mjs src/cli/tests/framework-docs-safety.checks.mjs src/cli/tests/interactive-maker-documentation-core.checks.mjs src/cli/tests/interactive-maker-documentation-codec.checks.mjs src/cli/tests/interactive-maker-documentation-model.checks.mjs src/cli/tests/interactive-maker-documentation-plan.checks.mjs 2>&1 | tee reports/application-docs/tests.log
      - name: Preserve existing CLI and setup contracts
        run: |
          set -o pipefail
          node --experimental-strip-types --test src/cli/tests/framework-core.checks.mjs tooling/tests/framework-manual.checks.mjs src/cli/tests/framework-cli-guidance.checks.mjs src/cli/tests/framework-documents.checks.mjs src/cli/tests/framework-input-style.checks.mjs src/cli/tests/framework-setup-journey.checks.mjs src/cli/tests/framework-handout.checks.mjs src/cli/tests/framework-handout-integration.checks.mjs 2>&1 | tee reports/application-docs/regressions.log
      - name: Retain scope-labeled results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-docs-qualification-${{ matrix.os }}
          path: reports/application-docs/
          retention-days: 7
          if-no-files-found: warn
  site:
    name: Command handbook site
    if: inputs.tier == 'release' || (github.event.pull_request.draft != true && !startsWith(github.head_ref, 'release/'))
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-qualified
      - name: Install the isolated renderer from its committed lock without lifecycle scripts
        run: node "$QUALIFIED_NPM" ci --prefix tooling/documentation --ignore-scripts --no-audit --no-fund
      - name: Build source comments and handbook into HTML
        run: node "$QUALIFIED_NPM" --prefix tooling/documentation run build
      - name: Prove the site build left the committed handbook unchanged
        run: git diff --exit-code -- docs/user-manual/shell-cli/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: shell-cli-manual-site
          path: |
            reports/shell-cli-manual/
            tooling/documentation/package-lock.json
          retention-days: 14
          if-no-files-found: error
