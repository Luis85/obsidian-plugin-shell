name: Typed Markdown documentation
on:
  pull_request:
    paths:
      - 'scripts/application-docs/**'
      - 'scripts/framework/**'
      - 'scripts/shared/file-plan.mjs'
      - 'tests/tooling/framework-docs-*'
      - 'tests/fixtures/application-docs/**'
      - 'docs/user-manual/shell-cli/**'
      - '.github/workflows/application-docs.yml'
permissions:
  contents: read
concurrency:
  group: application-docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Retain exact review source without local secrets or dependencies
        run: |
          mkdir -p reports/application-docs
          git rev-parse HEAD > reports/application-docs/checkout.txt
          git archive --format=tar.gz HEAD -o reports/application-docs/source.tgz
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Select the qualified npm in runner scratch
        run: |
          npm install --prefix "$RUNNER_TEMP/qualified-npm" --ignore-scripts --no-fund --package-lock=false npm@11.19.1
          echo "QUALIFIED_NPM=$RUNNER_TEMP/qualified-npm/node_modules/npm/bin/npm-cli.js" >> "$GITHUB_ENV"
      - name: Install the committed dependency lock without lifecycle scripts
        run: node "$QUALIFIED_NPM" ci --ignore-scripts --no-audit --no-fund
      - name: Record exact toolchain
        run: |
          node -p 'JSON.stringify({node:process.version,yaml:require("yaml/package.json").version,typescript:require("typescript/package.json").version},null,2)' > reports/application-docs/toolchain.json
      - name: Typecheck the shared operation and documentation boundaries
        run: |
          set -o pipefail
          node "$QUALIFIED_NPM" run typecheck:framework 2>&1 | tee reports/application-docs/typecheck.log
      - name: Require and execute every documentation contract suite
        run: |
          set -o pipefail
          node -e 'for(const name of ["model","codec","operations","kit"])if(!require("node:fs").existsSync("tests/tooling/framework-docs-"+name+".checks.mjs"))throw Error("Missing documentation suite: "+name)'
          node --experimental-strip-types --test tests/tooling/framework-docs-model.checks.mjs tests/tooling/framework-docs-codec.checks.mjs tests/tooling/framework-docs-operations.checks.mjs tests/tooling/framework-docs-kit.checks.mjs 2>&1 | tee reports/application-docs/tests.log
      - name: Preserve existing CLI and setup contracts
        run: |
          set -o pipefail
          node --experimental-strip-types --test tests/tooling/framework-core.checks.mjs tests/tooling/framework-manual.checks.mjs tests/tooling/framework-cli-guidance.checks.mjs tests/tooling/framework-documents.checks.mjs tests/tooling/framework-input-style.checks.mjs tests/tooling/framework-setup-journey.checks.mjs 2>&1 | tee reports/application-docs/regressions.log
      - name: Generate and audit the command handbook
        run: |
          set -o pipefail
          node --experimental-strip-types scripts/documentation/manual.mjs 2>&1 | tee reports/application-docs/manual.log
          node --experimental-strip-types scripts/documentation/manual.mjs --check 2>&1 | tee -a reports/application-docs/manual.log
          node --experimental-strip-types scripts/documentation/audit.mjs 2>&1 | tee -a reports/application-docs/manual.log
      - name: Retain scope-labeled results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: application-docs-qualification-${{ matrix.os }}
          path: reports/application-docs/
          retention-days: 7
          if-no-files-found: warn
