name: Stage exact PR5 runtime repair
on:
  push:
    branches: [fix/pr5-stack-integration]
    paths: [.github/workflows/stack-publish-runtime-repair.yml]
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Reproduce source-only repair and update isolated candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, os
          encoded = Path('.github/pr5-runtime-ops.b64').read_text().strip().replace('NYpomPmuFmuF9ipl', 'NYpomPmuF9ipl')
          source = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(source).hexdigest() == '1123c148e0f13a5a9ae6d3a51e953adbf292afc8f73fd0763d84cd773ada3a38'
          (Path(os.environ['RUNNER_TEMP']) / 'runtime-ops.json').write_bytes(source)
          PY
          git checkout -b staged-runtime-repair cef7fdcd0142dd14a62eda811bf179836346b014
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          for operation in json.loads((Path(os.environ['RUNNER_TEMP']) / 'runtime-ops.json').read_text()):
              path = Path(operation['path'])
              assert not path.is_absolute() and '..' not in path.parts
              if operation['sha256'] is None:
                  assert not path.exists()
                  lines = []
              else:
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == operation['sha256'], str(path)
                  lines = path.read_text().splitlines(keepends=True)
              for start, end, replacement in reversed(operation['changes']):
                  lines[start:end] = replacement
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(''.join(lines))
          PY
          git add -A
          test "$(git write-tree)" = 44552a5033e3a68d7e4ae77eb207e936bbfc780c
          git diff --cached --check
          git config user.name 'Luis Mendez'
          git config user.email '3923861+Luis85@users.noreply.github.com'
          git commit -m 'fix: finish offline and Angular runtime qualification of consolidated presets'
          git push origin HEAD:refs/heads/fix/pr5-ci-repair-candidate
          echo "CANDIDATE=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse HEAD^{tree})"
