name: Workbench source snapshot
on:
  push:
    branches: [chore/workbench-golden-qualification]
    paths: [.github/workflows/workbench-source-snapshot.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f7050739192f5e9c0a7642dcb27b9effc42d557b
          persist-credentials: false
      - name: Capture reviewed source
        run: |
          mkdir -p "$RUNNER_TEMP/workbench-source"
          git archive --format=tar.gz -o "$RUNNER_TEMP/workbench-source/source.tar.gz" HEAD
          git ls-tree -r HEAD > "$RUNNER_TEMP/workbench-source/tree.txt"
          cd "$RUNNER_TEMP/workbench-source" && sha256sum source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: workbench-prototype-comparison-source
          path: ${{ runner.temp }}/workbench-source/
          retention-days: 1
