name: Stack repair tooling
on:
  push:
    branches: [fix/pr5-stack-integration]
    paths: [.github/workflows/stack-qualification.yml]
permissions:
  contents: read
  actions: write
jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Cancel only obsolete checks on the two merged source branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for branch in feat%2Finteractive-maker-cli feat%2Fproject-presets-prototype; do
            for status in queued in_progress pending; do
              gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?branch=$branch&status=$status&per_page=100" --jq '.workflow_runs[].id' | while read -r id; do
                gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" || true
              done
            done
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d84ce5656712cd3efe4843088f78fd4984720a22
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install and retain repository-locked tools without credentials or font binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qualified-tools/bin"
          npm install --prefix "$RUNNER_TEMP/qualified-tools/npm" --ignore-scripts --no-fund --package-lock=false npm@11.19.1
          node "$RUNNER_TEMP/qualified-tools/npm/node_modules/npm/bin/npm-cli.js" ci --no-fund
          cp "$(command -v node)" "$RUNNER_TEMP/qualified-tools/bin/node"
          cp package-lock.json "$RUNNER_TEMP/qualified-tools/package-lock.json"
          node --version > "$RUNNER_TEMP/qualified-tools/versions.txt"
          node "$RUNNER_TEMP/qualified-tools/npm/node_modules/npm/bin/npm-cli.js" --version >> "$RUNNER_TEMP/qualified-tools/versions.txt"
          tar -czf "$RUNNER_TEMP/qualified-tools/dependencies.tar.gz" --exclude='*.ttf' --exclude='*.otf' --exclude='*.woff' --exclude='*.woff2' node_modules
          tar -czf "$RUNNER_TEMP/qualified-tools.tar.gz" -C "$RUNNER_TEMP" qualified-tools
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qualified-repair-tools
          path: ${{ runner.temp }}/qualified-tools.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
