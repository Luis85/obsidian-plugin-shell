name: Snapshot reconciled PR54
on:
  push:
    branches: [chore/companion-starter-build-inputs]
    paths: [.github/workflows/snapshot-reconciled-pr54.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8ab047ca77d110f8164972118e583914fe95d825
          persist-credentials: false
      - name: Archive exact source
        run: |
          mkdir -p "$RUNNER_TEMP/pr54"
          git archive --format=tar.gz -o "$RUNNER_TEMP/pr54/source.tar.gz" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/pr54/sha.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/pr54/tree.txt"
          cd "$RUNNER_TEMP/pr54" && sha256sum source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reconciled-pr54-source
          path: ${{ runner.temp }}/pr54/
          retention-days: 1
