name: Qualify iteration-one dependencies
on:
  push:
    branches: [build/iteration-one]
    paths: [.github/workflows/qualify-iteration-one.yml, scripts/build/qualify-dependencies.mjs]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: node scripts/build/qualify-dependencies.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: iteration-one-toolchain
          path: .qualification/export/
          retention-days: 3
          if-no-files-found: error
