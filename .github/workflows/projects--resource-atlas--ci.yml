# Generated from projects/resource-atlas/.github/workflows/ci.yml by `npm run projects:sync`.
# Edit the project's own workflow and re-run the sync; never edit this copy.

name: "resource-atlas: CI"
# `check` (build and protocol tests) always runs. The `browser` job opens the built prototype in Chromium; it is
# end-to-end, so it runs on `main` and, on a pull request or manual run, only when opted in (the `e2e` label, or the
# `e2e` input of a manual run).
on:
  push:
    branches: [ main ]
    paths:
      - projects/resource-atlas/**
      - .github/workflows/projects--resource-atlas--ci.yml
  pull_request:
    types: [ opened, synchronize, reopened, labeled ]
    paths:
      - projects/resource-atlas/**
      - .github/workflows/projects--resource-atlas--ci.yml
  workflow_dispatch:
    inputs:
      e2e:
        description: Also run the browser verification of the built prototype
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: projects-resource-atlas-ci-${{ github.ref }}${{ github.event.action == 'labeled' && format('-label-{0}', github.event.label.name) || '' }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: projects/resource-atlas/.nvmrc
          cache: npm
          cache-dependency-path: projects/resource-atlas/package-lock.json
      - name: Select the pinned npm
        run: |
          npm install --prefix "$RUNNER_TEMP/pinned-npm" --ignore-scripts --no-fund --package-lock=false npm@11.19.1
          echo "PINNED_NPM=$RUNNER_TEMP/pinned-npm/node_modules/npm/bin/npm-cli.js" >> "$GITHUB_ENV"
      - name: Install exact dependencies
        run: node "$PINNED_NPM" ci --no-fund
      - name: Gate (build the self-contained HTML, protocol tests)
        run: node "$PINNED_NPM" run check
  browser:
    if: github.event_name == 'push' || inputs.e2e == true || ((github.event.action != 'labeled' || github.event.label.name == 'e2e') && contains(github.event.pull_request.labels.*.name, 'e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: projects/resource-atlas/.nvmrc
          cache: npm
          cache-dependency-path: projects/resource-atlas/package-lock.json
      - name: Select the pinned npm
        run: |
          npm install --prefix "$RUNNER_TEMP/pinned-npm" --ignore-scripts --no-fund --package-lock=false npm@11.19.1
          echo "PINNED_NPM=$RUNNER_TEMP/pinned-npm/node_modules/npm/bin/npm-cli.js" >> "$GITHUB_ENV"
      - name: Install exact dependencies
        run: node "$PINNED_NPM" ci --no-fund
      - name: Install Chromium and its system libraries
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Build the prototype
        run: node "$PINNED_NPM" run build
      - name: Browser verification
        run: node "$PINNED_NPM" run test:e2e
      - name: Keep the browser result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-result
          path: projects/resource-atlas/.qa/
          retention-days: 14
          if-no-files-found: warn
defaults:
  run:
    working-directory: projects/resource-atlas
