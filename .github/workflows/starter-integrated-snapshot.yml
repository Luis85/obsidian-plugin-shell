name: Integrated starter source snapshot
on:
  push:
    branches: [chore/companion-starter-build-inputs]
    paths: [.github/workflows/starter-integrated-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 172e8ac164bf98fca8935a6435d722f17731139a
          persist-credentials: false
      - name: Capture exact integrated source
        run: |
          mkdir -p "$RUNNER_TEMP/integrated"
          git archive --format=tar.gz -o "$RUNNER_TEMP/integrated/source.tar.gz" HEAD
          git ls-tree -r HEAD > "$RUNNER_TEMP/integrated/tree.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/integrated/sha.txt"
          cd "$RUNNER_TEMP/integrated" && sha256sum source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: integrated-starter-source
          path: ${{ runner.temp }}/integrated/
          retention-days: 1
