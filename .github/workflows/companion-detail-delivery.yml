name: Companion detail editors delivery verification
on:
  push:
    branches: [work/companion-detail-editors-delivery]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Apply exact reviewed patch and assemble offline HTML
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 1637ecdd547d71ddecc05beb06a82a4dfc87ce27
          cat .detail-delivery.part-{1,2,3,4} > "$RUNNER_TEMP/detail.patch.xz"
          echo "4b3a4e12c518ec634a9c7aab74f5d6845fe464989924b5801a9d05acce7178ce  $RUNNER_TEMP/detail.patch.xz" | sha256sum -c -
          xz -dc "$RUNNER_TEMP/detail.patch.xz" > "$RUNNER_TEMP/detail.patch"
          git apply --unidiff-zero --check "$RUNNER_TEMP/detail.patch"
          git apply --unidiff-zero "$RUNNER_TEMP/detail.patch"
          python3 scripts/concepts/build-companion.py
          echo 'b8b4a28bdbb040ef5dd2ba6c44283a195e168b5c4fd687977a6a4fb7ee952b3f  docs/concepts/companion/index.html' | sha256sum -c -
          echo '113d5fcc481e542ed9aac4fb08575ad5f705015e0706de0c4f849f271cb55bf6  docs/concepts/companion/companion-project.json' | sha256sum -c -
          rm .detail-delivery.part-{1,2,3,4} .github/workflows/companion-detail-delivery.yml
          git add -A
          test "$(git write-tree)" = 013d10f501d1a4b40254fa8da2dfe0a1a242cd84
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(concept): assembled detail editors for verification'
          git push origin HEAD:work/companion-detail-editors-delivery
          printf 'Assembled commit: %s\nTree: %s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" >> "$GITHUB_STEP_SUMMARY"
      - name: Check assembly, contracts, generators and syntax
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/concepts/delivery
          python3 scripts/concepts/build-companion.py --check
          python3 -B tests/concepts/companion-assembly.test.py 2>&1 | tee reports/concepts/delivery/assembly.txt
          node --test tests/tooling/companion-details.checks.mjs tests/tooling/companion-project.checks.mjs tests/tooling/companion-storymaps.checks.mjs tests/tooling/test-data-*.checks.mjs 2>&1 | tee reports/concepts/delivery/contracts.txt
          node --experimental-strip-types --test tests/tooling/project-generator.checks.mjs 2>&1 | tee reports/concepts/delivery/generator.txt
          for file in docs/concepts/companion/src/*.js; do node --check "$file"; done
      - name: Provision pinned isolated browser tooling
        shell: bash
        run: |
          set -euo pipefail
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/companion-browsers"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/companion-browser-env"
          "$RUNNER_TEMP/companion-browser-env/bin/python" -m pip install playwright==1.57.0
          "$RUNNER_TEMP/companion-browser-env/bin/python" -m playwright install chromium
          "$RUNNER_TEMP/companion-browser-env/bin/python" - <<'PYTHON'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write('CHROMIUM_EXECUTABLE=' + pw.chromium.executable_path + '\n')
          PYTHON
      - name: Verify every browser suite including real-origin Storage
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/companion-browser-env/bin/python" scripts/concepts/run-browser-checks.py --real-storage 2>&1 | tee reports/concepts/delivery/browser.txt
      - name: Preserve source and evidence
        if: always()
        shell: bash
        run: |
          git archive --format=tar.gz HEAD -o "$RUNNER_TEMP/detail-editors-source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/detail-editors-source.commit"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/detail-editors-source.tree"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: companion-detail-editors-evidence
          path: |
            reports/concepts/
            docs/concepts/companion/index.html
            ${{ runner.temp }}/detail-editors-source.tar.gz
            ${{ runner.temp }}/detail-editors-source.commit
            ${{ runner.temp }}/detail-editors-source.tree
          retention-days: 7
          if-no-files-found: error
