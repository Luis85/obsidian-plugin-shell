name: Iteration two qualification
on:
  push:
    branches: [build/iteration-two]
permissions:
  contents: read
concurrency:
  group: iteration-two-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependency-research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Research supported remediation paths against the live registry
        shell: bash
        run: |
          mkdir -p reports/dependency-research
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; import {execFileSync} from "node:child_process"; const result={}; for(const name of ["esbuild","fontless","@nuxt/fonts","@unhead/bundler","unplugin","npm","@eslint/js","@eslint/compat","@types/node@24","obsidian-launcher"]){try{result[name]=JSON.parse(execFileSync("npm",["view",name,"version","engines","dependencies","peerDependencies","deprecated","--json"],{encoding:"utf8"}));}catch{result[name]={error:"registry query failed"};}} writeFileSync("reports/dependency-research/registry.json",JSON.stringify(result,null,2));'
          npm ci > reports/dependency-research/npm-ci.log 2>&1
      - name: Explore supported direct and transitive upgrades without overrides
        shell: bash
        run: |
          set +e
          npm install --save-exact --save-dev eslint@10.11.0 > reports/dependency-research/eslint-upgrade.log 2>&1
          echo "$?" > reports/dependency-research/eslint-upgrade.exit
          npm update esbuild fontless @nuxt/fonts @unhead/bundler unplugin > reports/dependency-research/transitive-update.log 2>&1
          echo "$?" > reports/dependency-research/transitive-update.exit
          npm audit --json > reports/dependency-research/audit-exploration.json
          echo "$?" > reports/dependency-research/audit-exploration.exit
          npm ls --all --json > reports/dependency-research/tree.json
          npm run lint > reports/dependency-research/lint.log 2>&1
          echo "$?" > reports/dependency-research/lint.exit
          git diff -- package.json package-lock.json > reports/dependency-research/lock-review.diff
          cp package.json package-lock.json reports/dependency-research/
          tar --exclude='*.ttf' --exclude='*.otf' --exclude='*.woff' --exclude='*.woff2' --exclude='*.eot' --exclude='*/.local-browsers/*' -czf offline-dependencies.tgz node_modules
      - name: Reproduce served baseline from the unmodified product source
        shell: bash
        run: |
          set +e
          npm run harness:build > reports/dependency-research/harness-build.log 2>&1
          node node_modules/@playwright/test/cli.js install --with-deps chromium > reports/dependency-research/browser-provision.log 2>&1
          npm run test:e2e > reports/dependency-research/baseline-e2e.log 2>&1
          echo "$?" > reports/dependency-research/baseline-e2e.exit
      - name: Retain research for review; these are not accepted release artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: iteration-two-dependency-research
          path: |
            reports/dependency-research/
            reports/e2e/results.json
            reports/e2e/artifacts/**/*.png
            offline-dependencies.tgz
          retention-days: 2
          if-no-files-found: error
