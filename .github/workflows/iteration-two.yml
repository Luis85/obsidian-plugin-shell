name: Iteration two qualification
on:
  push:
    branches: [build/iteration-two]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iteration-two-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependency-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: npm ci
      - run: node scripts/testing/dependency-candidate.mjs
      - name: Retain reviewed diff and temporary offline dependencies
        if: always()
        run: |
          git diff -- package.json package-lock.json > reports/dependency-candidate/lock-review.diff
          tar --exclude='*.ttf' --exclude='*.otf' --exclude='*.woff' --exclude='*.woff2' --exclude='*.eot' --exclude='*/.local-browsers/*' -czf offline-dependencies.tgz node_modules
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: iteration-two-supported-dependency-candidate
          path: |
            reports/dependency-candidate/
            offline-dependencies.tgz
          retention-days: 2
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install the reviewed lockfile
        run: npm ci
      - name: Verify the candidate
        run: npm run verify
      - name: Record selected-core coverage
        run: npm run test:coverage
      - name: Provision pinned Chromium
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Exercise the actual served application
        run: npm run test:e2e
      - name: Provision isolated native smoke provider
        if: always()
        run: npm install --prefix .native-runner --save-exact obsidian-launcher@3.2.1
      - name: Exercise exact candidate in isolated Obsidian
        if: always()
        run: xvfb-run -a node scripts/testing/check-native.mjs --allow-download
      - name: Archive tracked source
        if: always()
        run: git archive --format=zip --output=iteration-two-source.zip HEAD
      - name: Retain candidate and scope-labeled evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: iteration-two-candidate
          path: |
            reports/
            !reports/e2e/html/**
            !reports/**/*.ttf
            !reports/**/*.otf
            !reports/**/*.woff
            !reports/**/*.woff2
            dist/
            package-lock.json
            iteration-two-source.zip
          retention-days: 7
          if-no-files-found: error
