name: Independent Workbench distributions
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - 'configs/starters/**'
      - 'scripts/starters/**'
      - 'src/cli/adapters/starters/**'
      - 'scripts/companion/**'
      - 'scripts/companion-tools/**'
      - 'templates/**'
      - 'scripts/compiler/**'
      - 'src/cli/compiler/**'
      - 'scripts/concepts/**'
      - 'scripts/bundling/**'
      - 'docs/licenses/**'
      - 'tests/concepts/*-showcase.browser.mjs'
      - 'tests/concepts/starter-workspace.browser.mjs'
      - 'src/cli/adapters/framework/**'
      - 'src/cli/adapters/framework-cli.ts'
      - 'src/cli/presentation/terminal/**'
      - 'scripts/companion/starter-*.mjs'
      - 'src/cli/compiler/emitters/framework-docs.ts'
      - 'tests/tooling/starter-*.checks.mjs'
      - '.github/actions/setup-qualified/**'
      - '.github/workflows/starter-distribution.yml'
      - '!projects/**'
  # release.yml calls this workflow with tier release: every matrix leg, whatever the path filters say.
  workflow_call:
    inputs:
      tier:
        description: integration (ready pull requests and main) or release (every matrix leg)
        type: string
        default: integration
      e2e:
        description: also run the opt-in end-to-end steps (real browser, real Obsidian); tier release always runs them
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tier:
        description: integration (three-OS matrices run Linux only) or release (every matrix leg)
        type: choice
        options: [integration, release]
        default: integration
      e2e:
        description: also run the opt-in end-to-end steps (real browser, real Obsidian); tier release always runs them
        type: boolean
        default: false
permissions:
  contents: read
# A newer push to the same pull request supersedes the read-only asset build;
# manual dispatches still run to completion.
concurrency:
  group: starter-distribution-${{ github.ref }}${{ github.event.action == 'labeled' && format('-label-{0}', github.event.label.name) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  package:
    if: inputs.tier == 'release' || ((github.event.action != 'labeled' || github.event.label.name == 'e2e') && github.event.pull_request.draft != true && !startsWith(github.head_ref, 'release/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      source: ${{ steps.identity.outputs.source }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked dependencies with the .nvmrc Node and qualified npm
        uses: ./.github/actions/setup-qualified
        with:
          install: 'true'
          install-flags: --strict-allow-scripts
      - name: Test the independent definition contract
        run: |
          node --experimental-strip-types --test --test-concurrency=1 tests/tooling/starter-*.checks.mjs tests/tooling/project-starters.checks.mjs tests/tooling/framework-new-project.checks.mjs tests/tooling/framework-distribution.checks.mjs
      - name: Check suite registration and bounded asset contracts
        run: node scripts/testing/suites.mjs --check
      - name: Build current empty authoring and source-bound qualification input
        run: |
          node scripts/concepts/build-mvp.mjs
          node scripts/concepts/export-golden-project.mjs
          node scripts/concepts/export-golden-project.mjs --check
          node bin/app starters coverage feature-showcase --require-model-coverage --json
      - name: Generate and independently install the visual-feature showcase
        run: |
          node bin/app new "$RUNNER_TEMP/workbench-feature-showcase" --starter feature-showcase --yes --json
          cd "$RUNNER_TEMP/workbench-feature-showcase"
          node "$QUALIFIED_NPM" ci --strict-allow-scripts
          node "$QUALIFIED_NPM" run typecheck:project
          node "$QUALIFIED_NPM" test
          node "$QUALIFIED_NPM" run test:ui-effects
          node "$QUALIFIED_NPM" run testdata:check
          node "$QUALIFIED_NPM" run build
          node "$QUALIFIED_NPM" run build:clickdummy
      - name: Resolve the pinned Playwright version
        id: playwright
        if: inputs.tier == 'release' || inputs.e2e == true || contains(github.event.pull_request.labels.*.name, 'e2e')
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      # Same key as ci.yml and setup-qualified, so every workflow shares one browser download.
      - name: Restore the pinned Chromium download
        if: inputs.tier == 'release' || inputs.e2e == true || contains(github.event.pull_request.labels.*.name, 'e2e')
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Exercise current startup and the independently compiled UI in Chromium
        if: inputs.tier == 'release' || inputs.e2e == true || contains(github.event.pull_request.labels.*.name, 'e2e')
        run: |
          node node_modules/@playwright/test/cli.js install --with-deps chromium
          mkdir -p reports/feature-showcase
          cp "$RUNNER_TEMP/workbench-feature-showcase/clickdummy.html" reports/feature-showcase/clickdummy.html
          node tests/concepts/starter-workspace.browser.mjs
          node tests/concepts/feature-showcase.browser.mjs --html reports/feature-showcase/clickdummy.html
      - name: Retain source-bound starter and browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: companion-starter-evidence-${{ github.sha }}
          path: |
            reports/companion-mvp/build.json
            reports/companion-mvp/qualification-project.json
            reports/companion-mvp/starter-lifecycle/
            reports/feature-showcase/browser-evidence/
          retention-days: 14
          if-no-files-found: warn
      - name: Bind assets to exact checked-out source
        id: identity
        run: |
          SOURCE=$(git rev-parse HEAD)
          VERSION=$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json","utf8")).version')
          [[ "$SOURCE" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build separate release assets
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          SOURCE_COMMIT: ${{ steps.identity.outputs.source }}
        run: |
          mkdir -p reports/workbench-distributions
          node bin/app framework pack --out "reports/workbench-distributions/workbench-shell-$RELEASE_VERSION.zip" --yes --json
          node bin/app starters pack --out "reports/workbench-distributions/workbench-starters-$RELEASE_VERSION.zip" --yes --json
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const version = process.env.RELEASE_VERSION, sourceCommit = process.env.SOURCE_COMMIT;
          const root = 'reports/workbench-distributions/';
          const assets = [];
          for (const kind of ['shell', 'starters']) {
            const name = `workbench-${kind}-${version}.zip`, bytes = await readFile(root + name);
            assets.push({ kind, name, bytes: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex') });
          }
          await writeFile(root + 'workbench-distributions.json', JSON.stringify({ schemaVersion: 1, version, sourceCommit, starterSchemaVersion: 1, assets, publication: 'separate-explicit-approval' }, null, 2) + '\n');
          await writeFile(root + 'workbench-SHA256SUMS', assets.map(asset => `${asset.sha256}  ${asset.name}\n`).join(''));
          NODE
      - name: Retain separate assets and their manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workbench-distributions-${{ steps.identity.outputs.source }}
          path: reports/workbench-distributions/
          retention-days: 14
          if-no-files-found: error
