name: Candidate qualification
on:
  push:
    branches: [build/template-foundation, build/release-operations, build/runtime-authoring, codex/executable-qualification]
    paths-ignore: ['docs/**', 'README.md', 'AGENTS.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: candidate-qualification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Select npm independently without global installation
        run: |
          npm install --prefix "$RUNNER_TEMP/qualified-npm" --ignore-scripts --no-fund --package-lock=false npm@11.19.1
          echo "QUALIFIED_NPM=$RUNNER_TEMP/qualified-npm/node_modules/npm/bin/npm-cli.js" >> "$GITHUB_ENV"
      - name: Fresh strict-policy install of the committed lockfile
        run: node "$QUALIFIED_NPM" ci --strict-allow-scripts
      - name: Preserve source checkpoint and installed dependency provenance
        if: always()
        run: |
          mkdir -p reports/candidate-qualification
          git archive --format=zip --output=reports/candidate-qualification/candidate-source.zip HEAD
          node "$QUALIFIED_NPM" explain eslint --json > reports/candidate-qualification/eslint-provenance.json
          node "$QUALIFIED_NPM" ls --all --json > reports/candidate-qualification/dependency-tree.json
      - name: Retain exact source for interrupted-session recovery
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-recovery-source
          path: reports/candidate-qualification/candidate-source.zip
          retention-days: 7
          if-no-files-found: error
      - name: Rehearse the fixed source and retain the verified candidate
        env:
          SHELL_EVIDENCE_TOOLING: '1'
        run: |
          mkdir -p reports/candidate-qualification
          set -o pipefail
          VERSION=$(node -p "require('./manifest.json').version")
          node "$QUALIFIED_NPM" run release:rehearse -- --commit "$GITHUB_SHA" --version "$VERSION" 2>&1 | tee reports/candidate-qualification/verify.txt
          node scripts/quality/check-artifacts.mjs > reports/candidate-qualification/candidate-assets.json
      - name: Retain the built candidate for independent platform qualification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: retained-build
          path: |
            reports/release/
            reports/bundling/
            reports/candidate-qualification/candidate-assets.json
            dist/
          retention-days: 7
          if-no-files-found: error
      - name: Repeat deterministic runtime suites in fresh processes with no retries
        run: |
          set -o pipefail
          for run in 1 2 3; do node scripts/testing/evidence-cli.mjs run runtime 2>&1 | tee "reports/candidate-qualification/runtime-$run.txt"; done
      - name: Record separately scoped coverage
        run: |
          set -o pipefail
          node "$QUALIFIED_NPM" run test:coverage 2>&1 | tee reports/candidate-qualification/coverage-core.txt
          node scripts/testing/evidence-cli.mjs run coverage 2>&1 | tee reports/candidate-qualification/coverage-production.txt
          node scripts/testing/evidence-cli.mjs run artifact
          node scripts/testing/asset-sizes.mjs > reports/candidate-qualification/asset-sizes.json
      - name: Provision pinned Chromium
        run: |
          node node_modules/@playwright/test/cli.js install --with-deps chromium
          sudo apt-get install -y xdotool
      - name: Exercise actual served components and capture scope-labeled screenshots
        run: node scripts/testing/evidence-cli.mjs run browser
      - name: Provision isolated native host provider
        run: node "$QUALIFIED_NPM" install --prefix .native-runner --save-exact obsidian-launcher@3.2.1
      - name: Verify the unchanged installed candidate in three fresh native sessions, no retries
        run: |
          for run in 1 2 3; do
            xvfb-run -a -s '-screen 0 2200x1400x24' node scripts/testing/evidence-cli.mjs run native --allow-download
            mv reports/native "reports/native-run-$run"
          done
          cp -R reports/native-run-3 reports/native
      - name: Retain shared-runner timing samples separately from reference budgets
        run: xvfb-run -a -s '-screen 0 2200x1400x24' node scripts/testing/check-native.mjs --allow-download --performance
      - name: Reconcile every registered evidence attempt and retain all acceptance gaps
        if: always()
        run: |
          for session in reports/evidence/*; do
            node scripts/testing/evidence-cli.mjs report "$session" > "reports/candidate-qualification/acceptance-$(basename "$session").json" || exit $?
          done
      - name: Live security gate, all installed dependency categories
        if: always()
        run: node "$QUALIFIED_NPM" run check:security
      - name: Confirm accepted asset identity and archive source
        if: success()
        run: |
          node scripts/quality/check-artifacts.mjs > reports/candidate-qualification/final-assets.json
          cmp reports/candidate-qualification/candidate-assets.json reports/candidate-qualification/final-assets.json
          git diff --exit-code -- package-lock.json
          PLUGIN_ID=$(node --input-type=module -e 'import { readNativeIdentity } from "./scripts/testing/native-identity.mjs"; console.log((await readNativeIdentity()).id)')
          mkdir -p "package/$PLUGIN_ID"
          cp dist/main.js dist/manifest.json dist/styles.css "package/$PLUGIN_ID/"
          cd package && zip -r ../candidate-plugin.zip "$PLUGIN_ID"
      - name: Retain candidate and sanitized, scope-labeled evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qualified-candidate
          path: |
            reports/
            !reports/e2e/html/**
            !reports/**/*.ttf
            !reports/**/*.otf
            !reports/**/*.woff
            !reports/**/*.woff2
            dist/
            candidate-plugin.zip
          retention-days: 7
          if-no-files-found: error
