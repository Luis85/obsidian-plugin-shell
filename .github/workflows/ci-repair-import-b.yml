name: Import verified CI repair commits
on:
  push:
    branches: [chore/ci-repair-snapshots-20260927]
    paths: [.github/workflows/ci-repair-import-b.yml]
permissions:
  contents: read
jobs:
  import:
    if: github.repository == 'Luis85/obsidian-plugin-shell'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 88472e856e6903c920a467a6ca236fdd57ac35e1
          fetch-depth: 0
      - name: Verify exact objects and publish only the temporary transport ref
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, pathlib, subprocess, tempfile
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          parts = [pathlib.Path('.ci-repair/resume-b') / f'{i}.txt' for i in range(4)]
          assert all(p.is_file() and not p.is_symlink() and p.stat().st_size <= 5000 for p in parts)
          raw = base64.b64decode(''.join(p.read_text() for p in parts), validate=True)
          assert hashlib.sha256(raw).hexdigest() == '8910cb319ec07e82706f171c579465801f58424f51385faf52bf80dabe6dd847'
          carrier = '92d665e2d1fedd47a12c280f9a3266553641cdd5'
          expected = {
              '0053981dda1d6ecd4ba12c58df492e6ce3f44f83': ('97d2cb7b793f706785df51cab9e6c72ba2406311', '8d26db76f369e9f33ba12754d46102b4a4abeb30'),
              'b221fbcc8c1ab4b00a8ff902b09ec4d60e0f002c': ('d5107718b0cfdf887b6eb9dd9a62164a6039bb3b', '6bf7c4ccedcd031b8c1ea7fbac9940ce946af504'),
              'd64f2748276efcbc420231c7a41aa4e3de00989f': ('417b892d2e5aa01ba00127b04c1474a6970f44fa', '025073de389a68a394957bbbdfea164741708c4e'),
              '1dd9057086b43575bfb4c8e34da454718fb9cd3a': ('b51d9b84359e36425c2400cb949ec0fa3ed13187', '560ad1031fd4101380b122e2ca489f22499c9604'),
              '47a20b243533960c424934e5d6e56e1c188e07d4': ('ab098402980b6a477deb5d6f73c8f86cde778c16', '04844ed0c09293415444882380f8129c72ed4130'),
              'c755a7556939c631a2381ce59adabe829d048784': ('333ef5687754ea575c4c8da877c7fab488bf75d5', '4ee2d8288e60251145b9db41614c97d08e851b07'),
          }
          with tempfile.TemporaryDirectory() as tmp:
              bundle = pathlib.Path(tmp) / 'repairs.bundle'
              bundle.write_bytes(raw)
              git('bundle', 'verify', str(bundle))
              git('fetch', str(bundle), 'refs/repair/resume-b:refs/repair/resume-b')
          assert git('rev-parse', 'refs/repair/resume-b') == carrier
          assert git('show', '-s', '--format=%P', carrier).split() == list(expected)
          for sha, (tree, old) in expected.items():
              assert git('rev-parse', sha + '^{tree}') == tree
              git('merge-base', '--is-ancestor', old, sha)
              git('diff', '--check', old, sha)
              assert not any(p.startswith('.ci-repair/') for p in git('ls-tree', '-r', '--name-only', sha).splitlines())
              print(sha, tree)
          target = 'refs/heads/chore/ci-repair-import-20260927-b'
          current = git('ls-remote', '--heads', 'origin', target)
          if current:
              assert current.split()[0] == carrier, 'Transport ref already exists with different content'
          else:
              git('push', 'origin', carrier + ':' + target)
          print('Exact repaired objects imported. No pull request branch was updated by this job.')
          PY
