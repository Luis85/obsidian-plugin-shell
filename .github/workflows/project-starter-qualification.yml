name: Project starter qualification
on:
  pull_request:
    paths-ignore:
      - 'projects/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: project-starters-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Each starter still runs its own discovery, plan, apply, explicit install,
  # clean install, typecheck, test, build and target smoke in a disposable
  # workspace and writes reports/project-starters/<id>/; grouping about three
  # per job (as ci.yml's starter job does) avoids eight runner slots of setup.
  generated-project:
    name: generated-project (${{ matrix.ids }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: plugin
            ids: plugin-nuxtui plugin-vanilla plugin-angular
          - group: webapp
            ids: webapp-nuxtui webapp-vanilla webapp-angular
          - group: hybrid
            ids: hybrid-nuxtui hybrid-vanilla hybrid-angular
          - group: website-cli
            ids: website cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every group holds a browser-target starter, so each provisions Chromium.
      - uses: ./.github/actions/setup-qualified
        with:
          install: 'true'
          install-flags: --no-fund
          playwright: with-deps
      - name: Generate, resolve, rebuild and smoke-test selected targets of each starter
        env:
          STARTER_IDS: ${{ matrix.ids }}
        run: |
          failed=""
          for id in $STARTER_IDS; do
            echo "::group::Starter $id"
            node scripts/compiler/qualify-project-starters.mjs --starter "$id" --execute || failed="$failed $id"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::Project starter qualification failed:$failed"; exit 1; fi
      - name: Retain logs, resolved locks and built prototypes per starter
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: project-starters-${{ matrix.group }}
          path: reports/project-starters
          if-no-files-found: error
          retention-days: 7
  project-handoff:
    # A pushed project, cloned fresh, in a cloud-like session: Node 22 is the only Node, the SessionStart hook provisions the
    # qualified Node and the dependencies, then the commands an agent starts with run (check, doctor, ui status, e2e).
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # feature-showcase joins once its generated journey editor passes `npm run check` (the report names the failing step).
        starter: [quick-capture]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Remember the Node 22 prefix (the simulated cloud default)
        run: echo "CLOUD_NODE=$(dirname "$(dirname "$(command -v node)")")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Kept explicit rather than setup-qualified: the simulated cloud session
      # inherits this environment, so QUALIFIED_NPM must not be exported here.
      - name: Install exact repository toolchain
        run: |
          npm install --prefix "$RUNNER_TEMP/qualified-npm" --ignore-scripts --no-fund --package-lock=false npm@11.19.1
          node "$RUNNER_TEMP/qualified-npm/node_modules/npm/bin/npm-cli.js" ci --no-fund
      - name: Provision Chromium for the e2e step
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Generate, push-simulate (git clone) and replay a cloud session start
        run: node scripts/testing/qualify-project-handoff.mjs --starter '${{ matrix.starter }}' --base-node "$CLOUD_NODE" --out 'reports/project-handoff-${{ matrix.starter }}.json'
      - name: Retain the step summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: project-handoff-${{ matrix.starter }}
          path: reports/project-handoff-${{ matrix.starter }}.json
          if-no-files-found: warn
          retention-days: 7
