name: Project starter qualification
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths-ignore:
      - 'projects/**'
  # release.yml calls this workflow with tier release: every matrix leg, whatever the path filters say.
  workflow_call:
    inputs:
      tier:
        description: integration (ready pull requests and main) or release (every matrix leg)
        type: string
        default: integration
      e2e:
        description: also run the opt-in end-to-end steps (real browser, real Obsidian); tier release always runs them
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tier:
        description: integration (three-OS matrices run Linux only) or release (every matrix leg)
        type: choice
        options: [integration, release]
        default: integration
      e2e:
        description: also run the opt-in end-to-end steps (real browser, real Obsidian); tier release always runs them
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: project-starters-${{ github.ref }}${{ github.event.action == 'labeled' && format('-label-{0}', github.event.label.name) || '' }}
  cancel-in-progress: true
jobs:
  # Each starter still runs its own discovery, plan, apply, explicit install,
  # clean install, typecheck, test, build and target smoke in a disposable
  # workspace and writes reports/project-starters/<id>/; grouping about three
  # per job (as ci.yml's starter job does) avoids eight runner slots of setup.
  generated-project:
    name: generated-project (${{ matrix.ids }})
    if: inputs.tier == 'release' || ((github.event.action != 'labeled' || github.event.label.name == 'e2e') && github.event.pull_request.draft != true && !startsWith(github.head_ref, 'release/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: plugin
            ids: plugin-nuxtui plugin-vanilla plugin-angular
          - group: webapp
            ids: webapp-nuxtui webapp-vanilla webapp-angular
          - group: hybrid
            ids: hybrid-nuxtui hybrid-vanilla hybrid-angular
          - group: website-cli
            ids: website cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every group holds a browser-target starter, so each provisions Chromium when the e2e smoke runs.
      - uses: ./.github/actions/setup-qualified
        with:
          install: 'true'
          install-flags: --no-fund
          playwright: ${{ (inputs.tier == 'release' || inputs.e2e == true || contains(github.event.pull_request.labels.*.name, 'e2e')) && 'with-deps' || '' }}
      # Without the e2e opt-in each starter still generates, installs, typechecks, tests and builds; only the browser smoke waits.
      - name: Generate, resolve and rebuild each starter without the browser smoke
        if: ${{ !(inputs.tier == 'release' || inputs.e2e == true || contains(github.event.pull_request.labels.*.name, 'e2e')) }}
        env:
          STARTER_IDS: ${{ matrix.ids }}
        run: |
          failed=""
          for id in $STARTER_IDS; do
            echo "::group::Starter $id"
            node tooling/compiler/qualify-project-starters.mjs --starter "$id" --execute --no-browser || failed="$failed $id"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::Project starter qualification failed:$failed"; exit 1; fi
      - name: Generate, resolve, rebuild and smoke-test selected targets of each starter
        if: inputs.tier == 'release' || inputs.e2e == true || contains(github.event.pull_request.labels.*.name, 'e2e')
        env:
          STARTER_IDS: ${{ matrix.ids }}
        run: |
          failed=""
          for id in $STARTER_IDS; do
            echo "::group::Starter $id"
            node tooling/compiler/qualify-project-starters.mjs --starter "$id" --execute || failed="$failed $id"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::Project starter qualification failed:$failed"; exit 1; fi
      - name: Retain logs, resolved locks and built prototypes per starter
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: project-starters-${{ matrix.group }}
          path: reports/project-starters
          if-no-files-found: error
          retention-days: 7
  project-handoff:
    if: inputs.tier == 'release' || ((github.event.action != 'labeled' || github.event.label.name == 'e2e') && github.event.pull_request.draft != true && !startsWith(github.head_ref, 'release/'))
    # A pushed project, cloned fresh, in a cloud-like session: Node 22 is the only Node, the SessionStart hook provisions the
    # qualified Node and the dependencies, then the commands an agent starts with run (check, doctor, ui status, e2e).
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # feature-showcase joins once its generated journey editor passes `npm run check` (the report names the failing step).
        starter: [quick-capture]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Remember the Node 22 prefix (the simulated cloud default)
        run: echo "CLOUD_NODE=$(dirname "$(dirname "$(command -v node)")")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Kept explicit rather than setup-qualified: the simulated cloud session
      # inherits this environment, so QUALIFIED_NPM must not be exported here.
      - name: Install exact repository toolchain
        run: |
          npm install --prefix "$RUNNER_TEMP/qualified-npm" --ignore-scripts --no-fund --package-lock=false npm@11.19.1
          node "$RUNNER_TEMP/qualified-npm/node_modules/npm/bin/npm-cli.js" ci --no-fund
          node tooling/bundling/build-cli.mjs
      - name: Provision Chromium for the e2e step
        if: inputs.tier == 'release' || inputs.e2e == true || contains(github.event.pull_request.labels.*.name, 'e2e')
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      # --skip-e2e exits 3 (incomplete); that passes only when e2e is the one step that did not run and none failed.
      - name: Generate, push-simulate (git clone) and replay a cloud session start without e2e
        if: ${{ !(inputs.tier == 'release' || inputs.e2e == true || contains(github.event.pull_request.labels.*.name, 'e2e')) }}
        run: |
          status=0
          node tooling/testing/qualify-project-handoff.mjs --starter '${{ matrix.starter }}' --base-node "$CLOUD_NODE" --out 'reports/project-handoff-${{ matrix.starter }}.json' --skip-e2e || status=$?
          if [ "$status" -eq 3 ]; then
            node -e 'const s = require(process.argv[1]); const open = s.steps.filter(step => step.status !== "passed"); process.exit(open.length === 1 && open[0].name === "e2e" && open[0].status === "not-run" ? 0 : 1)' "$PWD/reports/project-handoff-${{ matrix.starter }}.json"
          else
            exit "$status"
          fi
      - name: Generate, push-simulate (git clone) and replay a cloud session start
        if: inputs.tier == 'release' || inputs.e2e == true || contains(github.event.pull_request.labels.*.name, 'e2e')
        run: node tooling/testing/qualify-project-handoff.mjs --starter '${{ matrix.starter }}' --base-node "$CLOUD_NODE" --out 'reports/project-handoff-${{ matrix.starter }}.json'
      - name: Retain the step summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: project-handoff-${{ matrix.starter }}
          path: reports/project-handoff-${{ matrix.starter }}.json
          if-no-files-found: warn
          retention-days: 7
