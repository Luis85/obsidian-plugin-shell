name: Exact workbench polish delivery (temporary)
on:
  push:
    branches: [docs/companion-plugin-prd]
    paths: [.github/workflows/workbench-polish-delivery.yml]
permissions:
  contents: read
jobs:
  blobs:
    if: github.repository == 'Luis85/obsidian-plugin-shell' && github.ref == 'refs/heads/docs/companion-plugin-prd'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Apply exact reviewed inputs and test without an API token
        run: python3 -B .github/workbench-polish-delivery/finalize.py apply
      - name: Preserve verified Git blobs without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/workbench-polish-delivery/finalize.py publish
      - name: Retain exact blob receipt for explicit delivery
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: workbench-polish-delivery-receipt
          path: ${{ runner.temp }}/workbench-polish-receipt.json
          retention-days: 7
          if-no-files-found: error
