name: Assemble generator detail source
on:
  push:
    branches: [work/generator-detail-implementation]
permissions:
  contents: write
jobs:
  assemble:
    if: ${{ github.event.head_commit.message == 'stage generator detail source' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Reconstruct exact implementation snapshot
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, lzma, hashlib, pathlib, subprocess
          raw = ''.join(pathlib.Path(f'.delivery/generator-{i}.b64').read_text() for i in range(3))
          patch = lzma.decompress(base64.b64decode(raw, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '350695081d4baf6bec083ed95e174d4fbb2b9e70d01b22f60a713846bab0989c'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          PY
          git add -A
          git update-index --force-remove .delivery/generator-0.b64 .delivery/generator-1.b64 .delivery/generator-2.b64 .github/workflows/generator-detail-delivery.yml
          test "$(git write-tree)" = "55e0c0710072d35b4a445a76ad48b57e59f6aeee"
          git add .delivery/generator-0.b64 .delivery/generator-1.b64 .delivery/generator-2.b64 .github/workflows/generator-detail-delivery.yml
          git -c user.name='OpenAI' -c user.email='noreply@openai.com' commit -m 'feat(generator): compile detail designs into executable Vue scaffolds'
          git push origin HEAD:refs/heads/work/generator-detail-implementation
