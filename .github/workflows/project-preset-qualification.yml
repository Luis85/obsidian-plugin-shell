name: Project preset qualification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: project-presets-${{ github.ref }}
  cancel-in-progress: true
jobs:
  generated-project:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {preset: plugin-nuxtui, framework: nuxtui}
          - {preset: plugin-vanilla, framework: vanilla}
          - {preset: plugin-angular, framework: angular}
          - {preset: webapp-nuxtui, framework: nuxtui}
          - {preset: webapp-vanilla, framework: vanilla}
          - {preset: website, framework: vanilla}
          - {preset: cli, framework: none}
          - {preset: hybrid, framework: nuxtui}
          - {preset: hybrid, framework: vanilla}
          - {preset: hybrid, framework: angular}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install exact repository toolchain
        run: |
          npm install --prefix "$RUNNER_TEMP/qualified-npm" --ignore-scripts --no-fund --package-lock=false npm@11.19.1
          echo "QUALIFIED_NPM=$RUNNER_TEMP/qualified-npm/node_modules/npm/bin/npm-cli.js" >> "$GITHUB_ENV"
          node "$RUNNER_TEMP/qualified-npm/node_modules/npm/bin/npm-cli.js" ci --no-fund
      - name: Provision browser for exact-artifact checks
        if: matrix.framework != 'none'
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Generate, resolve, rebuild and smoke-test selected targets
        run: node scripts/compiler/qualify-presets.mjs --preset '${{ matrix.preset }}' --framework '${{ matrix.framework }}' --execute
      - name: Retain logs, resolved lock and built prototype
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: project-preset-${{ matrix.preset }}-${{ matrix.framework }}
          path: reports/project-presets
          if-no-files-found: error
          retention-days: 7
