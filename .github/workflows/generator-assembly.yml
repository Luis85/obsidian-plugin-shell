name: Assemble generator implementation
on:
  push:
    branches: [work/19-project-generator]
permissions:
  contents: write
jobs:
  assemble:
    if: github.event.head_commit.message == 'build: stage exact generator implementation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Apply exact reviewed source snapshot
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, lzma, hashlib, subprocess, pathlib
          raw = ''.join(pathlib.Path(f'.delivery/generator-{i}.b64').read_text() for i in range(6))
          patch = lzma.decompress(base64.b64decode(raw, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '6dd57a42e2a31d03f037271cafdbb1878ae4f1c6f316b65e31f43ecd4d65cfa1'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          for i in range(6):
              pathlib.Path(f'.delivery/generator-{i}.b64').unlink()
          pathlib.Path('.github/workflows/generator-assembly.yml').unlink()
          PY
          git add -A
          test "$(git write-tree)" = "8fd7af6199e44a60c5d6aec6fc873207f8bb8201"
          git -c user.name='Luis Mendez' -c user.email='3923861+Luis85@users.noreply.github.com' commit -m 'feat(generator): compile companion designs into independent shell workspaces'
          git push origin HEAD:refs/heads/work/19-project-generator
