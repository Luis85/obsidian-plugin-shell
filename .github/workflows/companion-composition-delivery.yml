name: Store current composition documentation
on:
  push:
    branches: [work/companion-composition-delivery]
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Restore exact documentation patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^^{tree})" = f9a34d95d9506e31313cc864ca5bcb7d842f33fd
          echo 'e48ffde78bbb1c4d33d4cc41f0ecfed95fe3d40517c8e39f1b8af1635126aa17  .documentation.patch.xz' | sha256sum -c -
          xz -dc .documentation.patch.xz > "$RUNNER_TEMP/docs.patch"
          git apply --unidiff-zero --check "$RUNNER_TEMP/docs.patch"
          git apply --unidiff-zero "$RUNNER_TEMP/docs.patch"
          rm .documentation.patch.xz .github/workflows/companion-composition-delivery.yml
          git add -A
          test "$(git write-tree)" = 3637bd0fa8eb448cf275fee8e48a4f078751ebfe
          git diff --cached --check
      - name: Store five verified Markdown blobs without branch mutations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', 'HEAD^'], text=True).splitlines()
          if len(paths) != 5 or any(not p.endswith('.md') for p in paths):
              raise SystemExit('Unexpected documentation inventory')
          entries = []
          for name in paths:
              raw = pathlib.Path(name).read_bytes()
              sha = hashlib.sha1(('blob ' + str(len(raw)) + '\0').encode() + raw).hexdigest()
              req = urllib.request.Request('https://api.github.com/repos/Luis85/obsidian-plugin-shell/git/blobs', data=json.dumps({'content': base64.b64encode(raw).decode(), 'encoding': 'base64'}).encode(), method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  if json.load(response)['sha'] != sha:
                      raise SystemExit('Blob mismatch')
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': sha})
          pathlib.Path(os.environ['RUNNER_TEMP'], 'documentation-manifest.json').write_text(json.dumps(entries, indent=2) + '\n')
          print(json.dumps(entries, indent=2))
          PYTHON
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: composition-documentation-manifest
          path: ${{ runner.temp }}/documentation-manifest.json
          retention-days: 7
          if-no-files-found: error
