name: Recover companion composition source
on:
  push:
    branches: [work/companion-composition-delivery]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Restore exact staged source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/recovered" "$RUNNER_TEMP/delivery"
          cat .composition.part-{1,2,3,4,5,6,7} > "$RUNNER_TEMP/composition.patch.xz"
          echo "6082ecc90a6a3c4d949640f12eb1190cb830d534fc175ae643c00d69a5614104  $RUNNER_TEMP/composition.patch.xz" | sha256sum -c -
          git archive 5ddc7a278ba639fdc78b9294a55dfdc99c5279d2 | tar -xf - -C "$RUNNER_TEMP/recovered"
          git archive --format=tar.gz 5ddc7a278ba639fdc78b9294a55dfdc99c5279d2 -o "$RUNNER_TEMP/delivery/base-source.tar.gz"
          cd "$RUNNER_TEMP/recovered"
          git init -q
          git add -A
          test "$(git write-tree)" = b603efdba5e13f7024d42da816384d00e74d77e2
          git config user.name recovery
          git config user.email recovery@localhost
          git commit -qm base
          mkdir -p tests/fixtures/companion
          cp docs/concepts/companion/companion-project.json tests/fixtures/companion/detail-v3.json
          xz -dc "$RUNNER_TEMP/composition.patch.xz" > "$RUNNER_TEMP/composition.patch"
          git apply --unidiff-zero --check "$RUNNER_TEMP/composition.patch"
          git apply --unidiff-zero "$RUNNER_TEMP/composition.patch"
          python3 scripts/concepts/build-companion.py
          echo 'b94220c343f7fdd7e1d48aa3ba4380edb633274070bd02a30cd1921cc2e315bd  docs/concepts/companion/index.html' | sha256sum -c -
      - name: Reproduce golden JSON
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/browser-env"
          "$RUNNER_TEMP/browser-env/bin/pip" install playwright==1.57.0
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/browsers"
          "$RUNNER_TEMP/browser-env/bin/python" -m playwright install chromium
          export CHROMIUM_EXECUTABLE=$("$RUNNER_TEMP/browser-env/bin/python" -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          cd "$RUNNER_TEMP/recovered"
          "$RUNNER_TEMP/browser-env/bin/python" scripts/concepts/export-companion-project.py
          echo '7cdb262e03ea3d58dcbcacc6249aa637db9bf97f8028bb0b38d8b57c5424a2fe  docs/concepts/companion/companion-project.json' | sha256sum -c -
          git add -A
          test "$(git write-tree)" = b2d379c3ff0d249f599b620f2facf0cf447ccb5e
          git diff --cached --check
          git diff --cached --name-only > "$RUNNER_TEMP/delivery/changed-paths.txt"
          git diff --cached --binary > "$RUNNER_TEMP/delivery/composition.patch"
          git commit -qm recovered
          git archive --format=tar.gz HEAD -o "$RUNNER_TEMP/delivery/composition-source.tar.gz"
          git ls-tree -r HEAD > "$RUNNER_TEMP/delivery/tree.txt"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3cd1f7b04025df02a9fc1407fc598112a072a965
          path: latest-source
          persist-credentials: false
      - name: Preserve concurrent changes
        shell: bash
        run: |
          git -C latest-source archive --format=tar.gz HEAD -o "$RUNNER_TEMP/delivery/latest-source.tar.gz"
          git -C latest-source rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/delivery/latest-identity.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: recovered-composition-and-current-source
          path: ${{ runner.temp }}/delivery/
          retention-days: 7
          if-no-files-found: error
