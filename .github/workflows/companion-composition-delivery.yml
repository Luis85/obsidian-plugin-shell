name: Verify reconciled companion source
on:
  push:
    branches: [work/companion-composition-delivery]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Reconstruct exact integrated source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^^{tree})" = fc2582f3f1a0ea832f18ce2249d42968fea39643
          cat .reconcile.part-{1,2} > "$RUNNER_TEMP/reconcile.patch.xz"
          echo "9fee57e0a64a2d9a4fdf222824efff1df7e51234d8282d7feaaa54c67d80ed55  $RUNNER_TEMP/reconcile.patch.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/integrated" "$RUNNER_TEMP/evidence"
          git archive HEAD^ | tar -xf - -C "$RUNNER_TEMP/integrated"
          cd "$RUNNER_TEMP/integrated"
          git init -q
          git config user.name assembly
          git config user.email assembly@localhost
          git add -A
          test "$(git write-tree)" = fc2582f3f1a0ea832f18ce2249d42968fea39643
          git commit -qm baseline
          xz -dc "$RUNNER_TEMP/reconcile.patch.xz" > "$RUNNER_TEMP/reconcile.patch"
          git apply --unidiff-zero --check "$RUNNER_TEMP/reconcile.patch"
          git apply --unidiff-zero "$RUNNER_TEMP/reconcile.patch"
          python3 scripts/concepts/build-companion.py
          echo 'a2eb3c06921565a7794fbdd7616beb8bdb58c7bb5ce5de78ed3341769624ddca  docs/concepts/companion/index.html' | sha256sum -c -
      - name: Regenerate complete companion JSON and verify tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/browser-env"
          "$RUNNER_TEMP/browser-env/bin/pip" install playwright==1.57.0
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/browsers"
          "$RUNNER_TEMP/browser-env/bin/python" -m playwright install chromium
          export CHROMIUM_EXECUTABLE=$("$RUNNER_TEMP/browser-env/bin/python" -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          cd "$RUNNER_TEMP/integrated"
          "$RUNNER_TEMP/browser-env/bin/python" scripts/concepts/export-companion-project.py
          "$RUNNER_TEMP/browser-env/bin/python" scripts/concepts/export-companion-project.py --check
          echo 'c63076f2824c8d941b3fd7e6e37e95708672db4b36d12e16b997c2515eed96e2  docs/concepts/companion/companion-project.json' | sha256sum -c -
          git add -A
          test "$(git write-tree)" = f9a34d95d9506e31313cc864ca5bcb7d842f33fd
          git diff --cached --check
          python3 -B tests/concepts/companion-assembly.test.py 2>&1 | tee "$RUNNER_TEMP/evidence/assembly.txt"
          node --test tests/tooling/companion-composition.checks.mjs tests/tooling/companion-details.checks.mjs tests/tooling/companion-project.checks.mjs tests/tooling/companion-storymaps.checks.mjs tests/tooling/project-generator*.checks.mjs tests/tooling/test-data-*.checks.mjs 2>&1 | tee "$RUNNER_TEMP/evidence/contracts.txt"
      - name: Store verified blobs only, without changing any branch or tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cd "$RUNNER_TEMP/integrated"
          python3 - <<'PYTHON'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          paths = git('diff', '--cached', '--name-only').splitlines()
          if len(paths) != 22:
              raise SystemExit('Changed-path inventory mismatch')
          entries = []
          for name in paths:
              raw = pathlib.Path(name).read_bytes()
              sha = hashlib.sha1(('blob ' + str(len(raw)) + '\0').encode() + raw).hexdigest()
              if sha != git('hash-object', name):
                  raise SystemExit('Local bytes changed')
              req = urllib.request.Request('https://api.github.com/repos/Luis85/obsidian-plugin-shell/git/blobs', data=json.dumps({'content': base64.b64encode(raw).decode(), 'encoding': 'base64'}).encode(), method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  actual = json.load(response)['sha']
              if actual != sha:
                  raise SystemExit('Remote bytes changed')
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': sha})
          manifest = {'base_tree': 'fc2582f3f1a0ea832f18ce2249d42968fea39643', 'tree': git('write-tree'), 'files': entries}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'evidence/final-source-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest, indent=2))
          PYTHON
          git commit -qm verified
          git archive --format=tar.gz HEAD -o "$RUNNER_TEMP/evidence/integrated-source.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: reconciled-companion-source
          path: ${{ runner.temp }}/evidence/
          retention-days: 7
          if-no-files-found: error
