name: Apply tested starter checkpoint
on:
  push:
    branches: [feat/json-starters-on-pr5]
    paths: [.github/workflows/starter-checkpoint.yml]
permissions:
  contents: write
jobs:
  checkpoint:
    if: github.repository == 'Luis85/obsidian-plugin-shell' && github.ref == 'refs/heads/feat/json-starters-on-pr5'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Apply and verify the exact reviewed patch
        env:
          PATCH: 
        run: |
          test "$(git rev-parse HEAD^)" = 0b3124ab05a7e906d578e91b94e31bf4132f2ae8
          printf '%s' "$PATCH" | base64 -d | gzip -d > "$RUNNER_TEMP/checkpoint.patch"
          echo "faf4e390b6a74c9ddaa360621c75c0d2ba249f880a5d6149f0d679c151f1d2db  $RUNNER_TEMP/checkpoint.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/checkpoint.patch"
          git apply --index "$RUNNER_TEMP/checkpoint.patch"
          node --test tests/tooling/starter-manual.checks.mjs tests/tooling/framework-manual.checks.mjs
          node scripts/documentation/manual.mjs
          node scripts/documentation/manual.mjs --check
          git rm .github/workflows/starter-checkpoint.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(starters): register all starter commands in the generated manual'
          git push origin HEAD:refs/heads/feat/json-starters-on-pr5
