name: Assemble reviewed Project Starters source
on:
  push:
    branches: [staging/project-starters-20260925]
    paths:
      - '.project-starters-transfer/**'
      - '.github/workflows/project-starters-assemble.yml'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Verify exact baseline and source bytes
        run: |
          test "$(git rev-parse HEAD^)" = 5dcd886c0f9a588d28892bc92ec231266f5e54ca
          python3 - <<'PY'
          import hashlib, lzma
          from pathlib import Path
          raw=b''.join(Path(f'.project-starters-transfer/part-{i:02}.xz').read_bytes() for i in range(6))
          assert len(raw)==44560 and hashlib.sha256(raw).hexdigest()=='6d13d1ecd6e9e7ecaab728810d59fbc87ffc6322b753d0fce5ed3fc405f3f87b'
          patch=lzma.decompress(raw)
          assert len(patch)==944310 and hashlib.sha256(patch).hexdigest()=='22f2b0c8d9349bcf6693f0643ed5c55cb050df062a34f52d795456312e360e56'
          Path('/tmp/project-starters-reviewed.patch').write_bytes(patch)
          PY
          git apply --check --index --unidiff-zero /tmp/project-starters-reviewed.patch
          git apply --index --unidiff-zero /tmp/project-starters-reviewed.patch
          # Permanent workflow changes are published separately through the authorized connector.
          git restore --staged --worktree .github/workflows/project-generator.yml
      - name: Install isolated browser tooling
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
          python3 - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write('CHROMIUM_EXECUTABLE='+p.chromium.executable_path+'\n')
          PY
      - name: Rebuild and verify exact generated artifacts
        run: |
          python3 scripts/concepts/build-companion.py
          python3 scripts/concepts/export-companion-project.py
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          for name,size,sha in [('index.html',2315230,'2698d226db6142215a250cbd090ebaf20e1f940fd588f924445ddd8092c1c51b'),('companion-project.json',2291462,'a8d2756370053dafd05a90f5ecaa065ee976defe67910852a06c90027a62eda2')]:
              raw=(Path('docs/concepts/companion')/name).read_bytes()
              assert len(raw)==size and hashlib.sha256(raw).hexdigest()==sha,name
              print(name,size,sha)
          PY
          python3 tests/concepts/companion-assembly.test.py
          node --test tests/tooling/project-starters.checks.mjs tests/tooling/companion-project.checks.mjs tests/tooling/companion-composition.checks.mjs tests/tooling/project-generator-composition.checks.mjs
      - name: Retain assembled source only on staging branch
        run: |
          git add docs/concepts/companion/index.html docs/concepts/companion/companion-project.json
          git diff --cached --check
          if git diff --cached --name-only | grep '^.github/workflows/'; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(staging): assemble hash-verified Project Starters source'
          git push origin HEAD:refs/heads/staging/project-starters-20260925
          mkdir -p /tmp/starter-assembly
          git rev-parse HEAD > /tmp/starter-assembly/commit.txt
          git rev-parse HEAD^{tree} > /tmp/starter-assembly/tree.txt
          git diff --stat 5dcd886c0f9a588d28892bc92ec231266f5e54ca > /tmp/starter-assembly/diff.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reviewed-starter-assembly
          path: /tmp/starter-assembly/
          retention-days: 3
          if-no-files-found: error
