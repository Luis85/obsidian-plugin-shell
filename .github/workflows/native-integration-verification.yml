name: Native integration starters
on:
  push:
    branches: [feat/native-file-extension-starters]
permissions:
  contents: read
jobs:
  apply-reviewed-source:
    if: contains(github.event.head_commit.message, '[native-install]')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: feat/native-file-extension-starters
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Apply byte-verified source to the requested feature branch only
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --name-only e540157e63c9b81fdadb7bd84eca4aa56a8809b0 HEAD > "$RUNNER_TEMP/prior-paths"
          python3 - <<'PY'
          import os, pathlib
          paths=pathlib.Path(os.environ['RUNNER_TEMP'],'prior-paths').read_text().splitlines()
          allowed={'.github/workflows/native-integration-verification.yml', *[f'.github/native-source/part{i}.br' for i in range(1,5)]}
          assert set(paths) <= allowed, 'Unexpected concurrent feature edits; refusing to apply.'
          PY
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {brotliDecompressSync} from 'node:zlib';
          const bytes=Buffer.concat([1,2,3,4].map(i=>readFileSync(`.github/native-source/part${i}.br`)));
          if(createHash('sha256').update(bytes).digest('hex')!=='b2cc7963f8fb1c99e2227598f63c4100e0ead0c9f50d02dbb4af65068b781bef')throw Error('Reviewed source digest mismatch');
          writeFileSync(process.env.RUNNER_TEMP+'/native-source.patch',brotliDecompressSync(bytes));
          JS
          git apply --check --index --unidiff-zero "$RUNNER_TEMP/native-source.patch"
          git apply --index --unidiff-zero "$RUNNER_TEMP/native-source.patch"
          python3 scripts/concepts/build-companion.py
          git add docs/concepts/companion/index.html
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(native): add file-extension and context-menu starters, makers and Obsidian adapters'
          git push origin HEAD:refs/heads/feat/native-file-extension-starters
      - name: Install qualified dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/native-npm" --ignore-scripts --no-fund --package-lock=false npm@11.19.1
          node "$RUNNER_TEMP/native-npm/node_modules/npm/bin/npm-cli.js" ci --no-fund
      - name: Verify native source and generated projects
        env:
          QUALIFIED_NPM: ${{ runner.temp }}/native-npm/node_modules/npm/bin/npm-cli.js
        run: |
          node --test tests/tooling/native-integrations.checks.mjs
          node node_modules/typescript/bin/tsc --noEmit --project tsconfig.framework.json
          node node_modules/typescript/bin/tsc --noEmit --project tsconfig.generator.json
          node node_modules/vitest/vitest.mjs run tests/runtime/native-file-domain.test.ts tests/runtime/native-file-integration.test.ts
          node scripts/companion/qualify-starter.mjs custom-file-view
          node scripts/companion/qualify-starter.mjs context-menu
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-starter-qualification
          path: reports/project-starters/
          retention-days: 7
          if-no-files-found: ignore
