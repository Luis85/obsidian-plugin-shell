name: Native integration starters
on:
  push:
    branches: [feat/native-file-extension-starters]
  pull_request:
permissions:
  contents: read
concurrency:
  group: native-integrations-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install qualified dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/native-npm" --ignore-scripts --no-fund --package-lock=false npm@11.19.1
          node "$RUNNER_TEMP/native-npm/node_modules/npm/bin/npm-cli.js" ci --no-fund
      - name: Retain initial reproducible workspace
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[native-bootstrap]')
        run: |
          mkdir -p reports/native-integration
          git rev-parse HEAD > reports/native-integration/source-commit.txt
          tar -czf reports/native-integration/review-workspace.tar.gz .github .gitattributes .nvmrc .claude .agents package.json package-lock.json src scripts tests docs node_modules *.mjs *.json README.md AGENTS.md
      - name: Verify native tooling and type boundaries
        run: |
          node scripts/testing/suites.mjs native
          node node_modules/typescript/bin/tsc --noEmit --project tsconfig.framework.json
          node node_modules/typescript/bin/tsc --noEmit --project tsconfig.generator.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-integration-verification
          path: reports/native-integration/
          retention-days: 1
          if-no-files-found: ignore
