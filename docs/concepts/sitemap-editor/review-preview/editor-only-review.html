function updatePageField(field,value){
  const p=byId(ui.selected);if(!p)return;
  if(typeof value==='string')value=value.trim();
  if(field==='title'&&!value){toast('A page title cannot be empty.','error');renderInspector();return;}
  if(field==='route'){const err=checkRoute(value,p.type,p.id);if(err){toast(err,'error');renderInspector();return;}}
  if(field==='parentId'){if(value===p.id||descendants(p.id).some(d=>d.id===value)||byId(value)?.type==='external'){toast('Choose a valid parent outside this branch.','error');renderInspector();return;}openMove(p.id,value);return;}
  if(field==='type'){
    if(value==='external'&&children(p.id).length){toast('An external link cannot contain child pages. Move the children first.','error');renderInspector();return;}
    if(value==='container'&&p.type!=='container'){showModal('Convert to a container',`<p class="muted" style="font-size:12px">Containers organize pages but are not routable. Converting <b>${esc(p.title)}</b> clears its route and removes direct navigation and journey references to it. Its children are retained.</p><div class="callout warning section-spaced">${ic('warning')}<span>Use a standard page to keep a navigable landing page. This conversion can be undone.</span></div>`,`${button('Cancel','close-modal','','secondary')}<button type="button" class="button primary" data-action="confirm-container">Convert to container</button>`);return;}
    if(p.type==='container'&&value!=='container'){openEditRouteType(value);return;}
    if((value==='external')!==(p.type==='external')){openEditRouteType(value);return;}
  }
  if(p[field]===value)return;
  commit(`${field==='title'?'Page renamed':field==='route'?'Route updated':'Page updated'}`,()=>{p[field]=value;},{quiet:true});
}

function submitAdd(fd){const title=String(fd.get('title')||'').trim(),type=String(fd.get('type')),parentId=String(fd.get('parentId')),route=type==='container'?'':String(fd.get('route')||'').trim();if(!title)return showFormError('Give this page a name.');const error=checkRoute(route,type);if(error)return showFormError(error);const parent=byId(parentId);if(!parent||parent.type==='external')return showFormError('Choose a valid parent.');const id=uid();const purpose=String(fd.get('purpose')||'').trim();const p=makePage(id,parentId,title,route,String(fd.get('icon')),purpose.slice(0,80),{type,purpose,status:String(fd.get('status')),layoutId:parent.layoutId,access:parent.type==='container'?'members':parent.access,roles:[...parent.roles]});closeModal();commit('Page added',()=>{project.pages.push(p);ui.selected=id;ui.inspectorOpen=true;ui.tab='details';reveal(id);},{refit:true});}
function openMove(id=ui.selected,destination=null){const p=byId(id);if(!p||p.parentId===null){toast('The workspace root cannot be moved.','error');return;}ui.moveId=id;const excluded=[id,...descendants(id).map(d=>d.id),...project.pages.filter(n=>n.type==='external').map(n=>n.id)];
  showModal(`Move ${p.title}`,`<label class="field"><span>Destination parent</span><select name="parentId" id="move-parent">${pageOptions(destination||p.parentId,excluded)}</select></label><div class="callout success">${ic('check-circle')}<span><b>Existing routes will be preserved</b>${esc(p.route||'This is a non-routable container.')}${descendants(id).length?`<br>${descendants(id).length} descendant pages will move with this branch.`:''}</span></div><p class="field-note section-spaced">Navigation references and journey steps still point to the same page IDs. No pages are duplicated.</p>`,`${button('Cancel','close-modal','','secondary')}<button type="submit" class="button primary">${ic('move')}Move page</button>`,{formKind:'move-page'});
}
function submitMove(fd){const p=byId(ui.moveId),target=byId(String(fd.get('parentId')));if(!p||!target||p.id===target.id||descendants(p.id).some(d=>d.id===target.id)||target.type==='external')return showFormError('That move would create an invalid hierarchy. Choose another parent.');if(p.parentId===target.id){closeModal();return toast('The page is already under that parent.');}closeModal();commit('Page moved — routes unchanged',()=>{p.parentId=target.id;ui.selected=p.id;reveal(p.id);},{refit:true});}
function reorderSibling(id,direction){const p=byId(id);if(!p)return;const siblings=children(p.parentId),index=siblings.findIndex(c=>c.id===id),other=siblings[index+direction];if(!other)return;commit('Page order updated',()=>{const a=project.pages.findIndex(c=>c.id===id),b=project.pages.findIndex(c=>c.id===other.id);[project.pages[a],project.pages[b]]=[project.pages[b],project.pages[a]];});}
function duplicatePage(id=ui.selected){const source=byId(id);if(!source||source.parentId===null)return;const original=[source,...descendants(id)];if(project.pages.length+original.length>MAX_PAGES){toast(`Duplicating this branch would exceed the ${MAX_PAGES}-node limit.`,'error');return;}const map=new Map(original.map(p=>[p.id,uid()]));commit(original.length>1?'Branch duplicated':'Page duplicated',()=>{const copyPages=[];for(const old of original){const p=clone(old);p.id=map.get(old.id);p.parentId=map.get(old.parentId)||old.parentId;if(old.id===id)p.title=(p.title+' copy').slice(0,100);if(p.route&&p.type!=='external')p.route=uniqueRoute((p.route==='/'?'':p.route.replace(/\/$/,''))+'/copy',[...project.pages,...copyPages]);p.status='Draft';p.navItems=p.navItems.map(ref=>map.get(ref)||ref);copyPages.push(p);}project.pages.push(...copyPages);ui.selected=map.get(id);reveal(ui.selected);},{refit:true});}
function openDelete(id=ui.selected){const p=byId(id);if(!p||p.parentId===null){toast('The root container cannot be deleted.','error');return;}ui.deleteId=id;const ids=new Set([id,...descendants(id).map(c=>c.id)]);const references=project.pages.reduce((n,x)=>n+x.navItems.filter(ref=>ids.has(ref)).length,0);const journeys=project.journeys.filter(j=>j.steps.some(s=>ids.has(s.pageId))).length;
  showModal(`Delete ${p.title}?`,`<p class="muted" style="font-size:12px;line-height:1.8">${ids.size===1?'This page':`This branch and its ${ids.size-1} descendant pages`} will be removed from the workspace.</p><div class="callout warning section-spaced">${ic('warning')}<span><b>References will be cleaned up</b>${references} navigation links and ${journeys} journeys reference this ${ids.size>1?'branch':'page'}. Matching journey steps are removed; journeys with fewer than two remaining steps are removed entirely.</span></div><p class="field-note section-spaced">Undo restores the deleted pages and all their references.</p>`,`${button('Cancel','close-modal','','secondary')}${button(`Delete ${ids.size===1?'page':ids.size+' pages'}`,'confirm-delete','trash','danger')}`);
}
function cleanReferences(ids){project.pages.forEach(p=>p.navItems=p.navItems.filter(id=>!ids.has(id)));project.journeys.forEach(j=>j.steps=j.steps.filter(s=>!ids.has(s.pageId)));project.journeys=project.journeys.filter(j=>j.steps.length>=2);}
function confirmDelete(){const p=byId(ui.deleteId);if(!p)return;const ids=new Set([p.id,...descendants(p.id).map(c=>c.id)]),parent=p.parentId;closeModal();commit(`${ids.size===1?'Page':'Branch'} deleted`,()=>{project.pages=project.pages.filter(c=>!ids.has(c.id));cleanReferences(ids);ui.selected=parent;ids.forEach(id=>ui.collapsed.delete(id));},{refit:true});}
function confirmContainer(){const p=byId(ui.selected);if(!p)return;closeModal();commit('Page converted to container',()=>{p.type='container';p.route='';p.nav='hidden';cleanReferences(new Set([p.id]));});}
function openEditRouteType(type){const p=byId(ui.selected);ui.pendingType=type;showModal('Change page type',`<label class="field"><span>New type</span><input value="${esc(TYPE_NAMES[type])}" disabled></label><label class="field"><span>${type==='external'?'External URL':'Application route'}</span><input name="route" id="type-route" value="${esc(type==='external'?'https://':suggestedRoute(p.parentId,p.title))}" required></label><p class="field-note">The page keeps its ID and references.</p>`,`${button('Cancel','close-modal','','secondary')}<button type="submit" class="button primary">Change type</button>`,{formKind:'change-type'});}
function submitType(fd){const p=byId(ui.selected),type=ui.pendingType,route=String(fd.get('route')||'').trim();const err=checkRoute(route,type,p.id);if(err)return showFormError(err);closeModal();commit('Page type updated',()=>{p.type=type;p.route=route;});}
function openAddTab(){const p=byId(ui.selected),available=project.pages.filter(c=>c.type!=='container'&&!p.navItems.includes(c.id)&&c.id!==p.id);if(!available.length){toast('All available pages are already linked. Add a page first.','error');return;}
  showModal('Link a page in secondary navigation',`<label class="field"><span>Existing page</span><select name="pageId">${pageOptions(available[0].id,[p.id,...p.navItems],false)}</select></label><div class="callout">${ic('link')}<span><b>One page, multiple entry points</b>This creates a navigation reference. It does not move or duplicate the page.</span></div>`,`${button('Cancel','close-modal','','secondary')}<button type="submit" class="button primary">${ic('plus')}Add navigation link</button>`,{formKind:'add-tab'});
}
function submitTab(fd){const p=byId(ui.selected),id=String(fd.get('pageId'));if(!byId(id)||id===p.id||p.navItems.includes(id))return showFormError('Choose an available page.');closeModal();commit('Navigation link added',()=>{p.navItems.push(id);p.tabsEnabled=true;});}
function changeTab(index,dir){const p=byId(ui.selected);if(!p||index<0||index>=p.navItems.length)return;if(dir===0){commit('Navigation link removed',()=>p.navItems.splice(index,1));}else if(p.navItems[index+dir]){commit('Navigation order updated',()=>[p.navItems[index],p.navItems[index+dir]]=[p.navItems[index+dir],p.navItems[index]]);}}
function openLinkComponents(){const p=byId(ui.selected);showModal('Link reusable components',`<p class="field-note" style="margin-bottom:12px">Reference the components used by ${esc(p.title)}. This catalog describes dependencies; it does not render or edit the components themselves.</p><div class="role-options">${project.components.map(c=>`<label class="role-option"><input type="checkbox" name="componentIds" value="${esc(c.id)}" ${p.componentIds.includes(c.id)?'checked':''}><span>${esc(c.name)}<small style="display:block">${esc(c.description)}</small></span></label>`).join('')||'<p class="muted">Create a component in the component library first.</p>'}</div>`,`${button('Cancel','close-modal','','secondary')}<button type="submit" class="button primary">Save references</button>`,{formKind:'link-components'});}
function openChecks(){const checks=getChecks();showModal('Structure checks',`${checks.length?`<div class="callout warning">${ic('lightbulb')}<span><b>${checks.length} ${checks.length===1?'item':'items'} to review</b>These are planning checks, not an automated accessibility or security audit.</span></div>${checks.map(c=>`<div class="check-row">${ic('warning')}<span><b>${esc(c.title)}</b><small>${esc(c.detail)}</small></span><button class="button secondary small" data-action="resolve-check" data-id="${esc(c.id)}" data-tab="${esc(c.tab)}">Review ${ic('arrow-right')}</button></div>`).join('')}`:`<div class="empty-state">${ic('check-circle')}<h3>No outstanding structure checks</h3><p>Page purposes, access intent, secondary navigation and discoverability checks are complete.</p></div>`}<p class="field-note section-spaced">Duplicate routes, invalid parent relationships, cycles and broken references are prevented when editing or importing. Structural depth is not treated as a universal usability limit.</p>`,button('Done','close-modal','','primary'),{subtitle:'Resolve unfinished definitions before handing the architecture to your team.',wide:true});}
function openSettings(){showModal('Workspace settings',`<label class="field"><span>Workspace name</span><input name="name" value="${esc(project.workspace.name)}" maxlength="100" required></label><label class="field"><span>Description</span><textarea name="description" rows="3" maxlength="1600">${esc(project.workspace.description)}</textarea></label><div class="callout ${storageOK?'success':'warning'}">${ic(storageOK?'shield':'warning')}<span><b>${storageOK?'Stored in this browser':'Storage is unavailable'}</b>${storageOK?'Changes are saved locally, not to a server. Use JSON exports for backups and transfer.':'Your changes currently exist only in this open tab. Export a JSON backup before closing.'} Moving the HTML file or changing browsers may not carry over browser storage.</span></div><div class="section-spaced"><div class="details-heading">Workspace files</div><div class="button-row">${button('Export JSON','export-json','download','secondary small')}${button('Import JSON','import-json','upload','secondary small')}</div></div><div class="section-spaced"><div class="details-heading">Example workspace</div>${button('Restore Northstar example','reset-demo','refresh','secondary small')}<p class="field-note">Replaces the current workspace after confirmation. Undo is available during this session.</p></div>`,`${button('Cancel','close-modal','','secondary')}<button type="submit" class="button primary">Save settings</button>`,{formKind:'settings'});}
function resetDemoDialog(){showModal('Restore the example workspace?',`<p class="muted" style="font-size:12px;line-height:1.8">This replaces the current workspace with the original Northstar example: 28 pages, three layouts, six components and three journeys.</p><div class="callout warning section-spaced">${ic('warning')}<span><b>Back up your current work first</b>Download a JSON export before replacing the workspace. You can also undo the reset in this session.</span></div>`,`${button('Export current','export-json','download','secondary')}${button('Cancel','close-modal','','secondary')}${button('Restore example','confirm-reset','refresh','primary')}`);}
function confirmReset(){closeModal();commit('Example workspace restored',()=>{project=seedProject();ui.selected='project';ui.tab='details';ui.focus=null;ui.journeyId=null;ui.view='map';ui.filters={status:'all',type:'all',access:'all'};ui.collapsed=new Set(['customers','reports','automations','workspace-settings']);ui.role='Product Manager';ui.inspectorOpen=innerWidth>760;},{refit:true});}

function openCatalog(kind,id=null){ui.catalogKind=kind;const items=project[kind];const item=items.find(c=>c.id===(id||ui.catalogId))||items[0];ui.catalogId=item?.id||null;const isLayout=kind==='layouts';const usage=item?project.pages.filter(p=>isLayout?p.layoutId===item.id:p.componentIds.includes(item.id)):[];
  showModal(isLayout?'Layout library':'Component library',`<div class="catalog-layout"><div class="catalog-list">${items.map(c=>`<button class="catalog-item ${c.id===item?.id?'selected':''}" data-action="catalog-select" data-id="${esc(c.id)}">${ic(isLayout?'layout':'components')}<span><b>${esc(c.name)}</b><small>${project.pages.filter(p=>isLayout?p.layoutId===c.id:p.componentIds.includes(c.id)).length} page references</small></span></button>`).join('')}${button(isLayout?'Add layout':'Add component','catalog-add','plus','secondary small full',`style="margin-top:12px"`)}</div><div class="catalog-detail">${item?`<label class="field"><span>Name</span><input id="catalog-name" name="catalogName" value="${esc(item.name)}" maxlength="100" required></label><label class="field"><span>Purpose / description</span><textarea id="catalog-description" name="catalogDescription" rows="3" maxlength="2000">${esc(item.description)}</textarea></label><div class="section-label">Used by ${usage.length} pages</div><div class="usage-chips">${usage.map(p=>`<button class="chip gray" data-action="catalog-open-page" data-id="${esc(p.id)}">${esc(p.title)}</button>`).join('')||'<p class="field-note">No pages reference this item yet.</p>'}</div><div class="library-footer"><button class="text-button text-danger" type="button" data-action="catalog-delete" ${usage.length||isLayout&&items.length<=1?'disabled':''}>Delete unused ${isLayout?'layout':'component'}</button></div>`:`<div class="empty-state">${ic('components')}<h3>No components yet</h3><p>Create one, then reference it from the Related tab on a page.</p></div>`}</div></div>`,`<span class="footer-note">Catalog metadata only. Visual layout and component editors are outside this prototype.</span>${button('Close','close-modal','','secondary')}${item?'<button type="submit" class="button primary">Save changes</button>':''}`,{wide:true,formKind:'catalog'});
}

function submitCatalog(fd){const item=project[ui.catalogKind].find(c=>c.id===ui.catalogId);if(!item)return;const name=String(fd.get('catalogName')||'').trim();if(!name)return showFormError('A name is required.');commit('Catalog updated',()=>{item.name=name;item.description=String(fd.get('catalogDescription')||'').trim();},{quiet:true});toast('Catalog changes saved.');closeModal();}
function submitCatalogAdd(fd){const kind=ui.catalogKind,name=String(fd.get('name')||'').trim();if(!name)return showFormError('A name is required.');const max=kind==='layouts'?50:200;if(project[kind].length>=max)return showFormError(`The catalog supports at most ${max} items.`);const id=uid(kind==='layouts'?'layout':'component');commit(kind==='layouts'?'Layout added':'Component added',()=>project[kind].push({id,name,description:String(fd.get('description')||'').trim()}),{quiet:true});openCatalog(kind,id);toast('Catalog item created.');}
function deleteCatalogItem(){const kind=ui.catalogKind,id=ui.catalogId;if(project.pages.some(p=>kind==='layouts'?p.layoutId===id:p.componentIds.includes(id)))return toast('Remove all page references before deleting this item.','error');if(kind==='layouts'&&project.layouts.length<=1)return;commit('Unused catalog item deleted',()=>{project[kind]=project[kind].filter(c=>c.id!==id);},{quiet:true});ui.catalogId=null;openCatalog(kind);toast('Unused catalog item deleted.','success','Undo','undo');}

function openJourneys(){showModal('Journey lens',`<div class="callout" style="margin-bottom:17px">${ic('journey')}<span><b>Follow a task across the application</b>Journeys reference your pages without changing their hierarchy. Teal dashed arrows show direction; gray lines remain structural.</span></div>${project.journeys.map(j=>`<div class="journey-card ${j.id===ui.journeyId?'active':''}"><div class="journey-card-top"><div><h3>${esc(j.name)}</h3><p>${esc(j.description)}</p></div><span class="chip gray">${esc(j.role)}</span></div><div class="path-crumbs">${j.steps.map((s,i)=>`${i?ic('chevron-right'):''}<span>${esc(byId(s.pageId)?.title||'Missing page')}</span>`).join('')}</div><div class="button-row" style="margin-top:14px">${button('Explore path','activate-journey','journey','primary small',`data-id="${esc(j.id)}"`)}${button('Edit journey','edit-journey','edit','secondary small',`data-id="${esc(j.id)}"`)}</div></div>`).join('')||'<div class="empty-state"><h3>Create your first journey</h3><p>Choose at least two pages and describe the actions that connect them.</p></div>'}`,`${button('Close','close-modal','','secondary')}${button('Create journey','new-journey','plus','primary')}`,{wide:true,subtitle:'Review task findability and audience access, not just page counts.'});}
function activateJourney(id){const j=project.journeys.find(j=>j.id===id);if(!j)return;closeModal();ui.journeyId=id;ui.role=j.role;ui.view='map';ui.focus=null;ui.inspectorOpen=true;ui.selected=j.steps[0].pageId;j.steps.forEach(s=>reveal(s.pageId));renderAll({refit:true});}
function renderJourneyInspector(){const j=project.journeys.find(j=>j.id===ui.journeyId);if(!j)return;const blocked=j.steps.filter(s=>!allowed(byId(s.pageId)));$('#inspector').innerHTML=`<div class="inspector-header"><span>Journey details</span><div><button class="icon-button compact" data-action="edit-journey" data-id="${esc(j.id)}" aria-label="Edit journey">${ic('edit')}</button><button class="icon-button compact" data-action="hide-inspector" aria-label="Close journey details">${ic('x')}</button></div></div><div class="inspector-heading"><span class="selected-symbol" style="color:var(--accent)">${ic('journey')}</span><div class="inspector-title"><h2 style="font-size:16px;line-height:1.4">${esc(j.name)}</h2><p class="field-note">${j.steps.length} connected pages</p></div></div><div class="inspector-scroll"><section class="inspector-section"><div class="section-label">Purpose</div><p class="muted" style="font-size:12px;line-height:1.8">${esc(j.description||'Describe the outcome this journey should support.')}</p></section><section class="inspector-section"><label class="field"><span>Preview audience</span><select id="journey-role" aria-label="Journey preview audience">${options(['All roles',...ROLES],ui.role)}</select></label><div class="callout ${blocked.length?'warning':'success'}">${ic(blocked.length?'lock':'check-circle')}<span><b>${blocked.length?`${blocked.length} restricted ${blocked.length===1?'step':'steps'}`:'All steps are accessible'}</b>${blocked.length?`Review whether ${esc(ui.role)} should follow this path.`:`${esc(ui.role)} can access each page in this design preview.`}</span></div></section><div class="section-label"><span>Path · ${j.steps.length} steps</span><button class="text-button" data-action="edit-journey" data-id="${esc(j.id)}">Edit path</button></div><div class="journey-steps">${j.steps.map((s,i)=>{const p=byId(s.pageId);return `<div class="journey-step ${p.id===ui.selected?'current':''} ${!allowed(p)?'blocked':''}"><span class="step-number">${!allowed(p)?ic('lock'):i+1}</span><button data-action="focus-journey-page" data-id="${esc(p.id)}"><b>${esc(p.title)}</b><small>${esc(p.route)}</small><span class="step-action">${esc(s.action)}</span></button></div>`;}).join('')}</div><section class="inspector-section"><div class="section-label">Two kinds of connection</div><div class="field-note" style="display:flex;align-items:center;gap:9px;margin-bottom:6px"><span style="width:23px;border-top:1px solid #718695"></span>Hierarchy · parent and child</div><div class="field-note" style="display:flex;align-items:center;gap:9px"><span style="width:23px;border-top:2px dashed var(--accent)"></span>Journey · action and direction</div></section><div class="callout">${ic('shield')}<span><b>Design preview only</b>Visibility here is not authorization enforcement or a live application session.</span></div><div style="margin-top:15px">${button('Inspect selected page','inspect-journey-page','page','secondary small full')}</div></div><div class="inspector-footer"><button class="text-button" data-action="exit-journey">Exit journey</button>${button('Focus path','journey-preview','target','primary')}</div>`;}
let journeyDraftSteps=[];
function openJourneyEditor(id=null){const j=project.journeys.find(j=>j.id===id);ui.editJourneyId=j?.id||null;const pages=project.pages.filter(p=>p.type!=='container');if(pages.length<2){toast('Create at least two routable pages before adding a journey.','error');return;}journeyDraftSteps=j?clone(j.steps):[{pageId:pages[0].id,action:'Continue to the next page'},{pageId:pages[1].id,action:'Complete the task'}];showModal(j?'Edit journey':'Create a journey',`<div class="form-grid"><label class="field"><span>Journey name</span><input name="name" value="${esc(j?.name||'')}" placeholder="e.g. Create a customer project" maxlength="100" required></label><label class="field"><span>Default audience</span><select name="role">${options(ROLES,j?.role||'Member')}</select></label><label class="field span-2"><span>Goal / outcome</span><textarea name="description" rows="2" maxlength="1600" placeholder="What should the person achieve?">${esc(j?.description||'')}</textarea></label></div><div class="section-label"><span>Pages and actions, in sequence</span></div><div id="journey-form-steps"></div>${button('Add a step','journey-add-step','plus','secondary small')}<p class="field-note" style="margin-top:13px">A journey is an ordered set of page references. It can cross branches and does not alter the page hierarchy.</p>`,`${j?button('Delete journey','delete-journey','trash','ghost text-danger',`data-id="${esc(j.id)}"`):''}<span style="flex:1"></span>${button('Cancel','close-modal','','secondary')}<button type="submit" class="button primary">Save journey</button>`,{wide:true,formKind:'journey'});renderJourneyFormSteps();}
function readJourneyFormSteps(){return $$('.journey-form-step').map(el=>({pageId:$('select',el).value,action:$('input',el).value.trim()}));}
function renderJourneyFormSteps(){$('#journey-form-steps').innerHTML=journeyDraftSteps.map((s,i)=>`<div class="journey-form-step"><span class="step-number">${i+1}</span><div><select aria-label="Page for step ${i+1}">${pageOptions(s.pageId,[],false)}</select><input aria-label="Action for step ${i+1}" value="${esc(s.action)}" placeholder="Action taken on this page" maxlength="200"></div><button type="button" class="icon-button compact" data-action="journey-step-up" data-index="${i}" aria-label="Move step ${i+1} earlier" ${i===0?'disabled':''}>${ic('chevron-up')}</button><button type="button" class="icon-button compact" data-action="journey-remove-step" data-index="${i}" aria-label="Remove step ${i+1}" ${journeyDraftSteps.length<=2?'disabled':''}>${ic('x')}</button></div>`).join('');}
function submitJourney(fd){const name=String(fd.get('name')||'').trim(),steps=readJourneyFormSteps();if(!name)return showFormError('Name this journey.');if(steps.length<2||steps.length>60)return showFormError('Use between 2 and 60 journey steps.');if(steps.some(s=>!byId(s.pageId)||byId(s.pageId).type==='container'))return showFormError('Every step must reference an existing routable page.');if(steps.some((s,i)=>i>0&&steps[i-1].pageId===s.pageId))return showFormError('Consecutive steps must use different pages. Describe multiple actions on the same page in one step.');if(!ui.editJourneyId&&project.journeys.length>=100)return showFormError('This prototype supports up to 100 journeys.');const id=ui.editJourneyId||uid('journey'),j={id,name,description:String(fd.get('description')||'').trim(),role:String(fd.get('role')),steps};closeModal();commit(ui.editJourneyId?'Journey updated':'Journey created',()=>{const index=project.journeys.findIndex(c=>c.id===id);if(index>=0)project.journeys[index]=j;else project.journeys.push(j);},{quiet:true});activateJourney(id);toast('Journey saved.','success','Undo','undo');}
function deleteJourney(id){showModal('Delete this journey?',`<p class="muted" style="font-size:12px">Only the journey and its step sequence will be removed. The referenced application pages remain unchanged.</p>`,`${button('Cancel','close-modal','','secondary')}${button('Delete journey','confirm-journey-delete','trash','danger',`data-id="${esc(id)}"`)}`);}

function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
function exportJSON(){const data=clone(project);download(slugify(project.workspace.name)+'-sitemap.json',JSON.stringify(data,null,2),'application/json');toast('Workspace JSON exported. Includes pages, layouts, components and journeys.');}
function exportSVG(){mapLayout();const W=ui.world.w,H=ui.world.h;const text=(s,n)=>s.length>n?s.slice(0,n-1)+'…':s;let content='';for(const p of ui.visible){const a=ui.positions.get(p.parentId),b=ui.positions.get(p.id);if(a){const mid=(a.y+a.h+b.y)/2;content+=`<path d="M${a.x+a.w/2},${a.y+a.h} V${mid} H${b.x+b.w/2} V${b.y}" fill="none" stroke="#647e8e" stroke-width="1.4"/>`;}}
  const j=project.journeys.find(j=>j.id===ui.journeyId);if(j){j.steps.forEach((s,i)=>{if(!i)return;const a=ui.positions.get(j.steps[i-1].pageId),b=ui.positions.get(s.pageId);if(a&&b)content+=`<path d="M${a.x+a.w/2},${a.y+a.h} C${a.x+a.w/2},${a.y+a.h+45} ${b.x+b.w/2},${b.y-45} ${b.x+b.w/2},${b.y}" fill="none" stroke="#27d9d4" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#a)"/>`;});}
  ui.visible.forEach(p=>{const s=ui.positions.get(p.id);content+=`<g transform="translate(${s.x},${s.y})"><rect width="${s.w}" height="${s.h}" rx="6" fill="${p.id===ui.selected?'#12313b':'#16242e'}" stroke="${p.id===ui.selected?'#27d9d4':'#4a6271'}" stroke-width="1.3"/><text x="13" y="27" fill="#e7eff7" font-size="13" font-weight="600">${esc(text(p.title,p.parentId===null?27:22))}</text><text x="13" y="48" fill="#9ab4c5" font-size="9" font-family="monospace">${esc(text(p.route||'Organizational group',p.parentId===null?32:25))}</text>${ui.showDescriptions?`<text x="13" y="${s.h-16}" fill="#a9bcc9" font-size="10">${esc(text(p.description||p.purpose,26))}</text>`:''}</g>`;});
  const xml=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="font-family:Segoe UI,Arial,sans-serif"><title>${esc(project.workspace.name)} — application sitemap</title><desc>Export of visible page structure. ${j?'Journey: '+esc(j.name):'Gray lines connect parent and child pages.'}</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#27d9d4"/></marker></defs><rect width="100%" height="100%" fill="#0c1921"/><text x="35" y="33" fill="#e7eff7" font-size="18" font-weight="600">${esc(project.workspace.name)}</text><text x="35" y="54" fill="#93afbf" font-size="10">${j?'Journey: '+esc(j.name):'Application Sitemap · Journey Lens'} · ${ui.visible.filter(p=>p.type!=='container').length} visible pages</text>${content}</svg>`;
  download(slugify(project.workspace.name)+'-sitemap.svg',xml,'image/svg+xml');toast('Visible sitemap exported as a standalone SVG.');
}
async function handleImport(file){if(!file)return;if(file.size>5*1024*1024){showImportError(['The file is larger than 5 MB. Import a smaller workspace export.']);return;}try{const raw=JSON.parse(await file.text()),result=validateImport(raw);if(result.errors.length){showImportError(result.errors);return;}ui.pendingImport=result.data;const data=result.data;showModal('Review workspace import',`<p class="muted" style="font-size:12px">Ready to import <b>${esc(data.workspace.name)}</b> from <code>${esc(file.name)}</code>.</p><div class="stats-row"><div class="stat-card"><b>${data.pages.filter(p=>p.type!=='container').length}</b><span>Pages</span></div><div class="stat-card"><b>${data.layouts.length}</b><span>Layouts</span></div><div class="stat-card"><b>${data.components.length}</b><span>Components</span></div><div class="stat-card"><b>${data.journeys.length}</b><span>Journeys</span></div></div><div class="callout success">${ic('check-circle')}<span><b>Schema and references validated</b>Page IDs, route patterns, hierarchy, layout links, component links, navigation links and journey steps are valid.</span></div><div class="callout warning section-spaced">${ic('warning')}<span><b>This replaces the current workspace; it does not merge</b>Export your current work before continuing. The import can be undone in this session.</span></div>`,`${button('Export current','export-json','download','secondary')}${button('Cancel','close-modal','','secondary')}${button('Replace workspace','confirm-import','upload','primary')}`,{wide:true});}catch(e){showImportError(['This file could not be read as valid JSON. No changes were made to the current workspace.']);}}
function showImportError(errors){ui.pendingImport=null;showModal('Import could not be completed',`<div class="callout danger">${ic('warning')}<span><b>The current workspace is unchanged</b>Correct the file and try again.</span></div><ul class="modal-error-list section-spaced">${errors.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`,`${button('Close','close-modal','','secondary')}${button('Choose another file','import-json','upload','primary')}`,{wide:true});}
function confirmImport(){if(!ui.pendingImport)return;const data=clone(ui.pendingImport);closeModal();commit('Workspace imported',()=>{project=data;ui.selected=project.pages.find(p=>p.id==='project')?.id||rootId();ui.tab='details';ui.focus=null;ui.journeyId=null;ui.collapsed=new Set();ui.view='map';ui.filters={status:'all',type:'all',access:'all'};ui.outlineSearch='';},{refit:true});ui.pendingImport=null;}
async function copyRoute(){const text=byId(ui.selected)?.route;if(!text)return;try{await navigator.clipboard.writeText(text);toast('Route copied.');}catch{const el=document.createElement('textarea');el.value=text;el.style.position='fixed';el.style.opacity='0';document.body.appendChild(el);el.select();try{if(!document.execCommand('copy'))throw new Error();toast('Route copied.');}catch{showModal('Copy route',`<input id="copy-route-input" value="${esc(text)}" readonly><p class="field-note section-spaced">Clipboard access is unavailable. Select and copy the route manually.</p>`,button('Done','close-modal','','primary'));$('#copy-route-input').select();}finally{el.remove();}}}

function renderCommandResults(query){const q=query.toLowerCase().trim();const pageMatches=project.pages.filter(p=>[p.title,p.route,p.purpose].join(' ').toLowerCase().includes(q)).slice(0,q?35:7);const actions=commands.filter(c=>[c.name,c.description].join(' ').toLowerCase().includes(q)).slice(0,q?8:4);ui.commandItems=[...pageMatches.map(p=>({kind:'page',id:p.id,title:p.title,description:p.route||'Organizational container',icon:p.icon})),...actions.map(c=>({kind:'command',action:c.action,title:c.name,description:c.description,icon:c.icon}))];$('#command-results').innerHTML=ui.commandItems.length?ui.commandItems.map((item,i)=>`${i===0?'<div class="menu-label">Pages</div>':i===pageMatches.length?'<div class="menu-label">Commands</div>':''}<button class="command-result ${i===ui.commandIndex?'focused':''}" data-command-index="${i}">${ic(item.icon)}<span>${esc(item.title)}<small>${esc(item.description)}</small></span><span class="tag">${item.kind==='page'?'Page':'Command'}</span></button>`).join(''):`<div class="empty-state">${ic('search')}<h3>No results</h3><p>Try a page title, route or action such as “export”.</p></div>`;}

function openHelp(){showModal('Find your way around',`<div class="callout success">${ic('journey')}<span><b>Application architecture, connected to user intent</b>Plan pages, keep routes stable and review how an audience completes a task.</span></div><div class="guide-cards"><div class="guide-card">${ic('sitemap')}<h3>Structure the application</h3><p>Click a page to inspect it. Add children, collapse branches or focus a section. Drag a page onto another to move it safely.</p></div><div class="guide-card">${ic('journey')}<h3>Follow a journey</h3><p>Open Journey Lens to highlight a task across pages. Change the preview role to expose restricted steps.</p></div><div class="guide-card">${ic('link')}<h3>Keep one page model</h3><p>Secondary menus reference existing pages. Layouts, components and journeys share stable page IDs.</p></div><div class="guide-card">${ic('save')}<h3>Keep your work</h3><p>Changes save to this browser when storage is available. Export workspace JSON for backups or moving to another browser.</p></div></div><div class="section-spaced"><h3>Keyboard shortcuts</h3><div class="shortcut-grid">${[['Search pages & commands','Ctrl / ⌘ K'],['New page','N'],['Rename selected page','F2'],['Undo','Ctrl / ⌘ Z'],['Redo','Ctrl / ⌘ Shift Z'],['Export sitemap JSON','Ctrl / ⌘ S'],['Fit all visible pages','0'],['Center selected page','F'],['Zoom in / out','+ / −'],['Move through the map','Arrow keys'],['Pan canvas','Drag empty area'],['Delete selected branch','Delete'],['Close a dialog','Esc'],['Open this guide','?']].map(([label,key])=>`<div class="shortcut-row"><span>${label}</span><kbd>${key}</kbd></div>`).join('')}</div></div><p class="field-note section-spaced">You can move a page without dragging: open its action menu and choose “Move to…”. Hierarchy changes do not change URLs. Access previews are not real authorization checks.</p>`,`${button('Close','close-modal','','secondary')}${button('Start / resume tour','start-tour','play','primary')}`,{wide:true,subtitle: function openAbout(){showModal('About this review build',`<div class="callout warning">${ic('info')}<span><b>Offline visual review — not the requested-stack build</b>This HTML uses the previous plain-JavaScript renderer so you can review the shell-free layout immediately. It does not run Vue, Nuxt UI or Vue Flow.</span></div><p class="muted" style="margin-top:18px;line-height:1.8">The accompanying source package implements Vue 3 + Nuxt UI + Vue Flow. Package registry access was unavailable in the build environment, so that runtime has not been compiled or browser-verified. Run npm install and npm run build in the source folder to produce its single-file HTML.</p><p class="field-note section-spaced">Changes from this review can be exported to JSON and imported into the Vue source application. The two renderers have different node-drag semantics: this review drags onto pages to move hierarchy; the Vue editor drags to arrange and uses handles or Move for hierarchy.</p>`,button('Continue editing','close-modal','','primary'),{subtitle:'Sitemap editor · Review renderer'});}

function startTour(){closeModal();closePopup();if($('#command-modal').open)$('#command-modal').close();ui.view='map';ui.journeyId=null;ui.focus=null;ui.inspectorOpen=true;reveal(ui.selected);renderAll({refit:true});try{ui.tourIndex=Math.max(0,Math.min(TOUR.length-1,Number(localStorage.getItem('companion.journey-lens.tour.v1'))||0));}catch{ui.tourIndex=0;}$('#tour-layer').hidden=false;setTimeout(renderTour,120);}
function renderTour(){if($('#tour-layer').hidden)return;const step=TOUR[ui.tourIndex],target=typeof step.target==='function'?step.target():$(step.target);const rect=(target||$('#main')).getBoundingClientRect();const width=Math.min(340,innerWidth-40),cardH=300;let x,y;

function handleAction(action,element=null,data={}){
  const id=data.id||ui.selected;
  if(!['node-menu','project-menu','workspace-menu','filters'].includes(action)&&!action.startsWith('filter-'))closePopup();
  switch(action){
    case 'toggle-page-tree':ui.treeOpen=!ui.treeOpen;if(innerWidth<900&&ui.treeOpen)ui.inspectorOpen=false;renderAll({refit:true});break;
    case 'toggle-editor-inspector':ui.inspectorOpen=!ui.inspectorOpen;if(innerWidth<900&&ui.inspectorOpen)ui.treeOpen=false;renderAll({refit:true});break;
    case 'show-related':ui.journeyId=null;ui.tab='related';selectPage(id,{revealPage:true,focus:false});break;
    case 'home':case 'sitemap':ui.view='map';ui.journeyId=null;ui.focus=null;renderAll({refit:true});break;
    case 'pages':ui.view='outline';ui.journeyId=null;ui.focus=null;ui.collapsed=new Set();renderAll();break;
    case 'map-view':ui.view='map';renderAll({refit:true});break;
    case 'outline-view':ui.view='outline';renderAll();break;
    case 'toggle-rail':if(innerWidth<=760)$('#application').classList.toggle('mobile-rail');else $('#application').classList.toggle('rail-collapsed');requestAnimationFrame(fitMap);break;
    case 'workspace-menu':openWorkspaceMenu(element);break;
    case 'project-menu':openProjectMenu(element);break;
    case 'node-menu':openNodeMenu(id,element);break;
    case 'filters':openFilters(element||$('#filters-button'));break;
    case 'clear-filters':ui.filters={status:'all',type:'all',access:'all'};renderAll();break;
    case 'reset-outline':ui.filters={status:'all',type:'all',access:'all'};ui.outlineSearch='';renderAll();break;
    case 'add-page':openAdd();break;
    case 'add-child':openAdd(id);break;
    case 'select-page':ui.journeyId=null;ui.tab='details';selectPage(id,{revealPage:true});break;
    case 'rename-page':ui.journeyId=null;ui.inspectorOpen=true;ui.tab='details';renderAll();$('#page-title')?.focus();$('#page-title')?.select();break;
    case 'toggle-node':ui.collapsed.has(id)?ui.collapsed.delete(id):ui.collapsed.add(id);renderAll({refit:true});break;
    case 'expand-all':ui.collapsed=new Set();renderAll({refit:true});break;
    case 'collapse-all':ui.collapsed=new Set(project.pages.filter(p=>p.parentId!==null&&children(p.id).length).map(p=>p.id));ui.focus=null;renderAll({refit:true});break;
    case 'focus-branch':ui.focus=id;ui.journeyId=null;ui.collapsed.delete(id);ui.view='map';renderAll({refit:true});break;
    case 'clear-focus':ui.focus=null;renderAll({refit:true});break;
    case 'focus-selection':centerSelected();break;
    case 'move-page':openMove(id);break;
    case 'duplicate-page':duplicatePage(id);break;
    case 'sibling-up':reorderSibling(id,-1);break;
    case 'sibling-down':reorderSibling(id,1);break;
    case 'delete-page':openDelete(id);break;
    case 'confirm-delete':confirmDelete();break;
    case 'confirm-container':confirmContainer();break;
    case 'zoom-out':zoomAt(1/1.2);break;
    case 'zoom-in':zoomAt(1.2);break;
    case 'zoom-reset':zoomAt(1/ui.transform.z);break;
    case 'fit':if(ui.view!=='map'){ui.view='map';renderAll();}fitMap();break;
    case 'toggle-minimap':ui.showMinimap=!ui.showMinimap;$('#minimap').hidden=!ui.showMinimap;element?.setAttribute('aria-pressed',ui.showMinimap);break;
    case 'undo':undo();break;
    case 'redo':redo();break;
    case 'inspector-tab':ui.tab=data.tab;renderInspector();break;
    case 'hide-inspector':ui.inspectorOpen=false;updateHeader();requestAnimationFrame(fitMap);break;
    case 'show-inspector':ui.inspectorOpen=true;updateHeader();renderInspector();requestAnimationFrame(fitMap);break;
    case 'copy-route':copyRoute();break;
    case 'add-tab':openAddTab();break;
    case 'tab-up':changeTab(Number(data.index),-1);break;
    case 'tab-down':changeTab(Number(data.index),1);break;
    case 'tab-remove':changeTab(Number(data.index),0);break;
    case 'link-components':openLinkComponents();break;
    case 'validate':openChecks();break;
    case 'resolve-check':closeModal();ui.journeyId=null;ui.tab=data.tab||'details';selectPage(id,{revealPage:true,focus:true});break;
    case 'settings':openSettings();break;
    case 'reset-demo':resetDemoDialog();break;
    case 'confirm-reset':confirmReset();break;
    case 'layouts':ui.catalogId=null;openCatalog('layouts');break;
    case 'components':ui.catalogId=null;openCatalog('components');break;
    case 'catalog-select':openCatalog(ui.catalogKind,id);break;
    case 'catalog-add':addCatalogItem();break;
    case 'catalog-back':openCatalog(ui.catalogKind);break;
    case 'catalog-open-page':closeModal();ui.tab='related';selectPage(id,{revealPage:true,focus:true});break;
    case 'catalog-delete':deleteCatalogItem();break;
    case 'journeys':openJourneys();break;
    case 'activate-journey':activateJourney(id);break;
    case 'exit-journey':ui.journeyId=null;renderAll();break;
    case 'new-journey':openJourneyEditor();break;
    case 'edit-journey':openJourneyEditor(id);break;
    case 'journey-add-step':journeyDraftSteps=readJourneyFormSteps();if(journeyDraftSteps.length>=60)return showFormError('A journey can have at most 60 steps.');journeyDraftSteps.push({pageId:project.pages.find(p=>p.type!=='container').id,action:''});renderJourneyFormSteps();break;
    case 'journey-remove-step':journeyDraftSteps=readJourneyFormSteps();if(journeyDraftSteps.length>2){journeyDraftSteps.splice(Number(data.index),1);renderJourneyFormSteps();}break;
    case 'journey-step-up':{journeyDraftSteps=readJourneyFormSteps();const i=Number(data.index);if(i>0){[journeyDraftSteps[i-1],journeyDraftSteps[i]]=[journeyDraftSteps[i],journeyDraftSteps[i-1]];renderJourneyFormSteps();}break;}
    case 'delete-journey':deleteJourney(id);break;
    case 'confirm-journey-delete':closeModal();commit('Journey deleted',()=>{project.journeys=project.journeys.filter(j=>j.id!==id);if(ui.journeyId===id)ui.journeyId=null;});break;
    case 'focus-journey-page':ui.selected=id;reveal(id);renderAll();centerSelected();break;
    case 'inspect-journey-page':ui.journeyId=null;ui.tab='details';renderAll();break;
    case 'journey-preview':openJourneyPreview();break;
    case 'show-related':openPagePreview(id);break;
    case 'preview-navigate':ui.previewPageId=id;if(ui.previewJourney){const j=project.journeys.find(j=>j.id===ui.previewJourney),index=j.steps.findIndex(s=>s.pageId===id);if(index>=0)ui.previewStep=index;else ui.previewJourney=null;}renderPreview();break;
    case 'preview-prev':{const j=project.journeys.find(j=>j.id===ui.previewJourney);if(j&&ui.previewStep>0){ui.previewPageId=j.steps[--ui.previewStep].pageId;renderPreview();}break;}
    case 'preview-next':{const j=project.journeys.find(j=>j.id===ui.previewJourney);if(j&&ui.previewStep<j.steps.length-1){ui.previewPageId=j.steps[++ui.previewStep].pageId;renderPreview();}else{closeModal();toast('Journey preview complete.');}break;}
    case 'export-json':exportJSON();break;
    case 'export-svg':exportSVG();break;
    case 'import-json':closeModal();$('#import-file').click();break;
    case 'confirm-import':confirmImport();break;
    case 'search':openSearch();break;
    case 'help':openHelp();break;
    case 'about':openAbout();break;
    case 'close-modal':closeModal();break;
    case 'start-tour':startTour();break;
    case 'tour-close':endTour();break;
    case 'tour-next':if(ui.tourIndex<TOUR.length-1){ui.tourIndex++;renderTour();}else endTour(true);break;
    case 'tour-back':ui.tourIndex=Math.max(0,ui.tourIndex-1);renderTour();break;
  }
  if(!['toggle-rail','workspace-menu','project-menu','node-menu','filters'].includes(action)&&innerWidth<=760)$('#application').classList.remove('mobile-rail');
}
// Event delegation keeps controls live after rerendering.
let lastNodeClick={id:null,time:0};
document.addEventListener('click',event=>{
  const actionEl=event.target.closest('[data-action]');if(actionEl){if(actionEl.disabled)return;event.preventDefault();handleAction(actionEl.dataset.action,actionEl,actionEl.dataset);return;}
  const commandEl=event.target.closest('[data-command-index]');if(commandEl){chooseCommand(Number(commandEl.dataset.commandIndex));return;}
  const node=event.target.closest('[data-node]');if(node){const id=node.dataset.node,now=performance.now();if(lastNodeClick.id===id&&now-lastNodeClick.time<340){lastNodeClick={id:null,time:0};openPagePreview(id);}else{lastNodeClick={id,time:now};selectPage(id);}return;}
  const row=event.target.closest('[data-row]');if(row){selectPage(row.dataset.row);return;}
  if(!event.target.closest('#popup'))closePopup();
});
document.addEventListener('change',event=>{
  const el=event.target;if(el.matches('[data-page-field]')){updatePageField(el.dataset.pageField,el.type==='checkbox'?el.checked:el.value);return;}
  if(el.matches('[data-role]')){const p=byId(ui.selected);if(p.access==='restricted')commit('Role visibility updated',()=>{p.roles=el.checked?[...new Set([...p.roles,el.dataset.role])]:p.roles.filter(r=>r!==el.dataset.role);},{quiet:true});return;}
  if(['preview-role','journey-role','preview-dialog-role'].includes(el.id)){ui.role=el.value;renderAll({keepScroll:true});if(el.id==='preview-dialog-role')renderPreview();return;}
  if(el.id==='show-labels'){ui.showDescriptions=el.checked;renderMap();fitMap();return;}
  if(el.id.startsWith('filter-')){const key=el.id.replace('filter-','');if(['status','type','access'].includes(key)){ui.filters[key]=el.value;renderAll({keepScroll:true});}return;}
});
$('#modal').addEventListener('submit',event=>{
  event.preventDefault();const form=$('#modal-form');if(!form)return;const fd=new FormData(form),kind=$('#modal').dataset.kind;
  if(!form.reportValidity())return;
  if(kind==='add-page')submitAdd(fd);else if(kind==='move-page')submitMove(fd);else if(kind==='change-type')submitType(fd);else if(kind==='add-tab')submitTab(fd);else if(kind==='journey')submitJourney(fd);else if(kind==='catalog')submitCatalog(fd);else if(kind==='catalog-add')submitCatalogAdd(fd);else if(kind==='settings'){const name=String(fd.get('name')||'').trim();if(!name)return showFormError('Name the workspace.');closeModal();commit('Workspace settings saved',()=>{project.workspace.name=name;project.workspace.description=String(fd.get('description')||'').trim();});}else if(kind==='link-components'){const p=byId(ui.selected),ids=fd.getAll('componentIds').filter(id=>project.components.some(c=>c.id===id));closeModal();commit('Component references saved',()=>p.componentIds=ids);}
});
$('#modal').addEventListener('close',()=>{renderInspector({keepScroll:true});const el=ui.modalReturnFocus;if(el?.isConnected)el.focus({preventScroll:true});});
$('#modal').addEventListener('click',event=>{if(event.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeModal();}});
$('#command-modal').addEventListener('click',event=>{if(event.target===$('#command-modal'))$('#command-modal').close();});
$('#import-file').addEventListener('change',event=>{const file=event.target.files[0];event.target.value='';handleImport(file);});
document.addEventListener('contextmenu',event=>{const node=event.target.closest('[data-node]'),row=event.target.closest('[data-row]');if(node||row){event.preventDefault();openNodeMenu(node?.dataset.node||row.dataset.row,{left:event.clientX,right:event.clientX,top:event.clientY,bottom:event.clientY});}});
// Pointer-based canvas navigation; HTML drag and drop is exclusively structural.
const viewport=$('#map-viewport');let pan=null;let spaceDown=false;
viewport.addEventListener('pointerdown',event=>{if(event.button!==0&&event.button!==1)return;if(event.target.closest('.map-tools-top,.minimap,button,input,select'))return;if(event.target.closest('[data-node]')&&!spaceDown&&event.button!==1)return;event.preventDefault();pan={x:event.clientX,y:event.clientY,tx:ui.transform.x,ty:ui.transform.y,id:event.pointerId};viewport.classList.add('panning');viewport.setPointerCapture(event.pointerId);});
viewport.addEventListener('pointermove',event=>{if(!pan||event.pointerId!==pan.id)return;ui.transform.x=pan.tx+event.clientX-pan.x;ui.transform.y=pan.ty+event.clientY-pan.y;applyTransform();});
function endPan(event){if(!pan)return;try{viewport.releasePointerCapture(pan.id);}catch{}pan=null;viewport.classList.remove('panning');}
viewport.addEventListener('pointerup',endPan);viewport.addEventListener('pointercancel',endPan);
viewport.addEventListener('wheel',event=>{if(event.target.closest('.map-tools-top,.map-legend'))return;event.preventDefault();const factor=Math.exp(-Math.max(-80,Math.min(80,event.deltaY))*.004);zoomAt(factor,event.clientX,event.clientY);},{passive:false});
$('#minimap').addEventListener('click',event=>{event.stopPropagation();const svg=$('#minimap-svg');try{const point=new DOMPoint(event.clientX,event.clientY).matrixTransform(svg.getScreenCTM().inverse());ui.transform.x=viewport.clientWidth/2-point.x*ui.transform.z;ui.transform.y=viewport.clientHeight/2-point.y*ui.transform.z;applyTransform();}catch{fitMap();}});
let dragHover=null;
document.addEventListener('dragstart',event=>{const node=event.target.closest('[data-node]');if(!node||spaceDown){event.preventDefault();return;}const p=byId(node.dataset.node);if(!p||p.parentId===null){event.preventDefault();return;}ui.dragId=p.id;event.dataTransfer.setData('text/plain',p.id);event.dataTransfer.effectAllowed='move';node.classList.add('dragging');});
document.addEventListener('dragover',event=>{if(!ui.dragId)return;const node=event.target.closest('[data-node]');if(!node)return;event.preventDefault();if(dragHover&&dragHover!==node)dragHover.classList.remove('drop-valid','drop-invalid');dragHover=node;const target=byId(node.dataset.node);const valid=target&&target.id!==ui.dragId&&!descendants(ui.dragId).some(d=>d.id===target.id)&&target.type!=='external';node.classList.toggle('drop-valid',!!valid);node.classList.toggle('drop-invalid',!valid);event.dataTransfer.dropEffect=valid?'move':'none';$('#drop-guide').hidden=!valid;});
document.addEventListener('drop',event=>{if(!ui.dragId)return;event.preventDefault();const node=event.target.closest('[data-node]'),id=ui.dragId;clearDrag();if(!node)return;const target=byId(node.dataset.node);if(target&&target.id!==id&&!descendants(id).some(d=>d.id===target.id)&&target.type!=='external')openMove(id,target.id);});
function clearDrag(){ui.dragId=null;$$('.dragging,.drop-valid,.drop-invalid').forEach(el=>el.classList.remove('dragging','drop-valid','drop-invalid'));dragHover=null;$('#drop-guide').hidden=true;}
document.addEventListener('dragend',clearDrag);
// Keyboard equivalents for all core structural operations.
let treeTypeahead='',typeaheadTimer;
document.addEventListener('keydown',event=>{
  const input=event.target.matches('input,textarea,select,[contenteditable=true]');const mod=event.ctrlKey||event.metaKey;
  if(!$('#tour-layer').hidden){if(event.key==='Escape'){event.preventDefault();endTour();return;}if(event.key==='Tab'){const list=$$('button:not([disabled])',$('.tour-card')),i=list.indexOf(document.activeElement);event.preventDefault();list[(i+(event.shiftKey?-1:1)+list.length)%list.length]?.focus();}return;}
  if($('#command-modal').open){if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();const length=ui.commandItems.length;if(length){ui.commandIndex=(ui.commandIndex+(event.key==='ArrowDown'?1:-1)+length)%length;$$('.command-result').forEach((el,i)=>el.classList.toggle('focused',i===ui.commandIndex));$(`[data-command-index="${ui.commandIndex}"]`)?.scrollIntoView({block:'nearest'});}}else if(event.key==='Enter'){event.preventDefault();chooseCommand(ui.commandIndex);}return;}
  if($('#modal').open)return;
  if(mod&&event.key.toLowerCase()==='k'){event.preventDefault();openSearch();return;}
  if(event.key==='Escape'){closePopup();if(innerWidth<=760&&ui.inspectorOpen){ui.inspectorOpen=false;updateHeader();requestAnimationFrame(fitMap);}return;}
  if(input){if(event.key==='Enter'&&event.target.matches('#page-title,#page-route')){event.preventDefault();event.target.blur();}return;}
  if(mod&&event.key.toLowerCase()==='z'){event.preventDefault();event.shiftKey?redo():undo();return;}
  if(mod&&event.key.toLowerCase()==='y'){event.preventDefault();redo();return;}
  if(mod&&event.key.toLowerCase()==='s'){event.preventDefault();exportJSON();return;}
  if(event.target.matches('[role=tab]')&&['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){event.preventDefault();const tabs=['details','navigation','access','related'],index=tabs.indexOf(ui.tab);ui.tab=event.key==='Home'?tabs[0]:event.key==='End'?tabs[3]:tabs[(index+(event.key==='ArrowRight'?1:-1)+4)%4];renderInspector();$('#inspector-tab-'+ui.tab)?.focus({preventScroll:true});return;}
  const node=event.target.closest('[data-node]');
  if(node){const id=node.dataset.node;const index=ui.visible.findIndex(p=>p.id===id);let target=null;
    if(event.key==='ArrowDown')target=ui.visible[Math.min(ui.visible.length-1,index+1)]?.id;
    if(event.key==='ArrowUp')target=ui.visible[Math.max(0,index-1)]?.id;
    if(event.key==='Home')target=ui.visible[0]?.id;
    if(event.key==='End')target=ui.visible[ui.visible.length-1]?.id;
    if(event.key==='ArrowRight'){if(children(id).length&&ui.collapsed.has(id)){ui.collapsed.delete(id);renderAll({refit:true});target=id;}else target=children(id)[0]?.id;}
    if(event.key==='ArrowLeft'){if(children(id).length&&!ui.collapsed.has(id)){ui.collapsed.add(id);renderAll({refit:true});target=id;}else target=byId(id)?.parentId;}
    if(event.key==='Enter'){event.preventDefault();selectPage(id);$('#node-'+id)?.focus({preventScroll:true});return;}
    if(target){event.preventDefault();if(!ui.positions.has(target)){reveal(target);renderMap();}$$('[data-node]').forEach(el=>el.tabIndex=el.dataset.node===target?0:-1);$('#node-'+target)?.focus({preventScroll:true});return;}
    if(event.key.length===1&&!mod&&/^[a-zA-Z]$/.test(event.key)&&!['n','f'].includes(event.key.toLowerCase())){treeTypeahead+=event.key.toLowerCase();clearTimeout(typeaheadTimer);typeaheadTimer=setTimeout(()=>treeTypeahead='',650);const ordered=[...ui.visible.slice(index+1),...ui.visible.slice(0,index+1)],match=ordered.find(p=>p.title.toLowerCase().startsWith(treeTypeahead));if(match){event.preventDefault();$('#node-'+match.id)?.focus({preventScroll:true});return;}}
  }
  if(event.target.closest('[data-row]')&&event.key==='Enter'){event.preventDefault();selectPage(event.target.closest('[data-row]').dataset.row);return;}
  if(event.key===' '&&ui.view==='map'&&!event.target.closest('button')){event.preventDefault();spaceDown=true;viewport.classList.add('space-pan');}
  if(event.key==='F2'){event.preventDefault();handleAction('rename-page');return;}
  if(event.key==='Delete'){event.preventDefault();openDelete();return;}
  if(!mod&&event.key.toLowerCase()==='n'){event.preventDefault();openAdd();return;}
  if(!mod&&event.key.toLowerCase()==='f'){event.preventDefault();centerSelected();return;}
  if(event.key==='0'){event.preventDefault();fitMap();return;}
  if(event.key==='+'||event.key==='='){event.preventDefault();zoomAt(1.2);return;}
  if(event.key==='-'){event.preventDefault();zoomAt(1/1.2);return;}
  if(event.key==='?'){event.preventDefault();openHelp();}
});
document.addEventListener('keyup',event=>{if(event.key===' '){spaceDown=false;viewport.classList.remove('space-pan');}});
window.addEventListener('blur',()=>{spaceDown=false;viewport.classList.remove('space-pan');endPan();});
let resizeTimer;
window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{fitMap();if(!$('#tour-layer').hidden)renderTour();},90);});

function relatedButton(p){return `<button class="nearby-page" data-action="select-page" data-id="${esc(p.id)}">${ic(p.icon)}<span><b>${esc(p.title)}</b><small>${esc(p.route||'Non-routable container')}</small></span>${ic('chevron-right')}</button>`;}
function nearbySections(p){const parent=byId(p.parentId),siblings=children(p.parentId).filter(q=>q.id!==p.id),ch=children(p.id);return `${parent?`<section class="inspector-section"><div class="section-label">Parent page</div>${relatedButton(parent)}</section>`:''}<section class="inspector-section"><div class="section-label">Sibling pages <span class="subtle">${siblings.length}</span></div>${siblings.map(relatedButton).join('')||'<p class="field-note">No sibling pages.</p>'}</section><section class="inspector-section"><div class="section-label">Child pages <span class="subtle">${ch.length}</span><button class="text-button" data-action="add-child">Add child</button></div>${ch.map(relatedButton).join('')||'<p class="field-note">No child pages.</p>'}</section>`;}
function nearbySummary(p){const parent=byId(p.parentId),siblings=children(p.parentId).filter(q=>q.id!==p.id);if(!parent)return '';return `<section class="inspector-section"><div class="section-label"><span>In this section</span><button class="text-button" data-action="show-related">View related</button></div><div class="nearby-parent">${ic('folder')}<button data-action="select-page" data-id="${esc(parent.id)}">${esc(parent.title)}</button><small>${siblings.length} siblings</small></div><div class="nearby-chips">${siblings.slice(0,4).map(q=>`<button data-action="select-page" data-id="${esc(q.id)}">${esc(q.title)}</button>`).join('')}${siblings.length>4?`<button data-action="show-related">+${siblings.length-4}</button>`:''}</div></section>`;}
function renderPageTree(){const panel=$('#sitemap-tree');panel.hidden=!ui.treeOpen;$('#application').classList.toggle('tree-open',!!ui.treeOpen);if(!ui.treeOpen)return;const hiddenIds=new Set([...ui.collapsed].flatMap(id=>descendants(id).map(p=>p.id)));const pages=orderedPages().filter(p=>!hiddenIds.has(p.id));panel.innerHTML=`<div class="tree-heading"><h2>Pages <span>${project.pages.filter(p=>p.type!=='container').length}</span></h2><button class="icon-button" data-action="toggle-page-tree" aria-label="Close page tree">${ic('x')}</button></div><button class="tree-search" data-action="search">${ic('search')}<span>Find a page…</span><kbd>⌘ K</kbd></button><div class="tree-caption"><span>PAGE HIERARCHY</span><button data-action="expand-all">Expand all</button></div><div class="tree-scroll">${pages.map(p=>{const depth=ancestors(p.id).length,has=children(p.id).length;return `<div class="tree-row ${p.id===ui.selected?'selected':''}" style="padding-left:${10+Math.min(depth,10)*14}px">${has?`<button class="tree-chevron" data-action="toggle-node" data-id="${esc(p.id)}" aria-label="${ui.collapsed.has(p.id)?'Expand':'Collapse'} ${esc(p.title)}">${ic(ui.collapsed.has(p.id)?'chevron-right':'chevron-down')}</button>`:'<span class="tree-chevron"></span>'}<button class="tree-page" data-action="select-page" data-id="${esc(p.id)}">${ic(p.icon)}<span>${esc(p.title)}</span>${has?`<small>${has}</small>`:''}</button></div>`;}).join('')}</div><div class="tree-foot">${ic('shield')}<span>Structure changes do not change routes.</span></div>`;}

// Initial rendering. No network requests, CDNs or external font assets.
hydrate();renderAll();requestAnimationFrame(()=>requestAnimationFrame(fitMap));
if(!storageOK){$('#save-state').classList.add('warning');$('#save-label').textContent='Session only';$('#save-detail').textContent='Export a JSON backup';}
else {try{if(localStorage.getItem(STORAGE_KEY)){$('#save-label').textContent='Saved locally';$('#save-detail').textContent='Workspace restored';}}catch{}}
if(startupNotice)setTimeout(()=>toast(startupNotice,'error'),400);
window.JourneyLens=Object.freeze({version:'2.0.0-review',runtime:'vanilla-js-review-not-vue',getWorkspace:()=>clone(project),validateWorkspace:raw=>validateImport(raw)});
})();
</script>
