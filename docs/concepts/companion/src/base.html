}

pe</h3><p>Explicit fields and frontmatter mapping</p></div></div><div class="check-row">${icon('layers')}<div><h3>One registration</h3><p>No new business logic in main.ts</p></div></div><div class="check-row">${icon('shield')}<div><h3>Test + Markdown fixture</h3><p>Generated tests use real shared services</p></div></div></div>${callout('A maker does <strong>not</strong> create a finished user interface. View, store, modal and custom makers remain planned in the template.')}<div class="card"><h3>Your generated features</h3>${p.features.length?p.features.map(f=>`<div class="check-row"><span class="icon-tile">${icon('file')}</span><div class="grow"><h3>${esc(f.name)}</h3><p>${esc(f.entity)} · ${esc(f.folder)}</p></div>${badge('Demo')}</div>`).join(''):'<p>No generated features yet. Preview your first one.</p>'}</div></section></div>`;}

e review.</p>':''}<div class="mt16">${button('Export concept handoff','handoff','','','download')}</div></div></section></div>`;}

// Concept section: wizard
function wizardView(){
 const w=state.wizard;const busy=w.status==='running';
 const body=[welcomeStep,environmentStep,sourceStep,identityStep,targetStep,reviewStep,executionStep,finishStep][w.step]();
 let primary='Continue',action='wizard-next',disabled=false;
 if(w.step===2){primary=w.acquired?'Continue':'Acquire template fixture';action=w.acquired?'wizard-next':'acquire';}
 if(w.step===5){primary=w.plan?'Approve & simulate preparation':'Prepare simulated plan';action=w.plan?'setup':'plan';disabled=w.plan?!w.approved||w.plan.changes.some(f=>f.status==='conflict'):!w.trusted;}
 if(w.step===6){primary=busy?'Cancel simulation':'Review & resume';action=busy?'cancel-run':'resume';}
 if(w.step===7){primary='Open project workspace';action='finish';}
 return modalHeader('Prepare this vault',`Step ${w.step+1} of 8 · ${STEPS[w.step]} · demo only`)+`<div class="wizard-layout"><nav class="wizard-steps" aria-label="Setup progress">${STEPS.map((s,i)=>`<div class="wizard-step ${i===w.step?'current':i<w.step?'complete':''}" ${i===w.step?'aria-current="step"':''}><b>${i<w.step?'✓':i+1}</b><span>${s}</span></div>`).join('')}<div class="steps-caption">Drafts stay in this browser.<br>No real project files are changed.</div></nav><section class="wizard-body">${body}<div id="wizard-error" class="error" role="alert">${esc(w.error||'')}</div></section></div><div class="dialog-footer"><div>${w.step>0&&w.step<6?button('Back','wizard-back','','ghost','arrow'):button(w.step===6&&busy?'Keep running in demo':'Save & close','close','','ghost')}</div><div class="row"><span class="small subtle">${w.step===6?'Fixture execution':w.step===5?'Review before mutation':'Progress is saved'}</span>${button(primary,action,'','primary',w.step===6&&busy?'stop':'arrow',disabled?'disabled':'')}</div></div>`;
}
function welcomeStep(){return `<span class="icon-tile large">${icon('folder')}</span><h2 class="mt24">Prepare the project already in this vault.</h2><p>Your requirements, sitemap and components remain attached to the same project. The current vault is the source root; no project or folder picker is needed.</p>${vaultLocationCard()}${callout('The folder is no longer empty: Obsidian configuration and the companion are already here. Stage the template separately, compare destinations, then add only reviewed files. Never clone over the vault.')}<p class="mt16">The generated plugin is tested in <code>${esc(vaultDisplayTarget(state.wizard?.vault||vaultTestRoot()))}/</code>, a separate host context. The companion stays in this authoring vault.</p>${callout('<strong>Offline simulation.</strong> Paths, downloads and results are fixtures. No vault API or process is accessed.')}`;}
function environmentStep(){const missing=state.scenario==='missing-node';return `<h2>Check the build toolchain.</h2><p>The real companion will check an external Node executable and npm separately. Designing never requires these tools. These are fixture results, not a scan of your computer.</p><div class="card">${[['Node.js',missing?'Not found':'24.21.0 · selected baseline',!missing],['npm','11.19.1 · selected baseline',true],['Desktop host','Obsidian / current project vault · fixture',true]].map(([n,d,ok])=>`<div class="check-row"><span class="check-icon ${ok?'done':''}">${ok?'✓':'!'}</span><div class="grow"><h3>${n}</h3><p>${d}</p></div>${badge(ok?'Available · demo':'Blocked',ok?'good':'bad')}</div>`).join('')}</div><div class="mt16">${missing?callout('<strong>Node is missing in this scenario.</strong> The real product must not install it globally or modify PATH. Restore the available-toolchain fixture to continue.','warn'):callout('Obsidian’s Electron runtime is <strong>not</strong> the project’s selected Node executable. Git and an editor are optional.')}</div>${missing?`<div class="button-row">${button('Use available-toolchain fixture','restore-env','','','refresh')}</div>`:''}<details class="mt16"><summary class="small muted">Inspect example executable locations</summary><div class="context-path mt16">Node: /opt/node/bin/node<br>npm CLI: /opt/node/lib/node_modules/npm/bin/npm-cli.js<br>These locations are synthetic.</div></details>`;}
function sourceStep(){const w=state.wizard;return `<h2>Choose a starting point.</h2><p>Download and execution are separate decisions. A source archive is not an installable Obsidian plugin.</p><div class="field"><label for="source-kind">Template source</label><select id="source-kind" data-field="w-source"><option value="snapshot" ${w.source==='snapshot'?'selected':''}>Pinned iteration-03 snapshot · fixture</option><option value="cache" ${w.source==='cache'?'selected':''}>Previously checked local cache · fixture</option></select><small>No public template release or real download is represented.</small></div><div class="card"><div class="row"><span class="icon-tile">${icon('box')}</span><div class="grow"><h3>Plugin Shell Template</h3><span class="small muted">${BASELINE}</span></div>${badge(w.acquired?'Staged · demo':'Not acquired',w.acquired?'good':'')}</div><p class="mt16">TypeScript · Vue · Pinia · Nuxt UI<br>Entities, documents, shared services and quality tooling.</p></div><div class="mt24"><h3>Destination: this vault</h3><div class="context-path">${esc(vaultRoot())}</div><p class="small muted">Fixed by the host context. Template staging uses separate scratch space before reviewed hydration. No destination picker.</p></div>${state.scenario==='offline'&&w.source==='snapshot'?callout('The remote source is unavailable in this offline scenario. Choose the cached fixture; dependency availability is still a separate concern.','warn'):''}${w.acquired?callout('<strong>Template staged outside the vault in this demo.</strong> No code has been executed. Provenance is illustrative, not a cryptographic attestation.','good'):''}`;}
function identityStep(){const w=state.wizard;return `<h2>Give your plugin an identity.</h2><p>These values belong to the generated project, never to the companion. You can revisit them before approval.</p><div class="field-grid">${field('Display name','w-name',w.name)}${field('Plugin ID','w-id',w.id,'Lowercase, kebab-case. Local and public naming checks differ.')}${field('Author','w-author',w.author)}${field('Initial version','w-version',w.version,'Stable x.y.z format.')}</div>${field('Description','w-description',w.description)}${callout('Setup updates the consumer manifest and root package metadata. Existing dependency resolutions, license and unrelated source remain unchanged.')}<p class="scope-label mt16">Public listing readiness is checked separately. This concept does not reserve an ID.</p>`;}
function targetStep(){const w=state.wizard;return `<h2>Test outside the authoring context.</h2><p>The current vault remains your project workspace. A separate, project-contained test vault receives only built assets.</p><div class="choice selected">${icon('folder')}<div><strong>${esc(vaultDisplayTarget(w.vault))} · isolated test target</strong><p>Not the vault currently hosting the companion.</p></div></div><div class="context-path mt24">${esc(vaultTestRoot())}/.obsidian/plugins/${esc(w.id)}/</div><label class="checkbox"><input type="checkbox" data-field="w-bound" ${w.bound?'checked':''}><span>I approve this isolated test target. Installing the generated plugin does not enable it.</span></label>${callout('The template installer supports an explicit contained --vault target. This concept simulates its receipt; it does not create a vault or change Restricted Mode.')}`;}
function reviewStep(){const w=state.wizard;return `<h2>Review changes to this vault.</h2><p>Acquisition and execution are distinct. All paths below are relative to the current vault. Your design stays in the same project.</p><label class="checkbox"><input type="checkbox" data-field="w-trusted" ${w.trusted?'checked':''}><span>I trust these project scripts to run with my user permissions. This is not an operating-system sandbox.</span></label><div class="vault-preserved">${badge('Preserve '+CONCEPT_VAULT.config)}${badge('Preserve project/ notes')}${badge('No activation')}${badge('No Git initialization')}</div>${w.plan?`<h3>Illustrative file plan</h3><div class="vault-plan">${w.plan.changes.map(f=>`<div class="file-row">${icon('file')}<span class="grow">${esc(f.path)}</span>${badge(f.status,f.status==='conflict'?'bad':f.status==='create'?'good':'')}</div>`).join('')}</div><p class="small muted">Identical files are unchanged; conflicting files are never overwritten. Project.md updates require its exact owned preimage. This list is not a real template manifest.</p>${command(getSetupCommand(w,true))}<p class="scope-label">POSIX display example, after template hydration. Production launch uses argument arrays. Setup and isolated installation produce separate receipts.</p><label class="checkbox"><input type="checkbox" data-field="w-approved" ${w.approved?'checked':''}><span>I approve these simulated changes, dependency installation, verification and installation into ${esc(vaultDisplayTarget(w.vault))}.</span></label>`:`<div class="card mt24"><h3>Preparation preserves existing work</h3><p>The plan will show template files, conflicts, dependency installation and the isolated test target. Empty-vault initialization does not require an empty filesystem.</p></div>${command(getSetupCommand(w,false))}`}`;}

function makerFiles(){const g=state.generator;const group=g.kind==='feature'?g.name:g.group;return [`src/features/${group}/${g.entity}.ts`,`src/features/${group}/${g.entity}-document.ts`,'src/bootstrap/features.ts',`tests/features/${g.entity}.test.ts`,`tests/fixtures/${g.entity}.md`];}
function makerCode(index){const g=state.generator;const group=g.kind==='feature'?g.name:g.group;const fields=g.preset==='task'?"title: fields.text({ min: 1 }),\n  status: fields.defaulted(fields.text(), 'todo'),\n  tags: fields.defaulted(fields.textList(), []),\n  due: fields.optional(fields.text()),":g.preset==='project'?"name: fields.text({ min: 1 }),\n  budget: fields.defaulted(fields.number({ min: 0 }), 0),\n  archived: fields.defaulted(fields.boolean(), false),":"title: fields.text({ min: 1 }),";return ['// Concept snippet, not actual maker output.\n// Use the qualified API for implementation.\nimport { defineEntity, fields } from \'../api\';\n\nexport const '+g.entity+' = defineEntity(\n  \''+g.entity+'\', 1, {\n  '+fields+'\n});',`// Concept: explicit document projection\n// Every repository field needs a mapping.\ndefineNoteFeature({\n  document: ${g.entity}Document,\n  defaultFolder: '${g.folder}',\n});`,`// Concept: one registration, shared lifecycle\n// Existing registry text is preserved.\n${g.entity}: register(${group}Feature)`,`// Concept: expected real-service test coverage\n// 1. Preview without writing\n// 2. Commit exact Markdown\n// 3. Preserve body on update\n// 4. Reject stale revision\n// 5. Reversible delete`, `---\ntype: ${g.entity}\nschema: 1\n${g.preset==='project'?'name: Example project\nbudget: 0\narchived: false':'title: Example note'}\n---\n\n# Illustrative fixture\n\nNo vault note is created by this prototype.`][index];}

function wizardError(message){state.wizard.error=message;redrawModal();save();}
function validLocation(path){return typeof path==='string'&&path.length<240&&path.startsWith('/')&&!path.includes('..')&&!/[\0\r\n]/.test(path);}
function identityError(w){if(!w.name.trim()||w.name.length>80||/[\r\n]/.test(w.name))return 'Provide a single-line display name between 1 and 80 characters.';if(!safeSlug(w.id)||w.id.length>60)return 'Use a portable lowercase kebab-case ID; reserved device names are not allowed.';if(w.id==='shell-workbench')return 'The generated plugin cannot use the companion’s identity.';if(!/^\d+\.\d+\.\d+$/.test(w.version)||w.version.length>30)return 'Enter a stable x.y.z version, such as 1.0.0.';if(!w.author.trim()||w.author.length>100)return 'Provide an author name before preparation (up to 100 characters).';return '';}
function nextWizard(){const w=state.wizard;w.error='';if(!validPreparationScope(w))return wizardError('The source root must remain this vault; the preparation target must remain its isolated .test-vault.');if(w.step===1&&state.scenario==='missing-node')return wizardError('Node is unavailable. Your design is retained; restore the toolchain fixture to prepare source.');if(w.step===2&&!w.acquired)return wizardError('Stage the reviewed template fixture first.');if(w.step===3){const e=identityError(w);if(e)return wizardError(e);}if(w.step===4&&!w.bound)return wizardError('Approve the isolated test target before continuing.');w.step=Math.min(7,w.step+1);showModal('wizard');save();}
function acquire(){const w=state.wizard;w.error='';if(!validLocation(w.root))return wizardError('Use a safe absolute fixture path without parent traversal.');if(state.scenario==='offline'&&w.source==='snapshot')return wizardError('Source retrieval failed in the offline scenario. Select the cached fixture and try again.');w.acquired=true;notify('Template fixture staged. No download occurred.');redrawModal();save();}

function makerError(message){state.generator.error=message;const el=document.getElementById('maker-error')||document.getElementById('generator-error');if(el)el.textContent=message;save();}
function previewMaker(){const p=project();const g=state.generator;if(!p){setView('projects');return;}if(!p.trusted){showModal('trust');return;}if(!safeSlug(g.entity)||!safeSlug(g.kind==='feature'?g.name:g.group))return makerError('Use portable lowercase names and select an existing group for an entity.');if(!g.folder.trim()||g.folder.includes('..')||/[\r\n]/.test(g.folder)||g.folder.length>100)return makerError('Choose a bounded note folder without parent traversal or control characters.');g.plan={rev:p.rev,options:JSON.stringify([g.kind,g.name,g.entity,g.preset,g.folder,g.group])};g.error='';state.selectedFile=0;save();showModal('maker');}
function applyMaker(){const p=project();const g=state.generator;if(!p||state.activeRun)return makerError('Finish the active operation before generating source.');if(!p.trusted||!g.plan||g.plan.rev!==p.rev||g.plan.options!==JSON.stringify([g.kind,g.name,g.entity,g.preset,g.folder,g.group]))return makerError('This plan is stale. Close it and preview the current source again.');if(state.scenario==='maker-conflict'){const r=addRun('Generate '+g.entity,'maker',getMakerCommand(true),'failed');r.logs.push('[demo] Edited scaffold conflict. No source written; force overwrite is unavailable.');return makerError('Edited scaffold detected. Nothing was overwritten. Restore Happy path and preview again.');}const exists=p.features.find(f=>f.entity===g.entity);if(exists){const same=exists.name===(g.kind==='feature'?g.name:g.group)&&exists.preset===g.preset&&exists.folder===g.folder;if(!same)return makerError('Entity already exists with different options. Preserve it and choose another entity name.');const r=addRun('Generate '+g.entity,'maker',getMakerCommand(true),'succeeded');r.logs.push('[demo] Identical registered rerun: no source changes.');closeModal();render();return notify('Identical demo feature already exists. No-op; revision unchanged.');}const applied={...g};const r=addRun('Generate '+g.entity,'maker',getMakerCommand(true));state.activeRun=r.id;closeModal();setView('runs');runTimer=setTimeout(()=>{p.features.push({name:applied.kind==='feature'?applied.name:applied.group,entity:applied.entity,preset:applied.preset,folder:applied.folder});invalidateProject(p);r.logs.push('[demo] Source fixture created; registration and test fixture retained.');r.status=state.scenario==='test-failure'?'failed':'succeeded';r.logs.push(r.status==='failed'?'[demo] Generated test failed. Source is retained; full verify not run.':'[demo] Typecheck, generated test and catalog checks passed in this simulation. Full verify not run.');state.activeRun=null;g.plan=null;save();render();notify(r.status==='failed'?'Generated source retained. The simulated test failed.':'Feature generated in the demo. Full verification is now stale.');},700);}
function runCheck(key){const p=project();if(!p||state.activeRun)return;if(!p.trusted){showModal('trust');return;}const cmd=key==='browser'?'test:e2e':key==='native'?'test:native':key==='security'?'check:security':key;const r=addRun('Run '+cmd,'check','npm run '+cmd);state.activeRun=r.id;closeModal();render();runTimer=setTimeout(()=>{const fail=(state.scenario==='offline'&&key==='security')||state.scenario==='test-failure';r.status=fail?'failed':'succeeded';r.logs.push(`[demo] ${cmd}: ${fail?'failed':'passed'} in the selected fixture.`, '[demo] No other scope is promoted.');if(['verify','browser','native','security'].includes(key))p.quality[key]={status:fail?'failed':'passed',rev:p.rev};if(!fail&&['build','verify'].includes(key))p.builtRev=p.rev;state.activeRun=null;save();render();notify(`${cmd}: ${fail?'failed':'passed'} in simulation only.`);},650);}
function startSession(cmd){const p=project();if(!p||state.activeRun)return;if(!p.trusted){showModal('trust');return;}if(p.sessions.includes(cmd))return notify('That fixture session already exists.');p.sessions.push(cmd);const r=addRun('Start '+cmd,'session','npm run '+cmd,'succeeded');r.logs.push('[demo] Session fixture opened. No process, watcher or server exists.');closeModal();render();}
function stopSession(cmd){const p=project();p.sessions=p.sessions.filter(s=>s!==cmd);const r=addRun('Stop '+cmd,'session','No CLI launched — session stop fixture','succeeded');r.logs.push('[demo] Session stopped in browser state.');render();notify('Fixture session stopped.');}
function deploy(){const p=project();if(!p||state.activeRun)return;if(!p.trusted){showModal('trust');return;}if(state.scenario==='collision'){document.getElementById('operation-error').textContent='Target collision. Existing fixture assets and data are preserved.';return;}if(p.rev!==p.builtRev)return;p.installedRev=p.builtRev;const r=addRun('Deploy accepted candidate','deploy','Proposed shared bound-target operation — no current CLI flag','succeeded');r.logs.push('[demo] Complete asset set promoted; settings and notes preserved. Activation unchanged.');closeModal();render();notify('Fixture candidate installed. Activation was not changed.');}
function finishSetup(view='overview'){state.wizard=null;closeModal();setView(view);}
function loadSample(){if(state.activeRun||project())return notify('This vault already has a project. Choose a blueprint within that design, or open another Obsidian vault.');try{installPlanningProject(demoProject());closeModal();setView('overview');notify('Example design loaded into this vault’s project. No template, build or test was run.');}catch(e){notify(e.message);}}
function attachProject(){notify('Open the existing project folder as its own Obsidian vault. This workspace has no external project attachment.');}
async function copyText(text){try{if(!navigator.clipboard)throw Error();await navigator.clipboard.writeText(text);notify('Copied. Nothing was executed.');}catch{showModal('copy',{text});}}
function handoffText(){const p=project();return `# Shell Workbench concept handoff\n\n**Browser simulation only. Not project verification evidence.**\n\n## Fixture project\n\nPlugin: ${p?.id||'none'}\nVersion: ${p?.version||'none'}\nSource revision: ${p?.rev||0}\nBuilt revision: ${p?.builtRev||0}\nInstalled revision: ${p?.installedRev||0}\n\n## Simulated scopes\n\n${SCOPES.map(([k,t])=>`${t}: ${p?.quality[k]?p.quality[k].rev!==p.rev?'stale':p.quality[k].status:'not run'}`).join('\n')}\n\n## Outstanding implementation gates\n\nCommunity policy interpretation; shared bound-vault deployment; independent template export; real CLI parity; desktop qualification.\n\nNo tag, release, host activation or directory submission occurred.\nAbsolute source paths, author names and raw logs are omitted.\n`;}
function diagnosticText(){return JSON.stringify({kind:'concept-only-diagnostics',schema:1,realOperationsExecuted:0,runs:state.runs.map(r=>({id:r.id,kind:r.kind,status:r.status,stageCount:r.stages.length})),note:'No paths, project names, raw logs, credentials or environment fields included.'},null,2);}
function downloadText(data=modalData){const {text,filename}=data;const blob=new Blob([text],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Concept text exported. This is not real project evidence.');}

// Concept section: interactions
function dispatch(action,value){
 const p=project();
 switch(action){
 case 'nav':setView(value);break;
 case 'palette-nav':closeModal();setView(value);break;
 case 'menu':toggleWorkbenchNavigation();break;
 case 'create':if(!state.wizard)state.wizard=newWizard();showModal('wizard');break;
 case 'close':closeModal();break;
 case 'return-wizard':showModal('wizard');break;
 case 'wizard-next':nextWizard();break;
 case 'wizard-back':state.wizard.step--;state.wizard.error='';state.wizard.plan=null;state.wizard.approved=false;showModal('wizard');break;
 case 'restore-env':state.scenario='happy';state.wizard.error='';redrawModal();save();break;
 case 'acquire':acquire();break;
 case 'plan':preparePlan();break;
 case 'setup':beginSetup();break;
 case 'cancel-run':cancelRun();break;
 case 'resume':state.wizard.resume=true;state.wizard.step=5;state.wizard.plan=null;state.wizard.approved=false;state.wizard.error='';state.wizard.status='draft';showModal('wizard');break;
 case 'finish':finishSetup();break;
 case 'finish-generate':finishSetup('generate');break;
 case 'active-run':if(state.wizard?.status==='running')showModal('wizard');else showModal('run-detail',state.activeRun);break;
 case 'lab':showModal('lab');break;
 case 'scenario':if(state.activeRun){notify('Finish the current run before changing its fixture.');break;}state.scenario=value;save();redrawModal();break;
 case 'sample':loadSample();break;
 case 'switch':showModal('switch');break;
 case 'select-project':notify('Use Obsidian to open another vault.');break;
 case 'attach':showModal('attach');break;
 case 'attach-confirm':attachProject();break;
 case 'settings':showModal('settings');break;
 case 'theme':state.settings.theme=state.settings.theme==='dark'?'light':'dark';render();redrawModal();break;
 case 'palette':showModal('palette');break;
 case 'activate':showModal('activate');break;
 case 'enable-demo':{const target=project()?.id===value?project():null;if(target)target.enabled=!target.enabled;save();render();redrawModal();break;}
 case 'recipe':state.generator.kind=value;state.generator.plan=null;state.generator.error='';render();break;
 case 'maker-nav':closeModal();setView('generate');break;
 case 'maker-preview':previewMaker();break;
 case 'maker-apply':applyMaker();break;
 case 'file-preview':state.selectedFile=Number(value);redrawModal();break;
 case 'edit-source':if(!p)break;if(state.activeRun){notify('Finish the current operation before the edit fixture.');break;}invalidateProject(p);render();notify('Fixture source changed. Previous verification is now stale.');break;
 case 'session':showModal('session',value);break;
 case 'session-confirm':startSession(value);break;
 case 'stop-session':stopSession(value);break;
 case 'check':showModal('check',value);break;
 case 'check-confirm':runCheck(value);break;
 case 'deploy':showModal('deploy');break;
 case 'deploy-confirm':deploy();break;
 case 'tool-tab':state.toolTab=value;render();break;
 case 'tools':state.toolTab='tools';closeModal();setView('capabilities');break;
 case 'tool':showModal('tool',value);break;
 case 'service':showModal('service',value);break;
 case 'catalog':showModal('service','catalog');break;
 case 'run-detail':showModal('run-detail',value);break;
 case 'preview-plugin':showModal('preview-plugin');break;
 case 'copy':void copyText(value);break;
 case 'note':showModal('note');break;
 case 'commit-note':if(p&&!p.notes.length){p.notes.push(projectNote());save();redrawModal();notify('Demo note committed to browser state only.');}break;
 case 'handoff':showModal('copy',{title:'Review this concept-only handoff before downloading. Real paths are omitted.',text:handoffText(),filename:'shell-workbench-concept-handoff.md'});break;
 case 'export-diagnostics':showModal('copy',{title:'Sanitized structural demo data only. No raw logs or paths.',text:diagnosticText(),filename:'shell-workbench-concept-diagnostics.json'});break;
 case 'download-text':downloadText();break;
 case 'reset':showModal('reset');break;
 case 'reset-confirm':resetConceptState();break;
 case 'storage-retained':exportRetainedBrowserData();break;
 case 'storage-recovery':showModal('copy',{title:'Recovery snapshot of committed concept state, including simulated project locations. Unsubmitted form drafts are not included. Keep this file private; it is not an installable plugin or verification evidence.',text:JSON.stringify(state,null,2),filename:'shell-workbench-recovery.json'});break;
 case 'tour':startTour();break;
 case 'tour-pause':pauseTour();break;
 case 'tour-back':state.tourIndex=Math.max(0,state.tourIndex-1);renderTour();break;
 case 'tour-next':if(state.tourIndex===TOUR_STEPS.length-1){state.tourIndex=0;pauseTour();notify('Tour complete. No project action was executed.');}else{state.tourIndex++;renderTour();}break;
 case 'trust-confirm':if(p&&document.getElementById('trust-checkbox').checked){p.trusted=true;save();closeModal();notify('Demo trust granted. Review the intended operation separately.');}break;
 default:notify('This action is outside the current concept.');
 }
}
function updateField(el,commit=false){if(editVaultField(el))return;const key=el.dataset.field;const value=el.type==='checkbox'?el.checked:el.value;
 if(key?.startsWith('w-')){const w=state.wizard;const fieldName=key.slice(2);if(!['name','id','author','description','version','source','bound','trusted','approved'].includes(fieldName))return;w[fieldName]=value;w.error='';if(!['trusted','approved'].includes(fieldName)){w.rev++;w.plan=null;w.approved=false;if(fieldName==='source'||fieldName==='root')w.acquired=false;}if(fieldName==='trusted'&&!value){w.plan=null;w.approved=false;}save();if(commit&&(el.type==='checkbox'||el.tagName==='SELECT'))redrawModal();}
 if(key?.startsWith('g-')){state.generator[key.slice(2)]=value;state.generator.plan=null;state.generator.error='';save();}
 if(key==='tool-search'){state.search=value;document.getElementById('tool-results').innerHTML=toolResults();}
 if(key==='tool-filter'){state.toolFilter=value;document.getElementById('tool-results').innerHTML=toolResults();}
 if(key==='palette-search')document.getElementById('palette-results').innerHTML=paletteResults(value);
 if(key==='remember'){state.settings.remember=value;save();render();}
}
document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b||b.disabled)return;try{dispatch(b.dataset.action,b.dataset.value||'');}catch(error){console.error('Concept interaction failed',error);notify('The concept encountered an error. Export this session from Preferences before reloading. Do not reset as a recovery step; no real operation was performed.');}});
document.addEventListener('input',event=>{if(event.target.dataset.field&&event.target.type!=='checkbox'&&event.target.tagName!=='SELECT')updateField(event.target);});
document.addEventListener('change',event=>{if(event.target.dataset.field&&(event.target.type==='checkbox'||event.target.tagName==='SELECT'))updateField(event.target,true);});
document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();if(document.querySelector('dialog[open]')){notify('Finish or close the current dialog before opening the command palette.');return;}if(activeTour)pauseTour();showModal('palette');}if(modalType==='palette'&&['ArrowDown','ArrowUp'].includes(event.key)){event.preventDefault();const buttons=[...document.querySelectorAll('#palette-results button')];const i=buttons.indexOf(document.activeElement);const next=i<0?(event.key==='ArrowDown'?0:buttons.length-1):(i+(event.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length;buttons[next]?.focus();}});
document.getElementById('modal').addEventListener('cancel',event=>{event.preventDefault();closeModal();});
document.getElementById('tour').addEventListener('cancel',event=>{event.preventDefault();pauseTour();});
window.addEventListener('beforeunload',save);
render();
</script>
