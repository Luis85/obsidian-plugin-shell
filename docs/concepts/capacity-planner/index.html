<div class="shell">
<header class="appbar">
  <div class="brand"><div class="logo" aria-hidden="true">C</div><h1>Capacity</h1></div>

<main id="main" class="main">

    <div class="summary-panel-head"><div><strong>Plan summary</strong><span>Forecast, delivery and planning exceptions</span></div><button type="button" id="summary-close" aria-label="Collapse plan summary">Collapse</button></div>

      <div class="task-list" id="backlog"></div>
    </aside>

    </section>
  </section>

</main>
