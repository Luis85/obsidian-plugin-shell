<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-lMNs5YCZQCT9IuxE1RMbpZX+djuQqk/IffpYjokwP+c='; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; media-src 'none'; worker-src 'none'">
<meta name="description" content="Offline capacity-planner concept for resource, FTE, iteration, task, budget, project-day and hour planning.">
<title>Capacity Planner · Companion concept</title>
<style>:root{
  color-scheme:dark;
  --bg:#111317;--panel:#181b21;--panel2:#20242c;--panel3:#272c35;--line:#343a45;
  --text:#f4f6f8;--muted:#9aa3af;--soft:#c7cdd6;--accent:#8b7cf6;--accent2:#aea3ff;
  --green:#5dca91;--amber:#f2bd5b;--red:#ef7272;--blue:#6fb2ff;--shadow:0 18px 50px rgba(0,0,0,.28);
  --radius:14px;--role-col:260px;--iter-col:194px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}
button,input,select{border:1px solid var(--line);background:#171a20;color:var(--text);border-radius:8px}
button{cursor:pointer;padding:8px 11px}
button:hover{border-color:#545d6c;background:#20242b}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}
button.primary:hover{background:#9a8df9}
button.ghost{background:transparent}
button.danger{color:#ffc3c3;border-color:#754343;background:#2c1e21}
input,select{padding:8px 9px;min-width:0}
label{display:grid;gap:5px;color:var(--soft);font-size:12px}
strong{font-weight:700}
small,.muted{color:var(--muted)}
.skip-link{position:fixed;left:12px;top:-80px;z-index:1000;background:#fff;color:#111;padding:8px 12px;border-radius:8px}
.skip-link:focus{top:12px}
.shell{min-height:100vh}
.appbar{position:sticky;top:0;z-index:40;height:56px;border-bottom:1px solid var(--line);background:rgba(17,19,23,.94);backdrop-filter:blur(14px);display:flex;align-items:center;gap:14px;padding:0 18px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(145deg,var(--accent),#4c3dc6);display:grid;place-items:center;font-weight:800}
.brand h1{font-size:15px;margin:0;white-space:nowrap}
.plan-title{color:var(--muted);border-left:1px solid var(--line);padding-left:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appbar-actions{margin-left:auto;display:flex;gap:8px}
.main{padding:18px;display:grid;gap:14px}
.toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.plan-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 9px;color:var(--soft);font-size:12px}
.pill.warning{border-color:#806430;color:#ffd98d;background:#2b2518}
.pill.positive{border-color:#33624a;color:#a7ecc5;background:#17271f}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(135px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 13px;min-width:0}
.kpi .label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.kpi .value{font-size:20px;font-weight:750;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .sub{margin-top:3px;font-size:11px;color:var(--muted)}
.budget-track{height:4px;background:#2c3038;border-radius:99px;margin-top:8px;overflow:hidden}
.budget-track span{display:block;height:100%;background:var(--green)}
.budget-track span.over{background:var(--red)}
.workspace{display:grid;grid-template-columns:282px minmax(0,1fr);gap:12px;align-items:start}
.sidebar{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;position:sticky;top:70px;max-height:calc(100vh - 88px);display:flex;flex-direction:column}
.sidebar-head{padding:12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.sidebar-head h2{font-size:13px;margin:0}
.sidebar-head button{margin-left:auto}
.task-list{padding:10px;display:grid;gap:8px;overflow:auto}
.task-card{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:9px;display:grid;gap:7px;cursor:grab}
.task-card:active{cursor:grabbing}
.task-card.dragging{opacity:.5}
.task-title{font-weight:650;line-height:1.3}
.task-meta{display:flex;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:11px}
.task-actions{display:flex;gap:6px}
.task-actions button{font-size:11px;padding:5px 7px}
.empty{padding:22px 14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.board-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.board-toolbar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.board-toolbar h2{font-size:13px;margin:0}
.board-toolbar .legend{display:flex;gap:10px;color:var(--muted);font-size:11px;margin-left:auto}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;background:var(--green)}
.dot.over{background:var(--red)}
.dot.open{background:var(--blue)}
.timeline-scroll{overflow:auto;max-height:calc(100vh - 390px);min-height:420px}
.timeline{width:max-content;min-width:100%}
.timeline-row{display:grid;grid-template-columns:var(--role-col) repeat(var(--iteration-count),var(--iter-col))}
.timeline-head{position:sticky;top:0;z-index:20;background:#15181d;border-bottom:1px solid var(--line)}
.corner{position:sticky;left:0;z-index:24;background:#15181d;border-right:1px solid var(--line);padding:10px 12px;display:flex;align-items:end}
.iter-head{padding:10px;border-right:1px solid var(--line);min-height:68px}
.iter-head strong{display:block;font-size:12px}
.iter-head span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.role-row{border-bottom:1px solid var(--line);min-height:var(--lane-height)}
.role-summary{position:sticky;left:0;z-index:10;background:#1a1d23;border-right:1px solid var(--line);padding:11px;display:flex;flex-direction:column;gap:7px}
.role-name-line{display:flex;gap:7px;align-items:center}
.role-name-line strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.role-name-line button{margin-left:auto;font-size:11px;padding:4px 6px}
.role-totals{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:11px}
.role-totals span{background:#14171b;border:1px solid #2b3038;border-radius:7px;padding:5px 6px}
.lane-scale{margin-top:auto;height:5px;background:#292e36;border-radius:99px;overflow:hidden}
.lane-scale span{display:block;height:100%;background:var(--accent)}
.capacity-cell{position:relative;border-right:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:7px;min-height:var(--lane-height);background:#191c22}
.capacity-cell:nth-child(even){background:#1b1e24}
.capacity-cell.drop-active{outline:2px solid var(--accent2);outline-offset:-3px;background:#232238}
.capacity-cell.overloaded{background:linear-gradient(180deg,#251c20,#1b1e24)}
.cell-head{display:flex;align-items:flex-start;gap:6px;min-height:30px}
.capacity-amount{font-size:11px;color:var(--soft);font-weight:600}
.capacity-detail{font-size:10px;color:var(--muted)}
.util{margin-left:auto;font-size:10px;border-radius:999px;padding:2px 5px;background:#202936;color:#9ac8ff}
.util.over{background:#3a2024;color:#ffb6b6}
.cell-meter{height:3px;background:#303640;border-radius:99px;overflow:hidden}
.cell-meter span{display:block;height:100%;background:var(--blue);max-width:100%}
.cell-meter span.over{background:var(--red)}
.cell-tasks{display:grid;gap:5px;align-content:start}
.cell-tasks .task-card{padding:7px;background:#222630;cursor:grab}
.cell-tasks .task-actions{display:none}
.cell-empty{font-size:10px;color:#6f7885;padding:8px 4px;border:1px dashed #30353e;border-radius:7px;text-align:center}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);padding:0;box-shadow:var(--shadow);width:min(620px,calc(100vw - 28px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(5,7,10,.7);backdrop-filter:blur(4px)}
.dialog-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.dialog-head h2{font-size:15px;margin:0}
.dialog-head button{margin-left:auto}
.dialog-body{padding:16px;display:grid;gap:13px;overflow:auto}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.form-grid .wide{grid-column:1/-1}
.dialog-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.callout{border:1px solid #4d4730;background:#272417;border-radius:9px;padding:9px 10px;color:#e7d599;font-size:12px}
.formula{font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
#notice{position:fixed;right:16px;bottom:16px;z-index:100;background:#252a32;border:1px solid #49515e;border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);max-width:360px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.15s}
#notice.show{opacity:1;transform:none}
.section-note{font-size:11px;color:var(--muted)}
@media(max-width:1100px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .workspace{grid-template-columns:240px minmax(0,1fr)}
}
@media(max-width:760px){
  .appbar{padding:0 10px}.plan-title{display:none}.appbar-actions .desktop-only{display:none}
  .main{padding:10px}
  .toolbar{grid-template-columns:1fr}.toolbar>div:last-child{display:flex;gap:6px;flex-wrap:wrap}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .workspace{grid-template-columns:1fr}
  .sidebar{position:static;max-height:270px}
  .timeline-scroll{max-height:560px}
  .form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

/* Capacity Planner product-polish extensions */
.positive{color:var(--green)}
.negative,.bad-text{color:var(--red)}
.warn-text{color:var(--amber)}
.planning-checks{display:grid;grid-template-columns:160px repeat(4,minmax(180px,1fr));gap:8px;align-items:stretch}
.checks-title{border:1px solid var(--line);border-radius:var(--radius);background:#15181d;padding:10px 12px;display:flex;flex-direction:column;justify-content:center;gap:3px}
.checks-title strong{font-size:12px}.checks-title span{font-size:10px;color:var(--muted)}
.check-card{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:9px 11px;display:grid;gap:2px;min-width:0}
.check-card.good{border-left:3px solid var(--green)}.check-card.warn{border-left:3px solid var(--amber)}.check-card.bad{border-left:3px solid var(--red)}
.check-label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.check-card strong{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.check-card span{font-size:10px;color:var(--muted);line-height:1.3}
.sidebar-search{display:grid;gap:5px;padding:9px 10px 0}.sidebar-search label{font-size:10px;color:var(--muted)}.sidebar-search input{width:100%;padding:7px 9px}
.iteration-summary-row{position:sticky;top:68px;z-index:18;background:#181b21;border-bottom:1px solid var(--line);box-shadow:0 8px 16px rgba(0,0,0,.14)}
.iteration-summary-label{position:sticky;left:0;z-index:22;background:#181b21;border-right:1px solid var(--line);padding:9px 12px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.iteration-summary-label strong{font-size:11px}.iteration-summary-label span{font-size:10px;color:var(--muted)}
.iteration-total{padding:8px 9px;border-right:1px solid var(--line);display:grid;gap:1px;background:#181b21;min-height:82px}
.iteration-total.has-issue{background:#211f1d}.iteration-total strong{font-size:11px}.iteration-total span{font-size:10px;color:var(--muted)}.iteration-total em{font-size:9px;color:var(--amber);font-style:normal;margin-top:2px}
.role-actions{margin-left:auto;display:flex;gap:5px}.role-actions button{font-size:10px;padding:4px 6px;margin-left:0}.role-name-line>strong{min-width:0}
.cell-badges{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:0 0 auto}.fte-badge{font-size:9px;border-radius:999px;padding:2px 5px;background:#3b311d;color:#ffd98d;border:1px solid #69572f}
.capacity-cell.envelope-over{box-shadow:inset 0 2px 0 var(--amber)}
.cell-tasks .compact-actions{display:flex;margin-top:1px;gap:4px}.cell-tasks .compact-actions button{font-size:9px;padding:3px 5px;min-width:0}
.cell-tasks .task-card{gap:5px}.cell-tasks .task-card:focus-within{border-color:#666078}
.metric-preview{border:1px solid var(--line);background:#15181d;border-radius:9px;padding:9px 10px;display:grid;gap:2px;align-content:center}.metric-preview span{font-size:10px;color:var(--muted)}.metric-preview strong{font-size:12px}.metric-preview small{font-size:10px}
.callout.subtle{border-color:#3a4652;background:#19212a;color:#bfd0df}
.danger-zone{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:12px;margin-top:2px}.danger-zone>div{display:grid;gap:2px;flex:1}.danger-zone strong{font-size:11px}.danger-zone span{font-size:10px;color:var(--muted)}
.assignment-preview{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;border:1px solid var(--line);border-radius:10px;padding:9px;background:#15181d}.assignment-preview.good{border-left:3px solid var(--green)}.assignment-preview.bad{border-left:3px solid var(--red)}.assignment-preview>div{display:grid;gap:2px}.assignment-preview span{font-size:9px;color:var(--muted)}.assignment-preview strong{font-size:12px}.assignment-preview p{grid-column:1/-1;margin:3px 0 0;color:#ffb6b6;font-size:10px}
.board-empty{margin:20px;min-width:420px}
@media(max-width:1250px){.planning-checks{grid-template-columns:140px repeat(2,1fr)}.checks-title{grid-row:span 2}.timeline-scroll{max-height:calc(100vh - 440px)}}
@media(max-width:760px){.planning-checks{grid-template-columns:1fr 1fr}.checks-title{grid-column:1/-1;grid-row:auto}.iteration-summary-row{top:68px}.assignment-preview{grid-template-columns:1fr}.assignment-preview p{grid-column:auto}.danger-zone{align-items:flex-start;flex-direction:column}.timeline-scroll{max-height:520px}}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<div class="shell">
  <header class="appbar">
    <div class="brand"><div class="logo" aria-hidden="true">C</div><h1>Capacity Planner</h1></div>
    <div class="plan-title" id="app-plan-title">Resource plan</div>
    <div class="appbar-actions">
      <button class="ghost desktop-only" id="export-btn" type="button">Export</button>
      <button class="ghost desktop-only" id="import-btn" type="button">Import</button>
      <button class="primary" id="new-plan-btn" type="button">New resource plan</button>
    </div>
  </header>
  <main class="main" id="main">
    <section class="toolbar" aria-labelledby="plan-heading">
      <div>
        <div class="plan-meta">
          <strong id="plan-heading">Resource plan</strong>
          <span class="pill" id="date-pill"></span>
          <span class="pill" id="iteration-pill"></span>
          <span class="pill" id="unit-pill"></span>
          <span class="pill" id="storage-pill">Local prototype</span>
        </div>
        <div class="section-note" style="margin-top:6px">Plan available versus planned FTE, PT/hours, cost and task load across iterations.</div>
      </div>
      <div>
        <button id="edit-plan-btn" type="button">Plan settings</button>
        <button id="add-role-btn" type="button">Add role</button>
        <button id="add-task-btn" type="button">Add task</button>
      </div>
    </section>
    <section class="kpis" id="kpis" aria-label="Plan summary"></section>
    <section class="planning-checks" id="checks" aria-label="Planning checks"></section>
    <section class="workspace">
      <aside class="sidebar" aria-labelledby="backlog-heading">
        <div class="sidebar-head">
          <h2 id="backlog-heading">Unassigned tasks</h2>
          <span class="pill" id="backlog-count">0</span>
          <button type="button" id="sidebar-add-task" aria-label="Add task">+</button>
        </div>
        <div class="sidebar-search"><label for="task-search">Find unassigned task</label><input id="task-search" type="search" placeholder="Filter by title" autocomplete="off"></div>
        <div class="task-list" id="backlog"></div>
      </aside>
      <section class="board-card" aria-labelledby="board-heading">
        <div class="board-toolbar">
          <h2 id="board-heading">Role capacity by iteration</h2>
          <span class="section-note">Lane height reflects total planned role capacity</span>
          <div class="legend" aria-label="Capacity legend">
            <span><i class="dot open"></i>capacity</span><span><i class="dot"></i>within</span><span><i class="dot over"></i>over</span>
          </div>
        </div>
        <div class="timeline-scroll" id="timeline-scroll">
          <div class="timeline" id="timeline"></div>
        </div>
      </section>
    </section>
  </main>
</div>
<dialog id="dialog" aria-labelledby="dialog-title"></dialog>
<input id="workspace-import" type="file" accept="application/json,.json" hidden aria-label="Import capacity planner workspace">
<div id="notice" role="status" aria-live="polite" aria-atomic="true"></div>
<noscript>This offline prototype needs JavaScript enabled to demonstrate its interactions.</noscript>
<script>(() => {
"use strict";
const modules = Object.create(null);
modules["core"] = (() => {
const VERSION = 1;
const STORAGE_KEY = "capacity-planner.prototype.v1";
function $(selector, root = document) {
  const element = root.querySelector(selector);
  if (!element) throw new Error(`Missing prototype element: ${selector}`);
  return element;
}
const dialog = $("#dialog");
const notice = $("#notice");
const importInput = $("#workspace-import");
let noticeTimer = 0;
let storageStatus = "demo";

const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
})[char]);
const euro = new Intl.NumberFormat("de-DE", { style:"currency", currency:"EUR", maximumFractionDigits:0 });
const num = new Intl.NumberFormat("de-DE", { maximumFractionDigits:1 });

function parseDate(value) {
  const [y,m,d] = String(value).split("-").map(Number);
  if (!y || !m || !d) return null;
  const date = new Date(Date.UTC(y,m-1,d));
  return Number.isFinite(date.getTime()) ? date : null;
}
function dateText(value) {
  const date = parseDate(value);
  return date ? new Intl.DateTimeFormat("en-GB",{day:"2-digit",month:"short",year:"numeric",timeZone:"UTC"}).format(date) : "—";
}
function iso(date) { return date.toISOString().slice(0,10); }
function addDays(date, days) {
  const next = new Date(date);
  next.setUTCDate(next.getUTCDate() + days);
  return next;
}
function inclusiveDays(start, end) { return Math.round((end - start) / 86400000) + 1; }
function uid(prefix) { return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`; }
function clone(value) { return JSON.parse(JSON.stringify(value)); }

function makeIterations(plan) {
  const start = parseDate(plan.start);
  const due = parseDate(plan.due);
  if (!start || !due || due < start) return [];
  const chunk = Math.max(1, Number(plan.iterationWeeks) || 2) * 7;
  const result = [];
  let cursor = start;
  let index = 1;
  while (cursor <= due && result.length < 80) {
    const rawEnd = addDays(cursor, chunk - 1);
    const end = rawEnd > due ? due : rawEnd;
    result.push({id:`it-${iso(cursor)}`,index,name:`Iteration ${index}`,start:iso(cursor),end:iso(end),weeks:inclusiveDays(cursor,end)/7});
    cursor = addDays(end,1);
    index += 1;
  }
  return result;
}

function nextPlanDates() {
  const now = new Date();
  const today = new Date(Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()));
  const toMonday = (8 - today.getUTCDay()) % 7;
  const start = addDays(today,toMonday);
  return {start:iso(start),due:iso(addDays(start,16*7-1))};
}

function baseState() {
  const plan = {id:"plan-demo",name:"Custom Order Platform",budget:280000,start:"2026-10-05",due:"2027-01-22",iterationWeeks:2,daysPerWeek:5,hoursPerDay:8,unitName:"SP",hoursPerUnit:6};
  const its = makeIterations(plan);
  const all = (value) => Object.fromEntries(its.map(it=>[it.id,value]));
  const range = (values) => Object.fromEntries(its.map((it,i)=>[it.id,values[i] ?? 0]));
  return {
    schema:"capacity-planner.workspace",version:VERSION,plan,
    roles:[
      {id:"role-dm",name:"Delivery Manager",dayRate:950,availableFte:.5,fteByIteration:all(.4)},
      {id:"role-ba",name:"Business Analyst",dayRate:850,availableFte:1,fteByIteration:range([.8,.8,.8,.4,.4,0,0,0])},
      {id:"role-ux",name:"UX / UI",dayRate:800,availableFte:1,fteByIteration:range([.7,.7,.7,.7,.3,.3,0,0])},
      {id:"role-dev",name:"Software Engineering",dayRate:900,availableFte:2,fteByIteration:all(2)},

    ${isNew?`<div class="callout">Creating a new plan replaces the current in-browser workspace. Export first if you need the current state.</div>`:`<div class="callout subtle">Changing the start date or iteration cadence can invalidate existing task placements. Affected tasks are returned to the backlog instead of being silently remapped.</div>`}
    <div class="formula">PT = FTE/week × iteration weeks × working days/week. Hours = PT × hours/day. Cost = PT × role day rate. A partial final iteration is prorated by its calendar-day fraction; holidays and personal leave are not modeled.</div>`,data=>{
      const candidate={...p,id:isNew?uid("plan"):p.id,name:String(data.get("name")||"").trim(),budget:Number(data.get("budget")),iterationWeeks:Number(data.get("iterationWeeks")),start:String(data.get("start")),due:String(data.get("due")),daysPerWeek:Number(data.get("daysPerWeek")),hoursPerDay:Number(data.get("hoursPerDay")),unitName:String(data.get("unitName")||"").trim(),hoursPerUnit:Number(data.get("hoursPerUnit"))};
      const probe={schema:"capacity-planner.workspace",version:VERSION,plan:candidate,roles:isNew?[]:stateRef.state.roles,tasks:isNew?[]:stateRef.state.tasks},error=validate(probe);
      if(error){announce(error);return false;}
      if(isNew&&(stateRef.state.roles.length||stateRef.state.tasks.length)&&!window.confirm("Create a new resource plan and replace the current workspace?"))return false;
      if(isNew)stateRef.state={schema:"capacity-planner.workspace",version:VERSION,plan:candidate,roles:[],tasks:[]};else stateRef.state.plan=candidate;
      reconcile(true);save();render();announce(isNew?"New resource plan created.":"Plan settings updated.");return true;
    },isNew?"Create plan":"Apply");
}

function roleDialog() {
  openDialog("Add role",`<div class="form-grid"><label class="wide">Role name<input name="name" required maxlength="60" placeholder="e.g. Software Engineer"></label><label>Day rate (€ / PT)<input name="dayRate" type="number" min="0" step="10" required value="850"></label><label>FTE envelope / week<input name="availableFte" type="number" min="0" max="20" step=".1" required value="1"></label><label>Initial planned FTE / week<input name="fte" type="number" min="0" max="20" step=".1" required value="1"></label></div><div class="formula">The FTE envelope is the role capacity available to this plan. Planned FTE is what the plan consumes. Planning above the envelope is allowed but visibly flagged.</div>`,data=>{
    const name=String(data.get("name")||"").trim(),dayRate=Number(data.get("dayRate")),availableFte=Number(data.get("availableFte")),fte=Number(data.get("fte"));
    if(!name||!Number.isFinite(dayRate)||dayRate<0||!Number.isFinite(availableFte)||availableFte<0||availableFte>20||!Number.isFinite(fte)||fte<0||fte>20){announce("Enter a valid role, day rate and FTE values.");return false;}
    stateRef.state.roles.push({id:uid("role"),name,dayRate,availableFte,fteByIteration:Object.fromEntries(iterations().map(it=>[it.id,fte]))});save();render();announce(`${name} added${fte>availableFte?" with an FTE envelope warning":""}.`);return true;
  },"Add role");
}

function roleSettingsDialog(roleId) {
  const role=stateRef.state.roles.find(r=>r.id===roleId);if(!role)return;
  openDialog(`Role settings · ${role.name}`,`<div class="form-grid"><label class="wide">Role name<input name="name" required maxlength="60" value="${esc(role.name)}"></label><label>Day rate (€ / PT)<input name="dayRate" type="number" min="0" step="10" required value="${esc(role.dayRate)}"></label><label>FTE envelope / week<input name="availableFte" type="number" min="0" max="20" step=".1" required value="${esc(role.availableFte)}"></label></div><div class="formula">Changing the FTE envelope does not rewrite the plan. Existing allocations above the new envelope remain visible as warnings.</div><div class="danger-zone"><div><strong>Remove role</strong><span>Assigned tasks return to the backlog; tasks are not deleted.</span></div><button type="button" class="danger" data-action="delete-role" data-role-id="${esc(role.id)}">Remove role</button></div>`,data=>{
    const name=String(data.get("name")||"").trim(),dayRate=Number(data.get("dayRate")),availableFte=Number(data.get("availableFte"));
    if(!name||!Number.isFinite(dayRate)||dayRate<0||!Number.isFinite(availableFte)||availableFte<0||availableFte>20){announce("Enter valid role settings.");return false;}
    role.name=name;role.dayRate=dayRate;role.availableFte=availableFte;save();render();announce(`${name} updated.`);return true;
  },"Save role");
}

function deleteRole(roleId) {
  const role=stateRef.state.roles.find(r=>r.id===roleId);if(!role)return;
  const affected=stateRef.state.tasks.filter(t=>t.roleId===roleId).length;
  if(!window.confirm(`Remove role "${role.name}"? ${affected?`${affected} assigned task${affected===1?"":"s"} will return to the backlog.`:"No tasks are assigned to it."}`))return;
  for(const task of stateRef.state.tasks)if(task.roleId===roleId){task.roleId=null;task.iterationId=null;}
  stateRef.state.roles=stateRef.state.roles.filter(r=>r.id!==roleId);if(dialog.open)dialog.close();save();render();announce(`${role.name} removed${affected?`; ${affected} task${affected===1?"":"s"} returned to backlog`:""}.`);
}

function allocateDialog(roleId) {
  const role=stateRef.state.roles.find(r=>r.id===roleId),its=iterations();if(!role||!its.length)return;
  const options=its.map(it=>`<option value="${esc(it.id)}">${esc(it.name)} · ${dateText(it.start)}</option>`).join("");
  openDialog(`Plan FTE · ${role.name}`,`<div class="form-grid"><label>From iteration<select name="from">${options}</select></label><label>Through iteration<select name="through">${options}</select></label><label>Planned FTE / week<input name="fte" type="number" min="0" max="20" step=".1" required value="${esc(role.fteByIteration[its[0].id]??Math.min(1,role.availableFte))}"></label><div class="metric-preview"><span>FTE envelope</span><strong>${num.format(role.availableFte)} FTE / week</strong><small>${euro.format(role.dayRate)} / PT</small></div></div><div class="formula">The same planned FTE is applied to every selected iteration. Set 0 to clear planned capacity while retaining the role. Values above ${num.format(role.availableFte)} FTE are allowed and flagged.</div>`,data=>{
    const from=its.findIndex(it=>it.id===data.get("from")),through=its.findIndex(it=>it.id===data.get("through")),fte=Number(data.get("fte"));if(from<0||through<from||!Number.isFinite(fte)||fte<0||fte>20){announce("Choose a valid iteration range and FTE.");return false;}
    for(let i=from;i<=through;i++)role.fteByIteration[its[i].id]=fte;save();render();announce(`${role.name}: ${num.format(fte)} FTE applied to iterations ${from+1}–${through+1}${fte>role.availableFte?"; staffing envelope exceeded":""}.`);return true;
  },"Apply range");
  const from=$("[name=\"from\"]",dialog),through=$("[name=\"through\"]",dialog);through.selectedIndex=its.length-1;from.addEventListener("change",()=>{if(through.selectedIndex<from.selectedIndex)through.selectedIndex=from.selectedIndex;});
}

function taskDialog(taskId=null) {
  const task=taskId?stateRef.state.tasks.find(t=>t.id===taskId):null;
  openDialog(task?`Edit task · ${task.title}`:"Add task",`<div class="form-grid"><label class="wide">Task title<input name="title" required maxlength="100" placeholder="Outcome or deliverable" value="${task?esc(task.title):""}"></label><label>Estimate (${esc(stateRef.state.plan.unitName)})<input name="units" type="number" min="0" step=".25" required value="${task?esc(task.units):"5"}"></label>${task&&task.roleId?`<div class="metric-preview"><span>Current placement</span><strong>${esc(stateRef.state.roles.find(r=>r.id===task.roleId)?.name||"Role")}</strong><small>${esc(iterations().find(it=>it.id===task.iterationId)?.name||"Iteration")}</small></div>`:""}</div><div class="formula">At the current conversion, the estimate equals ${num.format((task?task.units:5)*stateRef.state.plan.hoursPerUnit)} h. Changing the estimate immediately updates capacity warnings.</div>${task?`<div class="danger-zone"><div><strong>Delete task</strong><span>Deletion removes the task from this prototype workspace.</span></div><button type="button" class="danger" data-action="delete-task" data-task-id="${esc(task.id)}">Delete task</button></div>`:""}`,data=>{
    const title=String(data.get("title")||"").trim(),units=Number(data.get("units"));if(!title||!Number.isFinite(units)||units<0){announce("Enter a valid title and estimate.");return false;}
    if(task){task.title=title;task.units=units;}else stateRef.state.tasks.push({id:uid("task"),title,units,roleId:null,iterationId:null});save();render();announce(task?`${title} updated.`:`${title} added to backlog.`);return true;
  },task?"Save task":"Add task");
}

function assignmentDialog(taskId) {
  const task=stateRef.state.tasks.find(t=>t.id===taskId),its=iterations();if(!task||!stateRef.state.roles.length||!its.length){announce("Add at least one role and iteration first.");return;}
  const roleOptions=stateRef.state.roles.map(role=>`<option value="${esc(role.id)}" ${task.roleId===role.id?"selected":""}>${esc(role.name)}</option>`).join(""),iterOptions=its.map(it=>`<option value="${esc(it.id)}" ${task.iterationId===it.id?"selected":""}>${esc(it.name)} · ${dateText(it.start)}</option>`).join("");
  openDialog(`Assign task · ${task.title}`,`<div class="form-grid"><label>Role<select name="roleId">${roleOptions}</select></label><label>Iteration<select name="iterationId">${iterOptions}</select></label></div><div id="assignment-preview" class="assignment-preview"></div><div class="formula">${num.format(task.units)} ${esc(stateRef.state.plan.unitName)} = ${num.format(taskHours(task))} h. Overload is allowed for scenario exploration but remains visibly flagged.</div>`,data=>{assignTask(task.id,String(data.get("roleId")),String(data.get("iterationId")));return true;},"Assign");
  const roleSelect=$("[name=\"roleId\"]",dialog),iterationSelect=$("[name=\"iterationId\"]",dialog),preview=$("#assignment-preview",dialog);
  const updatePreview=()=>{const role=stateRef.state.roles.find(r=>r.id===roleSelect.value),it=its.find(i=>i.id===iterationSelect.value);if(!role||!it)return;const c=capacityFor(role,it),existing=tasksFor(role.id,it.id).filter(t=>t.id!==task.id).reduce((sum,t)=>sum+taskHours(t),0),projected=existing+taskHours(task),util=c.hours>0?projected/c.hours:(projected>0?Infinity:0),over=projected>c.hours+.001;preview.className=`assignment-preview ${over?"bad":"good"}`;preview.innerHTML=`<div><span>Projected task load</span><strong>${num.format(projected)} / ${num.format(c.hours)} h</strong></div><div><span>Utilization</span><strong>${Number.isFinite(util)?num.format(util*100):"∞"}%</strong></div><div><span>Planned FTE</span><strong>${num.format(c.fte)} / ${num.format(role.availableFte)}</strong></div>${over?`<p>Assignment exceeds planned capacity by ${num.format(projected-c.hours)} h.</p>`:""}`;};
  roleSelect.addEventListener("change",updatePreview);iterationSelect.addEventListener("change",updatePreview);updatePreview();
}

function deleteTask(taskId) {
  const task=stateRef.state.tasks.find(t=>t.id===taskId);if(!task)return;if(!window.confirm(`Delete task "${task.title}" from this prototype workspace?`))return;
  stateRef.state.tasks=stateRef.state.tasks.filter(t=>t.id!==taskId);if(dialog.open)dialog.close();save();render();announce("Task deleted.");
}
function exportWorkspace() {
  const blob=new Blob([JSON.stringify(stateRef.state,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),anchor=document.createElement("a");anchor.href=url;anchor.download=`${stateRef.state.plan.name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"capacity-plan"}.json`;document.body.appendChild(anchor);anchor.click();anchor.remove();URL.revokeObjectURL(url);announce("Workspace exported.");
}
async function importWorkspace(file) {
  try{const text=await file.text(),candidate=JSON.parse(text),error=validate(candidate);if(error){announce(error);return;}if(!window.confirm(`Replace the current workspace with "${candidate.plan.name}"?`))return;stateRef.state=clone(candidate);reconcile(true);save();render();announce("Workspace imported.");}catch{announce("Import failed. Choose a valid JSON workspace.");}finally{importInput.value="";}
}

return {planDialog,roleDialog,roleSettingsDialog,deleteRole,allocateDialog,taskDialog,assignmentDialog,deleteTask,exportWorkspace,importWorkspace};
})();
modules["app"] = (() => {
const {$,dialog,importInput,stateRef} = modules["core"];
const {render,renderBacklog,unassignTask,wireTaskCards} = modules["render"];
const {allocateDialog,assignmentDialog,deleteRole,deleteTask,exportWorkspace,importWorkspace,planDialog,roleDialog,roleSettingsDialog,taskDialog} = modules["dialogs"];

document.addEventListener("click",event=>{
  const target=event.target?.closest?.("button");
  if(!target)return;
  const action=target.dataset.action;
  if(action==="allocate-role")allocateDialog(target.dataset.roleId);
  if(action==="role-settings")roleSettingsDialog(target.dataset.roleId);
  if(action==="delete-role")deleteRole(target.dataset.roleId);
  if(action==="assign-task")assignmentDialog(target.dataset.taskId);
  if(action==="edit-task")taskDialog(target.dataset.taskId);
  if(action==="unassign-task")unassignTask(target.dataset.taskId);
  if(action==="delete-task")deleteTask(target.dataset.taskId);
});
document.addEventListener("keydown",event=>{
  if(event.key==="Escape"&&dialog.open){dialog.close();return;}
  const card=event.target?.closest?.(".task-card");
  if(card&&(event.key==="Enter"||event.key===" ")&&!event.target.closest?.("button")){event.preventDefault();assignmentDialog(card.dataset.taskId);}
});
$("#new-plan-btn").addEventListener("click",()=>planDialog(true));
$("#edit-plan-btn").addEventListener("click",()=>planDialog(false));
$("#add-role-btn").addEventListener("click",roleDialog);
$("#add-task-btn").addEventListener("click",()=>taskDialog());
$("#sidebar-add-task").addEventListener("click",()=>taskDialog());
$("#task-search").addEventListener("input",event=>{stateRef.taskFilter=event.target.value;renderBacklog();wireTaskCards($("#backlog"));});
$("#export-btn").addEventListener("click",exportWorkspace);
$("#import-btn").addEventListener("click",()=>importInput.click());
importInput.addEventListener("change",()=>{if(importInput.files?.[0])importWorkspace(importInput.files[0]);});
dialog.addEventListener("click",event=>{if(event.target===dialog)dialog.close();});
render();

return {};
})();
})();</script>
</body>
