<meta name="description" content="Offline capacity-planner concept for resource, FTE, iteration, task, budget, project-day and hour planning.">
<title>Capacity Planner · Companion concept</title>
<style>body{font-family:system-ui,sans-serif}</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<div class="shell">
  <header class="appbar">
    <div class="brand"><div class="logo" aria-hidden="true">C</div><h1>Capacity Planner</h1></div>
    <div class="plan-title" id="app-plan-title">Resource plan</div>
    <div class="appbar-actions">
      <button class="ghost desktop-only" id="export-btn" type="button">Export</button>
      <button class="ghost desktop-only" id="import-btn" type="button">Import</button>
      <button class="primary" id="new-plan-btn" type="button">New resource plan</button>
    </div>
  </header>
  <main class="main" id="main">
    <section class="toolbar" aria-labelledby="plan-heading">
      <div>
        <div class="plan-meta">
          <strong id="plan-heading">Resource plan</strong>
          <span class="pill" id="date-pill"></span>
          <span class="pill" id="iteration-pill"></span>
          <span class="pill" id="unit-pill"></span>
          <span class="pill" id="storage-pill">Local prototype</span>
        </div>
        <div class="section-note" style="margin-top:6px">Plan available versus planned FTE, PT/hours, cost and task load across iterations.</div>
      </div>
      <div>
        <button id="edit-plan-btn" type="button">Plan settings</button>
        <button id="add-role-btn" type="button">Add role</button>
        <button id="add-task-btn" type="button">Add task</button>
      </div>
    </section>
    <section class="kpis" id="kpis" aria-label="Plan summary"></section>
    <section class="planning-checks" id="checks" aria-label="Planning checks"></section>
    <section class="workspace">
      <aside class="sidebar" aria-labelledby="backlog-heading">
        <div class="sidebar-head">
          <h2 id="backlog-heading">Unassigned tasks</h2>
          <span class="pill" id="backlog-count">0</span>
          <button type="button" id="sidebar-add-task" aria-label="Add task">+</button>
        </div>
        <div class="sidebar-search"><label for="task-search">Find unassigned task</label><input id="task-search" type="search" placeholder="Filter by title" autocomplete="off"></div>
        <div class="task-list" id="backlog"></div>
      </aside>
      <section class="board-card" aria-labelledby="board-heading">
        <div class="board-toolbar">
          <h2 id="board-heading">Role capacity by iteration</h2>
          <span class="section-note">Lane height reflects total planned role capacity</span>
          <div class="legend" aria-label="Capacity legend">
            <span><i class="dot open"></i>capacity</span><span><i class="dot"></i>within</span><span><i class="dot over"></i>over</span>
          </div>
        </div>
        <div class="timeline-scroll" id="timeline-scroll">
          <div class="timeline" id="timeline"></div>
        </div>
      </section>
    </section>
  </main>
</div>
<dialog id="dialog" aria-labelledby="dialog-title"></dialog>
<input id="workspace-import" type="file" accept="application/json,.json" hidden aria-label="Import capacity planner workspace">
