<template v-if="ui.modal==='logic-delete'"><p class="modal-description"><strong>{{logic.deleteTitle}}</strong><br>{{logic.deleteDetail}}</p><div class="modal-footer"><button class="button" @click="closeModal">Cancel</button><button class="button primary" @click="logicConfirmDelete">Confirm removal</button></div></template>
<template v-if="ui.modal==='logic-checkpoint'"><p class="modal-description">Snapshot all business rules, processes, flow wiring, and their events. Prompt recipe versions are managed separately. No runtime context or trace is captured.</p><label class="field"><span>What changed, and why?</span><input data-autofocus v-model="logic.checkpointName" maxlength="160" aria-label="Logic checkpoint name" placeholder="e.g. Raise the confidence threshold before task preparation"></label><p class="footnote">Up to 20 checkpoints. JSON backups preserve the complete workspace.</p><div class="modal-footer"><button class="button" @click="closeModal">Cancel</button><button class="button primary" @click="logicCheckpointSave">Save logic checkpoint</button></div></template>
<template v-if="ui.modal==='logic-restore'"><p class="modal-description">Restore this logic snapshot. First, the current rules, processes, and flows are checkpointed automatically. Current prompt recipes and their versions are not replaced. Validation will expose any changed prompt references.</p><div class="modal-footer"><button class="button" @click="closeModal">Keep editing</button><button class="button primary" @click="logicRestore">Checkpoint and restore logic</button></div></template>
<template v-if="ui.modal==='logic-import'"><p class="modal-description">Import a complete version-2 Jev Studio workspace. Definitions and prompts receive new identities; references are remapped. Existing work stays intact. Imported logic is never run automatically.</p><label class="button small-button" for="logic-json-file"><svg class="icon small"><use href="#i-upload"/></svg>Choose workspace JSON</label><input id="logic-json-file" class="sr-only" type="file" accept=".json,application/json" @change="logicImportFile"><label class="field import-field"><span>Or paste JSON</span><textarea v-model="logic.importText" rows="9" aria-label="Workspace import JSON" spellcheck="false"></textarea></label><div v-if="logic.candidate" class="import-summary"><strong>{{logic.candidate.prompts.length}} prompts · {{logic.candidate.logic.rules.length}} rules · {{logic.candidate.logic.processes.length}} processes · {{logic.candidate.logic.flows.length}} flows</strong><small>All imported as linked copies. Authored sample input and literals may contain private information.</small></div><div class="modal-footer"><button class="button" @click="logicPreviewImport">Validate workspace</button><button class="button primary" @click="logicImport" :disabled="!logic.candidate">Import linked copies</button></div></template>
<template v-if="ui.modal==='logic-export'"><p class="modal-description">{{logic.exportMode==='trace'?'This trace contains actual resolved inputs, process outputs, event payloads, and prepared requests. It can contain selected vault content.':'Export every prompt, business rule, process, flow, event contract, and checkpoint in one portable workspace.'}}</p><div class="capability-table" v-if="logic.exportMode==='workspace'"><div><strong>Included</strong><span>{{logicPrompts.length}} prompts, {{logic.doc.rules.length}} rules, {{logic.doc.processes.length}} processes, {{logic.doc.flows.length}} flows, declared events, prompt versions, and logic checkpoints.</span></div><div><strong>Excluded</strong><span>Live vault snapshots, runtime traces, imported responses, API keys, execution approvals, and browser UI state.</span></div></div><div v-else class="banner warn"><strong>Trace export can contain private vault data.</strong><p>Nothing is sent to Jev, but anyone with the downloaded JSON can read the included content. Inspect step inputs and prepared requests first.</p></div><label v-if="logic.exportMode==='trace'" class="consent"><input type="checkbox" v-model="ui.consent">I reviewed the trace and understand it may contain selected note content, paths, and event payloads.</label><p class="footnote" v-else>Authored sample inputs and literal values are part of the definitions. Review them before sharing this workspace.</p><div class="modal-footer"><button class="button" @click="closeModal">Cancel</button><button class="button primary" @click="logicExport" :disabled="logicShape.length>0||(logic.exportMode==='trace'&&(!ui.consent||logicStale))">{{logic.exportMode==='trace'?'Download simulation trace':'Download workspace JSON'}}</button></div></template>
