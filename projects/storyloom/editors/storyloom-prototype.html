  const DERIVED_KEYS = ['storyloom_map_link', 'storyloom_activity_link', 'storyloom_step_link', 'storyloom_release_link', 'storyloom_persona_links', 'storyloom_dependency_links'];

  function uid(prefix = 'id') {
    if (typeof prefix !== 'string' || !/^[A-Za-z][A-Za-z0-9_-]{0,30}$/.test(prefix)) fail('ID prefix must contain letters, numbers, hyphens, or underscores.');
    const random = new Uint8Array(9);
    if (typeof globalThis !== 'undefined' && globalThis.crypto && globalThis.crypto.getRandomValues) globalThis.crypto.getRandomValues(random);
    else for (let i = 0; i < random.length; i++) random[i] = Math.floor(Math.random() * 256);
    return prefix + '-' + Array.from(random, byte => byte.toString(16).padStart(2, '0')).join('');
  }

  function sanitizeFolder(value) {
    if (typeof value !== 'string') fail('A folder path must be a string.');
    let path = value.trim();
    if (!path || path.length > 240) fail('Folder paths must contain 1–240 characters.');
    // Decode escaped traversal before checking it. Literal percent characters stay intact.
    for (let i = 0; i < 4; i++) {
      let decoded;
      try { decoded = decodeURIComponent(path); } catch (_) { break; }
      if (decoded === path) break;
      path = decoded;
    }
    if (/^(?:[\\/]|[A-Za-z]:|~(?:[\\/]|$))/.test(path)) fail('Use a relative vault folder, not an absolute, drive, or network path.');
    if (/[\u0000-\u001f\u007f<>:"|?*]/.test(path)) fail('Folder paths contain an unsupported or unsafe character.');
    path = path.replace(/\\/g, '/');
    const segments = path.split('/').filter(segment => segment !== '' && segment !== '.');
    if (!segments.length || segments.some(segment => segment.trim() === '..')) fail('Folder paths cannot traverse outside the configured vault.');
    if (segments.some(segment => /[. ]$/.test(segment) || segment !== segment.trim())) fail('Folder names cannot begin or end with whitespace or end with a dot.');
    if (segments.some(segment => /^(?:CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])(?:\.|$)/i.test(segment))) fail('Folder paths cannot use reserved device names.');
    if (segments.some(segment => /%[\da-f]{2}/i.test(segment))) fail('Deeply encoded or ambiguous folder paths are unsupported.');
    const normalized = segments.join('/');
    if (normalized.length > 240) fail('Folder paths must contain at most 240 characters.');
    return normalized;
  }

  function blankWorkspace() {
    return {
      schemaVersion: VERSION,
      settings: {
        vaultName: 'Product Lab',
        folders: {
          maps: 'Product/Storymaps/Maps', activities: 'Product/Storymaps/Activities',
          steps: 'Product/Storymaps/Steps', stories: 'Product/Storymaps/Stories',
          releases: 'Product/Storymaps/Releases', personas: 'Product/Storymaps/Personas'
        },
        theme: 'dark'
      },
      maps: [], activities: [], steps: [], stories: [], releases: [], personas: []
    };
  }

  function defaults(type) {
    switch (type) {
      case 'map': return { description: '', goal: '', personaIds: [], created: '', updated: '' };
      case 'activity': return { description: '', order: 0, color: '#8b7cf8' };
      case 'step': return { description: '', order: 0 };
      case 'story': return { description: '', releaseId: null, kind: 'story', status: 'idea', priority: 'should', points: null, personaIds: [], tags: [], acceptance: '', dependencies: [], order: 0, created: '', updated: '' };
      case 'release': return { goal: '', status: 'planned', targetDate: '', capacity: 0, order: 0, color: '#8b7cf8' };
      case 'persona': return { role: '', goal: '', pain: '', color: '#8b7cf8' };

    }
  }

  function normalizeState(source) {
    const state = clone(source);
    for (const collection of COLLECTIONS) {
      if (Array.isArray(state[collection])) state[collection] = state[collection].map(entity => object(entity) ? { ...defaults(TYPES[collection]), ...entity } : entity);
    }
    if ((!own(state, 'extraFrontmatter') || object(state.extraFrontmatter)) && !own(state.extraFrontmatter || {}, 'product_family_workspace_id')) {
      state.extraFrontmatter = { ...(state.extraFrontmatter || {}), product_family_workspace_id: state.maps?.[0]?.id ? 'storyloom-' + state.maps[0].id : uid('workspace') };
    }
    return state;
  }

  function validate(state) {
    const errors = [], warnings = [];
    const err = message => errors.push(message);
    if (!object(state)) return { errors: ['Workspace must be a JSON object.'], warnings };
    if (state.schemaVersion !== VERSION) err('Unsupported workspace schema version: ' + String(state.schemaVersion) + '. Expected 1.');
    if (own(state, 'extraFrontmatter') && !object(state.extraFrontmatter)) err('Workspace extraFrontmatter must be an object.');
    if (object(state.extraFrontmatter) && own(state.extraFrontmatter, 'product_family_workspace_id') && (typeof state.extraFrontmatter.product_family_workspace_id !== 'string' || !/^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$/.test(state.extraFrontmatter.product_family_workspace_id))) err('Product-family workspace ID must be a stable identifier of at most 128 characters.');
    if (own(state, 'workspaceBody') && typeof state.workspaceBody !== 'string') err('Workspace Markdown body must be a string.');
    const settings = state.settings;
    const textField = (value, label, required = false, max = MAX_TEXT) => {
      if (value === undefined && !required) return;
      if (typeof value !== 'string') err(label + ' must be a string.');
      else if ((required && !value.trim()) || value.length > max) err(label + ' must contain ' + (required ? '1' : '0') + '–' + max + ' characters.');
    };
    const numberField = (value, label, max = 1000000) => {
      if (typeof value !== 'number' || !Number.isFinite(value) || value < 0 || value > max) err(label + ' must be a finite number between 0 and ' + max + '.');
    };
    const enumField = (value, label, allowed) => { if (!allowed.includes(value)) err(label + ' must be one of: ' + allowed.join(', ') + '.'); };
    const stringArray = (value, label, maxLength = 1000) => {
      if (!Array.isArray(value)) { err(label + ' must be an array.'); return []; }
      if (value.length > maxLength) err(label + ' contains too many entries (maximum ' + maxLength + ').');
      if (value.some(entry => typeof entry !== 'string' || !entry.trim() || entry.length > 240)) err(label + ' must contain nonempty strings of at most 240 characters.');
      if (new Set(value).size !== value.length) err(label + ' contains duplicate entries.');
      return value;
    };
    if (!object(settings)) err('Workspace settings are missing.');
    else {
      textField(settings.vaultName, 'Vault name', true, 200);
      enumField(settings.theme, 'Theme', ['dark', 'light', 'system']);
      if (!object(settings.folders)) err('Configurable entity folders are missing.');
      else for (const collection of COLLECTIONS) {
        try { sanitizeFolder(settings.folders[collection]); } catch (error) { err(collection + ' folder: ' + error.message); }
      }
    }
    const lookup = new Map(), indexes = {};
    let count = 0;
    for (const collection of COLLECTIONS) {
      indexes[collection] = new Map();
      if (!Array.isArray(state[collection])) { err(collection + ' must be an array.'); continue; }
      count += state[collection].length;
      for (const entity of state[collection]) {
        if (!object(entity)) { err(collection + ' contains a value that is not an object.'); continue; }
        const label = TYPES[collection] + ' “' + (typeof entity.title === 'string' ? entity.title : String(entity.id)) + '”';
        if (typeof entity.id !== 'string' || !ID_RE.test(entity.id)) err(label + ' has an invalid stable ID; use 1–96 letters, numbers, hyphens, or underscores.');
        else if (lookup.has(entity.id)) err('Duplicate stable ID “' + entity.id + '” across the workspace.');
        else { lookup.set(entity.id, entity); indexes[collection].set(entity.id, entity); }
        textField(entity.title, label + ' title', true, 240);
        if (own(entity, 'description')) textField(entity.description, label + ' description');
        if (own(entity, 'markdownBody')) textField(entity.markdownBody, label + ' Markdown body');
        for (const field of ['goal', 'role', 'pain']) if (own(entity, field)) textField(entity[field], label + ' ' + field, false, 20000);
        for (const field of ['created', 'updated']) if (own(entity, field)) {
          textField(entity[field], label + ' ' + field, false, 80);
          if (typeof entity[field] === 'string' && entity[field] && !Number.isFinite(Date.parse(entity[field]))) err(label + ' ' + field + ' must be an ISO date or datetime.');
        }
        if (own(entity, 'color') && (typeof entity.color !== 'string' || !/^#[\da-f]{6}$/i.test(entity.color))) err(label + ' color must be a six-digit hexadecimal color.');
        if (collection !== 'maps' && collection !== 'personas') numberField(entity.order, label + ' order');
        if (own(entity, 'extraFrontmatter') && !object(entity.extraFrontmatter)) err(label + ' extraFrontmatter must be an object.');
        if (collection === 'maps') stringArray(entity.personaIds, label + ' personas', 100);
        if (collection === 'stories') {
          enumField(entity.kind === undefined ? 'story' : entity.kind, label + ' kind', KINDS);
          enumField(entity.status, label + ' status', STORY_STATUSES);
          enumField(entity.priority, label + ' priority', PRIORITIES);
          if (entity.points !== null) numberField(entity.points, label + ' points', 100000);
          stringArray(entity.personaIds, label + ' personas', 100);
          stringArray(entity.tags, label + ' tags', 100);
          stringArray(entity.dependencies, label + ' dependencies', 1000);
          textField(entity.acceptance, label + ' acceptance criteria', false, 100000);
          if (entity.releaseId !== null && typeof entity.releaseId !== 'string') err(label + ' releaseId must be a release ID or null for Unscheduled.');
        }
        if (collection === 'releases') {
          enumField(entity.status, label + ' status', RELEASE_STATUSES);
          numberField(entity.capacity, label + ' capacity', 1000000);
          textField(entity.targetDate, label + ' target date', false, 10);

    }
    if (count > MAX_ENTITIES) err('Workspace exceeds the ' + MAX_ENTITIES + '-entity limit.');
    const checkRef = (id, collection, label) => {
      if (typeof id !== 'string' || !indexes[collection].has(id)) { err(label + ' references a missing ' + TYPES[collection] + ': ' + String(id) + '.'); return null; }
      return indexes[collection].get(id);
    };
    for (const collection of ['activities', 'steps', 'stories', 'releases']) for (const entity of list(state[collection])) {
      if (!object(entity)) continue;
      checkRef(entity.mapId, 'maps', TYPES[collection] + ' ' + String(entity.id));
      if (collection === 'steps') {
        const activity = checkRef(entity.activityId, 'activities', 'Step ' + entity.id);
        if (activity && activity.mapId !== entity.mapId) err('Step ' + entity.id + ' and its activity belong to different maps.');
      }
      if (collection === 'stories') {
        const step = checkRef(entity.stepId, 'steps', 'Story ' + entity.id);
        if (step && step.mapId !== entity.mapId) err('Story ' + entity.id + ' and its step belong to different maps.');
        if (entity.releaseId !== null) {
          const release = checkRef(entity.releaseId, 'releases', 'Story ' + entity.id);
          if (release && release.mapId !== entity.mapId) err('Story ' + entity.id + ' and its release belong to different maps.');
        }
        for (const dependencyId of list(entity.dependencies)) {
          const dependency = checkRef(dependencyId, 'stories', 'Story ' + entity.id + ' dependency');
          if (dependencyId === entity.id) err('Story ' + entity.id + ' cannot depend on itself.');
          if (dependency && dependency.mapId !== entity.mapId) err('Story ' + entity.id + ' has a dependency in another map.');
          if (dependency && (dependency.kind || 'story') !== 'story') err('Story ' + entity.id + ' dependencies must refer to story cards, not discovery notes or questions.');
          if (dependency && dependency.status !== 'done') warnings.push('“' + entity.title + '” depends on unfinished “' + dependency.title + '”.');
        }
        if ((entity.kind || 'story') === 'story' && !entity.acceptance) warnings.push('“' + entity.title + '” has no acceptance criteria yet.');
      }
    }
    for (const collection of ['maps', 'stories']) for (const entity of list(state[collection])) {
      if (object(entity)) for (const personaId of list(entity.personaIds)) checkRef(personaId, 'personas', TYPES[collection] + ' ' + entity.id);
    }
    // Iterative DFS avoids a call-stack overflow on large imported dependency graphs.
    const colors = new Map();
    for (const story of list(state.stories)) {
      if (!object(story) || colors.get(story.id)) continue;
      const stack = [{ id: story.id, at: 0 }];
      colors.set(story.id, 1);
      while (stack.length) {
        const current = stack[stack.length - 1];
        const entity = indexes.stories.get(current.id);
        const dependencies = entity ? list(entity.dependencies) : [];
        if (current.at >= dependencies.length) { colors.set(current.id, 2); stack.pop(); continue; }
        const dependencyId = dependencies[current.at++];
        if (!indexes.stories.has(dependencyId)) continue;
        if (colors.get(dependencyId) === 1) err('Dependency cycle detected: ' + current.id + ' → ' + dependencyId + '.');
        else if (!colors.get(dependencyId)) { colors.set(dependencyId, 1); stack.push({ id: dependencyId, at: 0 }); }
      }
    }
    for (const release of list(state.releases)) {
      if (!object(release)) continue;
      const total = list(state.stories).filter(story => object(story) && story.releaseId === release.id && (story.kind || 'story') === 'story').reduce((sum, story) => sum + (Number.isFinite(story.points) ? story.points : 0), 0);

      if (typeof value === 'number') { if (!Number.isFinite(value)) err(path + ' contains a non-finite number.'); continue; }

      seen.add(value);
      if (depth > 40) { err(path + ' exceeds the supported metadata nesting depth of 40.'); continue; }
      if (!Array.isArray(value) && ![Object.prototype, null].includes(Object.getPrototypeOf(value))) { err(path + ' must use ordinary JSON objects.'); continue; }
      for (const key of Object.keys(value)) pending.push({ value: value[key], path: path + '.' + key, depth: depth + 1 });

  }

  function assertValid(state) {

  }

  function parseImport(text) {

    if (!object(imported)) fail('Imported JSON must contain a workspace object.');
    if (own(imported, 'format')) {
      if (imported.format !== 'storyloom') fail('This JSON export is not a Storyloom workspace.');
      if (imported.schemaVersion !== VERSION) fail('Unsupported export schema version: ' + String(imported.schemaVersion) + '. Expected 1.');
      if (!object(imported.data)) fail('The Storyloom JSON export is missing its data object.');
      imported = imported.data;
    }
    if (imported.schemaVersion !== VERSION) fail('Unsupported workspace schema version: ' + String(imported.schemaVersion) + '. Expected 1.');
    return assertValid(normalizeState(imported));
  }

  function toJSON(state) {
    assertValid(state);

  }

  const frontKey = field => 'storyloom_' + FRONT_KEYS[field];

  }

      merged[key] = value;

  function toMarkdown(state, type, entity) {
    type = TYPES[type] || type;
    if (type === 'workspace') {
      const metadata = {
        storyloom_type: 'workspace', storyloom_schema: VERSION,
        storyloom_vault_name: state.settings.vaultName, storyloom_theme: state.settings.theme

      if (Object.keys(extraState).length) metadata.storyloom_extension_data = extraState;
      if (own(state, 'extraFrontmatter')) metadata.storyloom_extra_frontmatter_present = true;
      if (own(state, 'workspaceBody')) metadata.storyloom_markdown_body_present = true;
      return writeMarkdown(metadata, state.extraFrontmatter, state.workspaceBody || '');

    if (!FIELDS[type]) fail('Unknown Markdown entity type: ' + String(type) + '.');
    if (!object(entity)) fail('A valid ' + type + ' entity is required.');
    const normalized = { ...defaults(type), ...entity };
    const metadata = { storyloom_type: type, storyloom_schema: VERSION };
    for (const field of FIELDS[type]) metadata[frontKey(field)] = normalized[field];
    for (const [field, key] of [['mapId', 'map'], ['activityId', 'activity'], ['stepId', 'step'], ['releaseId', 'release']]) {

    }
    if (normalized.personaIds) metadata.storyloom_persona_links = normalized.personaIds.map(id => '[[' + id + ']]');
    if (normalized.dependencies) metadata.storyloom_dependency_links = normalized.dependencies.map(id => '[[' + id + ']]');
    const extra = extractExtra(entity, [...FIELDS[type], BODY_FIELDS[type], 'extraFrontmatter']);
    if (Object.keys(extra).length) metadata.storyloom_extension_data = extra;
    if (own(entity, 'extraFrontmatter')) metadata.storyloom_extra_frontmatter_present = true;
    if (BODY_FIELDS[type] === 'markdownBody' && own(entity, 'markdownBody')) metadata.storyloom_markdown_body_present = true;

  function files(state) {
    assertValid(state);
    const result = [{ path: 'workspace.md', content: toMarkdown(state, 'workspace', state), type: 'workspace', id: 'workspace' }];
    const paths = new Set(['workspace.md']);
    for (const collection of COLLECTIONS) for (const entity of state[collection]) {
      const path = sanitizeFolder(state.settings.folders[collection]) + '/' + entity.id + '.md';
      if (paths.has(path.toLowerCase())) fail('Two entities would write to the same vault path: ' + path + '.');
      paths.add(path.toLowerCase());
      result.push({ path, content: toMarkdown(state, TYPES[collection], entity), type: TYPES[collection], id: entity.id });

  function canStartQuote(value, at) {
    let previous = at - 1;

  function stripComment(value) {

  function splitFlow(value) {

        if (quote === '"' && c === '\\') { escaped = true; continue; }

      } else if ((c === '"' || c === "'") && canStartQuote(value, i)) quote = c;
      else if (c === '[' || c === '{') depth++;
      else if (c === ']' || c === '}') depth--;

  function parseScalar(input, label, depth = 0) {

    if (!value) return null;
    if (/^(?:&|\*|!|<<\s*:|%|---(?:\s|$)|\.\.\.(?:\s|$))/.test(value)) fail(label + ': YAML anchors, aliases, tags, directives, and multi-document values are unsupported.');

        if (own(result, pair.key)) fail(label + ': duplicate YAML key “' + pair.key + '”.');

      ['story-compare-quotes', 'step-budget', 'rel-next', 'Compare the quotes', 'idea', 'should', 5, 'Compare quotes against a common scope rather than price alone.', '- [ ] Attach each quote to a work package.\n- [ ] Record inclusions and exclusions.\n- [ ] Compare totals side by side.', ['collaboration', 'costs'], []],
      ['question-cost-range', 'step-budget', null, 'Would a cost range help?', 'idea', 'could', 0, 'Research question: do homeowners trust an estimate more when we show a range, the assumptions, and a confidence level? Interview three first-time renovators.', '', ['research'], [], 'question'],
      ['story-build-shortlist', 'step-coordinate', 'rel-mvp', 'Build a contractor shortlist', 'idea', 'should', 3, 'Keep promising contacts and their trade in one place.', '- [ ] Record a contractor and trade.\n- [ ] Add contact details and a source.\n- [ ] Link them to relevant work.', ['collaboration'], []],

    state.stories.push(
      { ...defaults('story'), id: 'story-mobile-photo', mapId: 'map-mobile', stepId: 'step-mobile-photo', releaseId: 'rel-mobile-mvp', title: 'Take a site photo', description: 'Capture an observation in a few seconds.', status: 'ready', priority: 'must', points: 3, personaIds: ['persona-homeowner'], tags: ['mobile'], acceptance: '- [ ] Take or choose a photo.\n- [ ] Add a short caption.\n- [ ] Keep the capture if connectivity is interrupted.', order: 0, created, updated },

  return Object.freeze({
    VERSION, COLLECTIONS: Object.freeze(COLLECTIONS), TYPES: Object.freeze(TYPES),

<script>
/* Secondary Storyloom views. Pure renderers: domain mutations and event handling
 * belong to app.js. User content is escaped before entering HTML.
 */
(function (root) {
  'use strict';

  const COLLECTIONS = ['maps', 'activities', 'steps', 'stories', 'releases', 'personas'];
  const PLURALS = { map: 'maps', activity: 'activities', step: 'steps', story: 'stories', release: 'releases', persona: 'personas' };
  const TYPE_LABELS = { map: 'Story map', activity: 'Activity', step: 'Step', story: 'Story', release: 'Release', persona: 'Persona', workspace: 'Workspace settings' };
  const FOLDER_LABELS = { maps: 'Story maps', activities: 'Activities', steps: 'Steps', stories: 'Stories & context', releases: 'Releases', personas: 'Personas' };
  const KIND_LABELS = { story: 'Story', note: 'Note', question: 'Question' };
  const RELEASE_LABELS = { planned: 'Planned', active: 'Active', completed: 'Completed' };
  const STATUS_ORDER = { idea: 0, ready: 1, 'in-progress': 2, done: 3 };

  function e(ctx, value) { return ctx.esc(value == null ? '' : String(value)); }
  function icon(ctx, name) { return ctx.icon(name); }
  function list(state, collection) { return Array.isArray(state[collection]) ? state[collection] : []; }
  function countLabel(count, singular, plural) { return count + ' ' + (count === 1 ? singular : (plural || singular + 's')); }
  function byId(items) { return new Map(items.map(function (item) { return [item.id, item]; })); }
  function mapItems(ctx) { return ctx.mapStories(); }
  function isStory(item) { return (item.kind || 'story') === 'story'; }
  function hasEstimate(item) { return typeof item.points === 'number' && Number.isFinite(item.points) && item.points >= 0; }
  function attr(ctx, name, value) { return ' data-' + name + '="' + e(ctx, value) + '"'; }
  function actionButton(ctx, action, label, iconName, attributes, classes) {
    return '<button type="button" class="' + (classes || 'btn') + '" data-action="' + action + '"' + (attributes || '') + '>' +
      (iconName ? icon(ctx, iconName) : '') + '<span>' + e(ctx, label) + '</span></button>';
  }
  function metrics(items) {
    const stories = items.filter(isStory);
    const estimated = stories.filter(hasEstimate);
    return {
      total: stories.length,
      done: stories.filter(function (story) { return story.status === 'done'; }).length,
      points: estimated.reduce(function (sum, story) { return sum + story.points; }, 0),
      estimated: estimated.length,
      unestimated: stories.length - estimated.length,
      context: items.length - stories.length
    };
  }
  function pointLabel(ctx, summary) {
    return summary.estimated ? e(ctx, ctx.formatPoints(summary.points)) : '—';
  }
  function dateLabel(value) {
    if (!value) return 'No target date';
    const parsed = new Date(value + 'T12:00:00Z');
    if (!Number.isFinite(parsed.getTime())) return value;
    return parsed.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
  }
  function heading(ctx, title, description, action, label, type) {
    return '<div class="section-heading"><div><h2>' + e(ctx, title) + '</h2><p>' + e(ctx, description) + '</p></div>' +
      (action ? actionButton(ctx, action, label, 'plus', type ? attr(ctx, 'type', type) : '', 'btn') : '') + '</div>';
  }
  function statusChip(ctx, status) {
    return '<span class="chip status-' + e(ctx, status) + '"><span class="dot" aria-hidden="true"></span>' +
      e(ctx, ctx.statusLabel(status)) + '</span>';
  }
  function sortConfig(ctx) {
    if (typeof ctx.sort === 'string') return { key: ctx.sort, direction: 'asc' };
    const sort = ctx.sort || {};
    return { key: sort.key || 'step', direction: sort.direction === 'desc' || sort.dir === 'desc' ? 'desc' : 'asc' };
  }
  function sortHeader(ctx, label, key, config) {
    const active = config.key === key;
    return '<th scope="col"' + (active ? ' aria-sort="' + (config.direction === 'asc' ? 'ascending' : 'descending') + '"' : '') +
      '><button type="button" data-action="sort" data-key="' + key + '" aria-label="Sort by ' + e(ctx, label.toLowerCase()) + '">' +
      e(ctx, label) + (active ? ' <span aria-hidden="true">' + (config.direction === 'asc' ? '↑' : '↓') + '</span>' : '') + '</button></th>';
  }
  function sortedBacklog(ctx, items, steps, releases) {
    const config = sortConfig(ctx);
    const stepOrder = new Map(steps.map(function (step, index) { return [step.id, index]; }));
    const releaseOrder = new Map(releases.map(function (release, index) { return [release.id, index]; }));
    const sign = config.direction === 'desc' ? -1 : 1;
    return items.slice().sort(function (a, b) {
      let compared = 0;
      switch (config.key) {
        case 'title':
          compared = a.title.localeCompare(b.title, undefined, { numeric: true, sensitivity: 'base' });
          break;
        case 'status':
          compared = (STATUS_ORDER[a.status] || 0) - (STATUS_ORDER[b.status] || 0);
          break;
        case 'points':
          if (isStory(a) && hasEstimate(a) !== (isStory(b) && hasEstimate(b))) return hasEstimate(a) && isStory(a) ? -1 : 1;
          if (isStory(a) !== isStory(b)) return isStory(a) ? -1 : 1;
          compared = (hasEstimate(a) ? a.points : 0) - (hasEstimate(b) ? b.points : 0);
          break;
        case 'release':
          compared = (releaseOrder.has(a.releaseId) ? releaseOrder.get(a.releaseId) : releases.length) -
            (releaseOrder.has(b.releaseId) ? releaseOrder.get(b.releaseId) : releases.length);
          break;
        case 'step':
        default:
          compared = (stepOrder.get(a.stepId) || 0) - (stepOrder.get(b.stepId) || 0);
      }
      if (compared) return compared * sign;
      const byRelease = (releaseOrder.has(a.releaseId) ? releaseOrder.get(a.releaseId) : releases.length) -
        (releaseOrder.has(b.releaseId) ? releaseOrder.get(b.releaseId) : releases.length);
      return byRelease || (a.order || 0) - (b.order || 0) || a.id.localeCompare(b.id);
    });
  }

  function backlog(ctx) {
    const state = ctx.state;
    const all = mapItems(ctx);
    const visible = ctx.filteredStories();
    const steps = ctx.sortedSteps();
    const releases = list(state, 'releases').filter(function (release) { return release.mapId === ctx.mapId; })
      .slice().sort(function (a, b) { return a.order - b.order; });
    const stepLookup = byId(steps);
    const releaseLookup = byId(releases);
    const personaLookup = byId(list(state, 'personas'));
    const config = sortConfig(ctx);
    const selected = ctx.selection || new Set();
    const summary = metrics(visible);
    const description = countLabel(visible.length, 'item') + (visible.length !== all.length ? ' of ' + all.length + ' shown' : '') +
      ' · ' + countLabel(summary.total, 'story', 'stories') + ' · ' + countLabel(summary.context, 'context card');
    const top = heading(ctx, 'Product backlog', description, 'new-story', 'New story');
    if (!visible.length) {
      const filtered = all.length > 0;
      return '<section class="scroll-page">' + top + '<div class="empty-state">' + icon(ctx, filtered ? 'search' : 'file') +
        '<h2>' + (filtered ? 'No matching stories' : 'Your next idea starts here') + '</h2><p>' +
        (filtered ? 'Try another search or clear the filters to see the whole product backlog.' : 'Add a story to a step in the journey. You can refine the details and choose a release as the idea becomes clearer.') +
        '</p>' + actionButton(ctx, filtered ? 'clear-filters' : 'new-story', filtered ? 'Clear filters' : 'Add a story', filtered ? null : 'plus', '', 'primary') +
        '</div></section>';
    }
    const rows = sortedBacklog(ctx, visible, steps, releases).map(function (story) {
      const step = stepLookup.get(story.stepId);
      const release = releaseLookup.get(story.releaseId);
      const people = (story.personaIds || []).map(function (id) { return personaLookup.get(id); }).filter(Boolean);
      const kind = KIND_LABELS[story.kind] || 'Story';
      const pointText = isStory(story) ? (hasEstimate(story) ? e(ctx, ctx.formatPoints(story.points)) : '—') : '—';
      const pointTitle = isStory(story) ? (hasEstimate(story) ? 'Story points' : 'Not estimated') : 'Context cards are not estimated';
      return '<tr' + (selected.has(story.id) ? ' class="selected"' : '') + ' data-action="select-story"' + attr(ctx, 'id', story.id) + '>' +
        '<td><input type="checkbox" data-action="toggle-select"' + attr(ctx, 'id', story.id) +
        ' aria-label="Select ' + e(ctx, story.title) + '"' + (selected.has(story.id) ? ' checked' : '') + '></td>' +
        '<td class="row-title"><button type="button" class="row-open" data-action="select-story"' + attr(ctx, 'id', story.id) + '><strong>' +
        e(ctx, story.title) + '</strong></button><small>' + e(ctx, kind) + ' · ' + e(ctx, story.id) +
        ((story.tags || []).length ? ' · ' + e(ctx, story.tags.join(', ')) : '') + '</small></td>' +
        '<td>' + e(ctx, step ? step.title : 'Unassigned step') + '</td><td>' + e(ctx, release ? release.title : 'Unplanned') + '</td>' +
        '<td>' + statusChip(ctx, story.status) + '</td><td class="muted">' + (people.length ? e(ctx, people.map(function (person) { return person.title; }).join(', ')) : '—') + '</td>' +
        '<td class="table-points" title="' + pointTitle + '">' + pointText + '</td></tr>';
    }).join('');
    return '<section class="scroll-page">' + top + '<div class="list-wrap"><table aria-label="Stories and context in the current product map"><thead><tr>' +
      '<th scope="col">Select</th>' + sortHeader(ctx, 'Story', 'title', config) + sortHeader(ctx, 'Step', 'step', config) +
      sortHeader(ctx, 'Release', 'release', config) + sortHeader(ctx, 'Status', 'status', config) + '<th scope="col">Personas</th>' +
      sortHeader(ctx, 'Points', 'points', config) + '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="file-stats"><span>' + pointLabel(ctx, summary) + ' known points</span><span>' +
      countLabel(summary.unestimated, 'unestimated story', 'unestimated stories') + '</span><span>Notes and questions are excluded from effort and progress.</span></div></section>';
  }

  function releasePanel(ctx, release, all, steps) {
    const unplanned = release.id === null;
    const items = all.filter(function (item) { return (item.releaseId || null) === release.id; });
    const stories = items.filter(isStory);
    const summary = metrics(items);
    const percent = summary.total ? Math.round(summary.done / summary.total * 100) : 0;
    const represented = steps.filter(function (step) { return stories.some(function (story) { return story.stepId === step.id; }); }).length;
    const statusClass = release.status === 'completed' ? 'status-done' : release.status === 'active' ? 'status-in-progress' : 'status-idea';
    const capacity = typeof release.capacity === 'number' && release.capacity > 0 ? release.capacity : null;
    const filterId = unplanned ? 'unplanned' : release.id;
    const buttons = actionButton(ctx, 'release-filter', 'View on map', 'map', attr(ctx, 'id', filterId), 'btn') +
      (unplanned ? '' : actionButton(ctx, 'edit-entity', 'Edit', 'edit', attr(ctx, 'type', 'releases') + attr(ctx, 'id', release.id), 'btn'));
    const coverage = steps.map(function (step) {
      const count = stories.filter(function (story) { return story.stepId === step.id; }).length;
      return '<div class="coverage-step ' + (count ? 'has-stories' : 'no-stories') + '"><span class="dot" aria-hidden="true"></span><span>' +
        e(ctx, step.title) + '</span><span class="faint">' + (count ? countLabel(count, 'story', 'stories') : 'No story in this slice') + '</span></div>';
    }).join('');
    return '<section class="release-panel"><div class="release-panel-header"><div><h3>' + e(ctx, release.title) + '</h3><p>' +
      e(ctx, release.goal || 'Add an outcome to explain what this release makes possible for your users.') + '</p></div>' + buttons + '</div>' +
      '<div class="file-stats"><span class="chip ' + statusClass + '"><span class="dot" aria-hidden="true"></span>' +
      (unplanned ? 'Not scheduled' : e(ctx, RELEASE_LABELS[release.status] || release.status)) + '</span>' +
      (unplanned ? '' : '<span>' + e(ctx, dateLabel(release.targetDate)) + '</span>') +
      (summary.context ? '<span>' + countLabel(summary.context, 'context card') + '</span>' : '') + '</div>' +
      '<div class="release-stats"><span><strong>' + summary.done + ' / ' + summary.total + '</strong> stories done</span><span><strong>' +
      pointLabel(ctx, summary) + '</strong> known points' + (capacity ? ' / ' + e(ctx, ctx.formatPoints(capacity)) + ' capacity' : '') +
      '</span><span><strong>' + summary.unestimated + '</strong> unestimated</span></div>' +
      '<div class="release-progress" role="progressbar" aria-label="' + e(ctx, release.title) + ' story completion" aria-valuemin="0" aria-valuemax="' +
      (summary.total || 1) + '" aria-valuenow="' + summary.done + '" aria-valuetext="' +
      (summary.total ? summary.done + ' of ' + summary.total + ' stories done' : 'No stories in this slice') + '"><span style="width:' + percent + '%"></span></div>' +
      '<div class="small muted">' + (summary.total ? percent + '% of stories complete' : 'Add stories to begin shaping this slice.') +
      (capacity && summary.points > capacity ? ' · Known effort exceeds capacity by ' + e(ctx, ctx.formatPoints(summary.points - capacity)) + ' points.' : '') + '</div>' +
      '<div class="form-section"><h3>Journey coverage <span class="faint">· ' + represented + ' of ' + steps.length + ' steps represented</span></h3>' +
      (steps.length ? '<div class="coverage-steps">' + coverage + '</div>' : '<p>Add steps to the map to see which parts of the journey this slice supports.</p>') +
      '</div></section>';
  }

  function releases(ctx) {
    const all = mapItems(ctx);
    const steps = ctx.sortedSteps();
    const ordered = list(ctx.state, 'releases').filter(function (release) { return release.mapId === ctx.mapId; })
      .slice().sort(function (a, b) { return a.order - b.order; });
    const rows = ordered.concat([{ id: null, title: 'Unplanned', goal: 'Ideas and possibilities that have not been assigned to a release.', status: 'planned' }]);
    return '<section class="scroll-page">' +
      heading(ctx, 'Release slices', 'Plan a useful outcome across the journey. Story counts exclude notes and questions.', 'create-entity', 'New release', 'releases') +
      rows.map(function (release) { return releasePanel(ctx, release, all, steps); }).join('') + '</section>';
  }

  function getFiles(ctx) {
    if (Array.isArray(ctx.files)) return ctx.files;
    if (typeof ctx.files === 'function') return ctx.files();
    return root.StoryData.files(ctx.state);
  }
  function fileGroup(ctx, label, folder, entries, selectedPath) {
    if (!entries.length) return '';

      e(ctx, folder || label) + '</span><span class="faint">' + entries.length + '</span></h3>' +
      entries.map(function (file) {
        const selected = file.path === selectedPath;
        const name = file.path.split('/').pop();
        return '<button type="button" class="file-entry' + (selected ? ' selected' : '') + '" data-action="source-file"' +
          attr(ctx, 'path', file.path) + ' title="' + e(ctx, file.path) + '"' + (selected ? ' aria-current="true"' : '') + '>' +
          icon(ctx, 'file') + '<span class="file-name">' + e(ctx, name) + '</span></button>';
      }).join('') + '</section>';
  }
  function files(ctx) {

function renderBoard(){const acts=mapActivities(),steps=sortedSteps(),releases=mapReleases(),visible=filteredStories(),columns=acts.flatMap(a=>{const own=steps.filter(s=>s.activityId===a.id);return own.length?own:[{id:null,activityId:a.id}];});if(!map())return `<div class="empty-state">${icon('map')}<h2>Your first story map starts here</h2><p>Give your product a name, then sketch the activities and steps your users take.</p><button class="primary" data-action="create-entity" data-type="maps">${icon('plus')}Create story map</button></div>`;if(!acts.length)return `<div class="empty-state">${icon('layers')}<h2>Build your journey’s backbone</h2><p>Start with a user activity, like “Plan my renovation”. Add steps beneath it, then place stories into releases.</p><button class="primary" data-action="create-entity" data-type="${acts.length?'steps':'activities'}">${icon('plus')}Add ${acts.length?'step':'activity'}</button></div>`;

function renderLane(r,index,steps,visible){const all=mapStories().filter(s=>(s.releaseId||null)===(r.id||null));const scope=all.filter(isStory),done=scope.filter(s=>s.status==='done').length,total=scope.reduce((n,s)=>n+(s.points||0),0),unknown=scope.filter(s=>s.points==null).length,collapsed=ui.collapsed.has(r.id||'unscheduled');return `<section class="release-row ${collapsed?'collapsed-row':''}" data-release="${esc(r.id||'')}" aria-label="${esc(r.title)} release slice"><div class="lane-label" ${r.id?`draggable="true" data-drag="releases" data-id="${esc(r.id)}"`:''}><div class="release-order">${icon(r.id?'flag':'note')}<span>${r.id?`Release ${index+1}`:'Ideas & discovery'}</span></div><div class="lane-title"><button data-action="${r.id?'edit-entity':'toggle-lane'}" data-type="releases" data-id="${esc(r.id||'unscheduled')}">${esc(r.title)}</button>${ib(collapsed?'right':'down','toggle-lane',collapsed?'Expand release':'Collapse release',`data-id="${esc(r.id||'unscheduled')}"`)}</div><p>${esc(r.goal||'Add an outcome for this release.')}</p><div class="lane-meta"><span>${done}/${scope.length} done</span><span class="${r.capacity&&total>r.capacity?'over-capacity':''}">${total}${r.capacity?` / ${r.capacity}`:''} pts</span></div><div class="lane-progress" aria-label="${done} of ${scope.length} stories done"><span style="width:${scope.length?Math.round(done/scope.length*100):0}%"></span></div>${unknown?`<small class="faint">${unknown} unestimated</small>`:''}</div><div class="lane-cells">${steps.map(step=>{if(!step.id)return `<div class="story-cell"><button class="empty-cell" data-action="create-entity" data-type="steps" data-parent="${esc(step.activityId)}">${icon('plus')}Add journey step</button></div>`;const cell=visible.filter(s=>s.stepId===step.id&&(s.releaseId||null)===(r.id||null)).sort(byOrder);return `<div class="story-cell" data-step="${esc(step.id)}" data-release="${esc(r.id||'')}" aria-label="${esc(step.title)} / ${esc(r.title)}">${collapsed?`<div class="collaps function renderCard(s){const dependencies=(s.dependencies||[]).map(id=>state.stories.find(x=>x.id===id)).filter(Boolean),unresolved=dependencies.filter(d=>d.status!=='done').length;const key=s.id.replace(/^story-/,'').replace(/^s-/,'').toUpperCase();return `<article class="story-card kind-${esc(s.kind||'story')} ${ui.selection.has(s.id)?'selected':''}" tabindex="0" role="button" aria-label="${esc(s.title)}, ${LABELS[s.status]}, ${s.points==null?'unestimated':s.points+' points'}" aria-pressed="${ui.selection.has(s.id)}" data-action="select-story" data-id="${esc(s.id)}" data-card="${esc(s.id)}" draggable="true" data-drag="stories"><div class="card-top"><span class="story-key">${esc(key.length>20?key.slice(-10):key)}</span>${!isStory(s)?`<span class="kind-label">${esc(s.kind)}</span>`:''}${ib('more','story-menu','Story actions',`class="card-menu" data-id="${esc(s.id)}"`)}</div><div class="card-title">${esc(s.title)}</div>${!ui.focus?`${s.tags?.length?`<div class="card-tags">${s.tags.slice(0,2).map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:''}<div class="card-footer"><span class="story-status status-${s.status}"><span class="dot"></span>${LABELS[s.status]}</span>${dependencies.length?`<span class="dependency-mark ${unresolved?'unresolved':''}" title="${unresolved} of ${dependencies.length} dependencies unfinished">${icon('link')}${dependencies.length}</span>`:''}${isStory(s)?`<span class="points" title="${s.points==null?'Unestimated':'Story points'}">${points(s)}</span>`:''}</div>`:''}</article>`;}
function sizeBoard(){const b=document.querySelector('.story-board'),sp=document.getElementById('board-spacer');if(!b||!sp)return;sp.style.width=Math.ceil((b.scrollWidth||parseFloat(b.style.width)||1400)*ui.zoom)+'px';sp.style.height=Math.ceil((b.offsetHeight||1100)*ui.zoom)+'px';}

function drawConnections(){const svg=document.querySelector('.dependency-svg');if(!svg)return;const group=svg.querySelector('g');group.innerHTML='';if(!ui.dependencies)return;const board=document.querySelector('.story-board'),base=board.getBoundingClientRect();const cards=new Map([...document.querySelectorAll('[data-card]')].map(el=>[el.dataset.card,el]));for(const story of filteredStories()){const from=cards.get(story.id);if(!from)continue;for(const dep of story.dependencies||[]){const to=cards.get(dep);if(!to)continue;const f=from.getBoundingClientRect(),t=to.getBoundingClientRect();const x1=(f.left-base.left)/ui.zoom,y1=(f.top-base.top+f.height/2)/ui.zoom,x2=(t.right-base.left)/ui.zoom,y2=(t.top-base.top+t.height/2)/ui.zoom;const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('class','dependency-line');path.setAttribute('d',`M ${x1} ${y1} C ${x1-50} ${y1},${x2+50} ${y2},${x2} ${y2}`);path.setAttribute('marker-end','url(#dep-arrow)');group.append(path);}}}
function drawMinimap(){const svg=document.querySelector('.minimap svg'),vp=document.querySelector('.board-viewport'),board=document.querySelector('.story-board');if(!svg||!vp||!board)return;const steps=sortedSteps(),rels=[...mapReleases().map(r=>r.id),null],w=board.scrollWidth||1400,h=board.offsetHeight||1100;svg.innerHTML=`<rect width="150" height="75" fill="var(--bg)"/>${mapActivities().map((a,i)=>`<rect x="${18+i*40}" y="3" width="36" height="7" rx="1" fill="${cleanHex(a.color)}" opacity=".8"/>`).join('')}${mapStories().map(s=>{const c=steps.findIndex(t=>t.id===s.stepId),r=rels.indexOf(s.releaseId||null);return `<rect x="${19+c*20}" y="${15+r*14+Math.min(s.order||0,3)*2}" width="16" height="6" rx="1" fill="${ui.selection.has(s.id)?'var(--accent)':'var(--border)'}"/>`;}).join('')}<rect class="viewport-box" x="${Math.max(0,vp.scrollLeft/(w*ui.zoom)*150)}" y="${Math.max(0,vp.scrollTop/(h*ui.zoom)*75)}" width="${Math.min(149,vp.clientWidth/(w*ui.zoom)*150)||130}" height="${Math.min(74,vp.clientHeight/(h*ui.zoom)*75)||45}" rx="2"/>`;}
function renderSelectionBar(){document.querySelector('.selection-bar')?.remove();if(ui.selection.size<2||!['map','backlog'].includes(ui.view))return;const el=document.createElement('div');el.className='selection-bar';el.innerHTML=`<strong>${ui.selection.size} selected</strong><select id="bulk-release" aria-label="Move selected cards to release">${options([['__none','Move to release…'],['','Unscheduled'],...mapReleases().map(r=>[r.id,r.title])],'__none')}</select><select id="bulk-status" aria-label="Set status of selected cards">${options([['','Set status…'],...Object.entries(LABELS)],'')}</select>${ib('trash','delete-selected','Delete selected cards')}${ib('x','clear-selection','Clear selection')}`;document.getElementById('primary-content').append(el);}

function readDraft(){const form=document.getElementById('story-form');if(!form||!ui.draft)return;const values=new FormData(form);Object.assign(ui.draft,{title:String(values.get('title')||''),kind:values.get('kind')||'story',description:String(values.get('description')||''),status:values.get('status'),priority:values.get('priority'),points:values.get('points')===''?null:Number(values.get('points')),stepId:values.get('stepId'),releaseId:values.get('releaseId')||null,personaIds:values.getAll('personaIds'),tags:String(values.get('tags')||'').split(',').map(x=>x.trim()).filter(Boolean),acceptance:String(values.get('acceptance')||''),dependencies:values.getAll('dependencies')});}
function saveStory(){if(!ui.draft)return true;try{let candidate;if(ui.inspectorTab==='markdown'){ui.rawDraft=document.getElementById('story-source').value;const files=D.files(state),source={path:state.settings.folders.stories+'/'+ui.draft.id+'.md',type:'story',id:ui.draft.id,content:ui.rawDraft};const at=files.findIndex(f=>f.type==='story'&&f.id===ui.draft.id);if(at>=0)files[at]=source;else files.push(source);candidate=D.fromFiles(files);if(!candidate.stories.some(s=>s.id===ui.draft.id))throw new Error('Keep the story ID and note type unchanged when editing this note.');candidate.stories.find(s=>s.id===ui.draft.id).updated=new Date().toISOString();}else{readDraft();ui.draft.title=ui.draft.title.trim();if(!ui.draft.title)throw new Error('Give this card a title before saving.');const previous=state.stories.find(s=>s.id===ui.draft.id);if(previous&&(previous.stepId!==ui.draft.stepId||previous.releaseId!==ui.draft.releaseId))ui.draft.order=appendOrder(state.stories.filter(s=>s.stepId===ui.draft.stepId&&(s.releaseId||null)===(ui.draft.releaseId||null)&&s.id!==ui.draft.id));ui.draft.updated=new Date().toISOString();candidate=draftState();}validateOrThrow(candidate);const id=ui.draft.id,existing=state.stories.some(s=>s.id===id);ui.draft=D.clone(candidate.stories.find(s=>s.id===id));ui.mapId=ui.draft.mapId;ui.inspectorId=id;ui.dirty=false;ui.rawDraft=null;ui.selection=new Set([id]);return commit(existing?'Story updated':'Card created',()=>candidate);}catch(error){const el=document.getElementById('story-error');if(el){el.textContent=error.message;el.classList.remove('hidden');el.scrollIntoView?.({block:'nearest'});}else toast(error.message,false,true);return false;}}

function newStory(stepId,releaseId){guard(()=>{const steps=sortedSteps();if(!steps.length){createEntity(state.activities.some(a=>a.mapId===ui.mapId)?'steps':'activities');return;}const step=steps.some(s=>s.id===stepId)?stepId:steps[0].id;const release=releaseId!==undefined?(releaseId||null):(mapReleases()[0]?.id||null);const now=new Date().toISOString();ui.draft={id:D.uid('story'),mapId:ui.mapId,stepId:step,releaseId:release,title:'',kind:'story',description:'',status:'idea',priority:'should',points:null,personaIds:[],tags:[],acceptance:'',dependencies:[],order:appendOrder(state.stories.filter(s=>s.stepId===step&&(s.releaseId||null)===(release||null))),created:now,updated:now};ui.inspectorId=ui.draft.id;ui.inspectorTab='details';ui.rawDraft=null;ui.dirty=true;ui.selection.clear();renderInspector();renderSelectionBar();document.getElementById('story-title')?.focus();notifyFamily();});}

function createEntity(type,parent){guard(()=>{if(!COLLECTIONS.includes(type))return;if(type!=='maps'&&type!=='personas'&&!map()){createEntity('maps');return;}if(type==='steps'&&!mapActivities().length){createEntity('activities');return;}const now=new Date().toISOString();const defaults={maps:{goal:'',description:'',personaIds:[],created:now,updated:now},activities:{mapId:ui.mapId,description:'',order:mapActivities().length,color:['#efc3a5','#a9d6c4','#c4c5ed'][mapActivities().length%3]},steps:{mapId:ui.mapId,activityId:parent||mapActivities()[0]?.id,description:'',order:state.steps.filter(s=>s.activityId===(parent||mapActivities()[0]?.id)).length},releases:{mapId:ui.mapId,goal:'',status:'planned',targetDate:'',capacity:0,order:mapReleases().length,color:'#b5a3f4'},personas:{role:'',goal:'',pain:'',color:'#b5a3f4'}};if(!defaults[type])return;ui.entityType=type;ui.entityDraft={id:D.uid(TYPE_LABELS[type]),title:'',...defaults[type]};ui.entityNew=true;renderEntityModal();});}

function renderEntityModal(){const e=ui.entityDraft,type=ui.entityType,isNew=ui.entityNew;let body=field('title',`${TYPE_LABELS[type][0].toUpperCase()+TYPE_LABELS[type].slice(1)} name`,e.title,'input','required maxlength="240" placeholder="A clear, short name"');

function saveEntity(){const form=document.getElementById('entity-form');if(!form.reportValidity())return;const values=new FormData(form),type=ui.entityType,e=D.clone(ui.entityDraft),isNew=ui.entityNew;for(const [k,v] of values)if(k!=='template'&&k!=='firstStep'&&k!=='personaIds')e[k]=v;e.title=e.title.trim();if(!e.title){showEntityError('Give this item a name.');return;}if('order'in e)e.order=Math.max(0,Number(values.get('order'))-1);if('capacity'in e)e.capacity=Number(values.get('capacity'));if(type==='maps'){e.personaIds=values.getAll('personaIds');e.updated=new Date().toISOString();}const candidate=D.clone(state);const index=candidate[type].findIndex(x=>x.id===e.id);if(index>=0)candidate[type][index]=e;else candidate[type].push(e);

function showEntityError(message){const el=document.getElementById('entity-error');if(el){el.textContent=message;el.classList.remove('hidden');}else toast(message,false,true);}
function deleteEntity(type,id){const e=state[type]?.find(x=>x.id===id);if(!e)return;let storyIds=[],stepIds=[],details='';if(type==='maps'){storyIds=state.stories.filter(s=>s.mapId===id).map(s=>s.id);stepIds=state.steps.filter(s=>s.mapId===id).map(s=>s.id);details=`This removes the map and its ${storyIds.length} cards, ${stepIds.length} steps, activities, and release slices. Shared personas stay in the workspace.`;}if(type==='activities'){stepIds=state.steps.filter(s=>s.activityId===id).map(s=>s.id);storyIds=state.stories.filter(s=>stepIds.includes(s.stepId)).map(s=>s.id);details=`This removes this activity, its ${stepIds.length} steps, and ${storyIds.length} cards.`;}if(type==='steps'){storyIds=state.stories.filter(s=>s.stepId===id).map(s=>s.id);details=`This removes the step and ${storyIds.length} cards beneath it. Move those cards first if you want to keep them.`;}if(type==='releases')details=`${state.stories.filter(s=>s.releaseId===id).length} cards move to Unscheduled. Their status, details, and estimates remain intact.`;if(type==='personas')details='This removes the persona and clears its associations from maps and stories.';

function confirmDeleteEntity(){const {type,id,storyIds,stepIds}=ui.deleteRequest;closeModal();if(ui.draft&&(storyIds.includes(ui.draft.id)||type==='maps'))clearInspector();ui.selection.clear();commit(`${TYPE_LABELS[type]} deleted`,next=>{next[type]=next[type].filter(x=>x.id!==id);if(type==='maps'){next.activities=next.activities.filter(x=>x.mapId!==id);next.steps=next.steps.filter(x=>x.mapId!==id);next.releases=next.releases.filter(x=>x.mapId!==id);}if(type==='activities')next.steps=next.steps.filter(x=>!stepIds.includes(x.id));next.stories=next.stories.filter(x=>!storyIds.includes(x.id));for(const s of next.stories){s.dependencies=(s.dependencies||[]).filter(d=>!storyIds.includes(d));if(type==='releases'&&s.releaseId===id)s.releaseId=null;if(type==='personas')s.personaIds=s.personaIds.filter(p=>p!==id);}if(type==='personas')for(const m of next.maps)m.personaIds=m.personaIds.filter(p=>p!==id);});}
function deleteStories(ids){guard(()=>{const found=state.stories.filter(s=>ids.includes(s.id));if(!found.length)return;ui.deleteStoryIds=found.map(s=>s.id);openModal(found.length===1?'Delete this card?':`Delete ${found.length} cards?`,`<p class="lead">${found.length===1?esc(found[0].title):`${found.length} selected cards will be removed from the map.`}</p><p class="muted">References to these cards will be cleared. You can undo this operation.</p>`,`<button class="btn" data-action="close-modal">Keep cards</button><button class="btn danger" data-action="confirm-delete-stories">${icon('trash')}Delete</button>`);});}

function moveStories(ids,stepId,releaseId,beforeId){const moving=mapStories().filter(s=>ids.includes(s.id));if(!moving.length)return;ui.dirty=false;commit(`${moving.length===1?'Card':'Cards'} moved`,next=>{const peers=next.stories.filter(s=>s.stepId===stepId&&(s.releaseId||null)===(releaseId||null)&&!ids.includes(s.id)).sort(byOrder);const moved=moving.map(s=>next.stories.find(t=>t.id===s.id));moved.forEach(s=>{s.stepId=stepId;s.releaseId=releaseId||null;s.updated=new Date().toISOString();});let at=beforeId?peers.findIndex(s=>s.id===beforeId):-1;if(at<0)at=peers.length;peers.splice(at,0,...moved);peers.forEach((s,i)=>s.order=i);if(ui.inspectorId)ui.draft=D.clone(next.stories.find(s=>s.id===ui.inspectorId));ui.rawDraft=null;});}
function moveStructure(type,id,targetId){if(id===targetId)return;const target=state[type].find(x=>x.id===targetId),item=state[type].find(x=>x.id===id);if(!target||!item||target.mapId!==item.mapId)return;commit(`${TYPE_LABELS[type]} reordered`,next=>{const moved=next[type].find(x=>x.id===id);if(type==='steps')moved.activityId=target.activityId;const peers=next[type].filter(x=>x.id!==id&&(type==='steps'?x.activityId===target.activityId:x.mapId===target.mapId)).sort(byOrder),at=peers.findIndex(x=>x.id===targetId);peers.splice(Math.max(0,at),0,moved);peers.forEach((x,i)=>x.order=i);});}
function saveSettings(){const form=document.getElementById('settings-form');if(!form)return;if(!form.reportValidity())return;const values=new FormData(form);try{const settings=D.clone(state.settings);settings.vaultName=String(values.get('vaultName')||'').trim();settings.theme=values.get('theme')||'dark';for(const k of COLLECTIONS){const value=values.get('folders.'+k);if(value!==null)settings.folders[k]=D.sanitizeFolder(String(value));}const candidate=D.clone(state);candidate.settings=settings;validateOrThrow(candidate);ui.familySettingsDirty=false;commit('Folder settings saved; exports now use these paths',()=>candidate);}catch(error){const errorBox=document.getElementById('settings-error');if(errorBox){errorBox.textContent=error.message;errorBox.classList.remove('hidden');}else toast(error.message,false,true);}}

function renderExport(){const files=getFiles();openModal('Export your story maps',`<p class="lead">Take your work with you. JSON and Markdown include the relationships needed to rebuild the canvas.</p><div class="field"><label for="export-scope">Include</label><select id="export-scope">${options([['workspace',`Entire workspace · ${state.maps.length} maps`],['map',`Current map · ${map()?.title||'No map'}`]],ui.exportScope)}</select></div><div class="option-list"><button class="export-option" data-action="export-json">${icon('code')}<span><strong>JSON snapshot</strong><small>Complete, versioned data. Best for backup and exact re-import into this prototype.</small></span>${icon('download')}</button><button class="export-option" data-action="export-vault">${icon('folder')}<span><strong>Markdown vault bundle · ZIP</strong><small>Individual notes with frontmatter, wikilinks, and workspace.md. Uses your configured folders.</small></span>${icon('download')}</button><button class="export-option" data-action="export-csv">${icon('list')}<span><strong>Story backlog · CSV</strong><small>Stories from the current map for spreadsheets. This is a flat handoff, not a full map backup.</small></span>${icon('download')}</button><button class="export-option" data-action="export-canvas">${icon('map')}<span><strong>Obsidian Canvas · .canvas</strong><small>A derived view of the current map. Download the Markdown bundle too so its file cards resolve.</small></span>${icon('download')}</button></div><div class="notice">${icon('file')}<span>Canonical map data stays in Markdown notes. The .canvas file is a snapshot; changing it does not update this prototype.</span></div>`,`<span class="modal-footer-note">${files.length} Markdown files in this workspace</span><button class="btn" data-action="close-modal">Done</button>`);}
function download(name,content,mime='text/plain;charset=utf-8'){const blob=new Blob([content],{type:mime});if(typeof URL.createObjectURL!=='function'){window.__lastDownload={name,content,mime};toast('This preview cannot download files. Open the HTML in a desktop browser.',false,true);return;}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.style.display='none';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);window.__lastDownload={name,content,mime};toast(`${name} downloaded`);}
function exportCanvas(){const steps=sortedSteps(),rels=[...mapReleases(),{id:null,title:'Unscheduled'}],nodes=[],edges=[],positions=new Map();let y=140;const xOffset=220,col=250;mapActivities().forEach(a=>{const own=steps.filter(s=>s.activityId===a.id),index=steps.findIndex(s=>s.activityId===a.id);if(!own.length)return;nodes.push({id:'a-'+a.id,type:'file',file:entityPath('activities',a.id),x:xOffset+index*col,y:0,width:own.length*col-18,height:60,color:'6'});});steps.forEach((s,i)=>nodes.push({id:'t-'+s.id,type:'file',file:entityPath('steps',s.id),x:xOffset+i*col,y:78,width:230,height:54}));rels.forEach(r=>{const cards=mapStories().filter(s=>(s.releaseId||null)===(r.id||null));const max=Math.max(1,...steps.map(t=>cards.filter(c=>c.stepId===t.id).length));const height=max*160+45;nodes.push({id:'lane-'+(r.id||'unscheduled'),type:'text',text:`## ${r.title}\n\n${r.goal||''}`,x:0,y,width:195,height:150});steps.forEach((step,i)=>cards.filter(s=>s.stepId===step.id).sort(byOrder).forEach((s,j)=>{const node={id:'s-'+s.id,type:'file',file:entityPath('stories',s.id),x:xOffset+i*col,y:y+j*160,width:230,height:142};if(s.kind==='note')node.color='3';if(s.kind==='question')node.color='6';nodes.push(node);positions.set(s.id,node.id);}));y+=height;});mapStories().forEach(s=>(s.dependencies||[]).forEach(d=>{if(positions.has(s.id)&&positions.has(d))edges.push({id:'e-'+s.id+'-'+d,fromNode:positions.get(s.id),fromSide:'left',toNode:positions.get(d),toSide:'right',toEnd:'arrow',label:'depends on'});}));return JSON.stringify({nodes,edges},null,2);}
function openImport(){guard(()=>{ui.importData=null;ui.importSkipped=0;openModal('Import story maps',`<p class="lead">Open a Storyloom snapshot or the Markdown notes from an exported vault bundle. You’ll review the contents before changing your workspace.</p><div class="import-actions"><button class="btn" data-action="choose-import-file">${icon('upload')}Choose JSON or ZIP</button><button class="btn" data-action="choose-import-folder">${icon('folder')}Choose Markdown folder</button></div><div class="field"><label for="import-text">Or paste a Storyloom JSON snapshot</label><textarea id="import-text" class="source-editor" rows="8" spellcheck="false" placeholder="Paste the complete JSON snapshot here…"></textarea></div><div id="import-error" class="error-box hidden" role="alert"></div><p class="field-help">ZIP import accepts the uncompressed ZIP format exported by this prototype. For other ZIPs, extract the files and choose the folder. Imports are limited to 32 MB and the documented Storyloom schema.</p>`,`<button class="btn" data-action="close-modal">Cancel</button><button class="primary" data-action="review-import">Review import</button>`,true);});}
function showImportError(error){const el=document.getElementById('import-error');if(el){el.textContent=error.message||error;el.classList.remove('hidden');}else toast(error.message||error,false,true);}
function stageImport(candidate,label){try{validateOrThrow(candidate);ui.importData=candidate;ui.importLabel=label;const collisions=COLLECTIONS.reduce((n,k)=>n+candidate[k].filter(e=>state[k].some(x=>x.id===e.id)).length,0);const v=D.validate(candidate);openModal('Review imported workspace',`<p class="lead">${esc(label)} parsed successfully. Choose how to bring these notes into your workspace.</p><div class="import-summary"><span><strong>${candidate.maps.length}</strong> maps</span><span><strong>${candidate.stories.length}</strong> cards</span><span><strong>${candidate.releases.length}</strong> releases</span><span><strong>${D.files(candidate).length}</strong> Markdown files</span></div><label class="radio-option"><input type="radio" name="import-mode" value="merge" checked><span><strong>Merge by stable ID</strong><small>${collisions} existing records will be updated from the import. Other records and your folder settings stay.</small></span></label><label class="radio-option"><input type="radio" name="import-mode" value="replace"><span><strong>Replace the workspace</strong><small>Replace all ${state.maps.length} maps and their notes, and adopt the imported folder settings. You can undo this during the session.</small></span></label>${ui.importSkipped?`<p class="field-help">${ui.importSkipped} unrelated Markdown files were ignored.</p>`:''}${v.warnings.length?`<div class="notice">${icon('alert')}<span>${esc(v.warnings.slice(0,5).join('\n'))}</span></div>`:''}<div id="import-error" class="error-box hidden" role="alert"></div>`,`<button class="btn" data-action="close-modal">Cancel</button><button class="primary" data-action="apply-import">${icon('check')}Apply import</button>`,true);}catch(error){showImportError(error);}}
function applyImport(){const mode=document.querySelector('[name=import-mode]:checked')?.value||'merge',incoming=ui.importData;if(!incoming)return;try{const next=mode==='replace'?D.clone(incoming):D.clone(state);if(mode==='merge'){for(const key of COLLECTIONS){const rows=new Map(next[key].map(e=>[e.id,e]));for(const entry of incoming[key])rows.set(entry.id,D.clone(entry));next[key]=[...rows.values()];}}validateOrThrow(next);ui.mapId=incoming.maps[0]?.id||next.maps[0]?.id||null;ui.view='map';ui.selection.clear();clearInspector();ui.query='';ui.statusFilter='';ui.personaFilter='';ui.releaseFilter='';closeModal();commit(mode==='replace'?'Workspace imported':'Workspace merged',()=>next);}catch(error){showImportError(error);}}
async function readFile(file,binary=false){if(binary&&file.arrayBuffer)return file.arrayBuffer();if(!binary&&file.text)return file.text();return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error(`Could not read ${file.name}.`));binary?reader.readAsArrayBuffer(file):reader.readAsText(file);});}
async function importFiles(input,folder=false){const files=[...input.files];input.value='';if(!files.length)return;if(files.reduce((n,f)=>n+f.size,0)>32*1024*1024){showImportError(new Error('Choose an import smaller than 32 MB.'));return;}try{let next;if(folder){const texts=await Promise.all(files.filter(f=>/\.md$/i.test(f.name)).map(async f=>({path:f.webkitRelativePath||f.name,content:await readFile(f)})));const relevant=texts.filter(f=>/^storyloom_type\s*:/m.test(f.content));ui.importSkipped=texts.length-relevant.length;if(!relevant.length)throw new Error('This folder has no Storyloom Markdown notes. Choose the folder from a Markdown vault export.');const first=files.find(f=>f.webkitRelativePath)?.webkitRelativePath.split('/')[0];if(first)relevant.forEach(f=>{if(f.path.startsWith(first+'/'))f.path=f.path.slice(first.length+1);});next=D.fromFiles(relevant);}else if(/\.zip$/i.test(files[0].name)){next=D.fromFiles(D.readZip(new Uint8Array(await readFile(files[0],true))));}else next=D.parseImport(await readFile(files[0]));stageImport(next,folder?'Markdown folder':files[0].name);}catch(error){showImportError(error);}}
async function copyText(text){try{if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(text);else{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.left='-10000px';document.body.append(ta);ta.select();if(!document.execCommand?.('copy'))throw new Error('Clipboard access is unavailable.');ta.remove();}toast('Copied to clipboard');}catch(error){toast('Clipboard access is unavailable. Download the note instead.',false,true);}}

function startTour(){guard(()=>{closeModal();clearInspector();ui.selection.clear();ui.view='map';ui.tour=0;ui.focus=false;ui.sidebarHidden=false;render();setTimeout(showTour,50);});}
function showTour(){document.querySelectorAll('.tour-popover,.tour-spotlight').forEach(el=>el.remove());if(ui.tour<0)return;if(ui.tour>=tourSteps.length){ui.tour=-1;toast('You’re ready to map. Add a story or start your own product map.');return;}const step={...tourSteps[ui.tour]};if(document.documentElement.classList.contains('family-editor')){if(ui.tour===0){step.selector='.family-map-toolbar';step.body='Choose a story map here, edit its name and outcome, or create a new map. Each map keeps its own activities, steps, and releases.';}if(ui.tour===4){step.selector='.family-map-toolbar';step.body='Use Native exports in the shared toolbar for JSON, Markdown ZIP, CSV, and Obsidian Canvas. Product-family Exchange can connect this work with components, pages, and interface scenarios.';}}if(ui.tour===3&&!ui.draft&&mapStories().length){const s=mapStories()[0];ui.selection=new Set([s.id]);ui.inspectorId=s.id;ui.draft=D.clone(s);renderInspector();}const target=document.querySelector(step.selector);if(!target){ui.tour++;showTour();return;}const rect=target.getBoundingClientRect(),w=Math.min(340,window.innerWidth-30);const spot=document.createElement('div');spot.className='tour-spotlight';spot.style.cssText=`position:fixed;pointer-events:none;z-index:108;border:2px solid var(--accent);border-radius:8px;box-shadow:0 0 0 9999px #14101988;left:${Math.max(0,rect.left-3)}px;top:${Math.max(0,rect.top-3)}px;width:${Math.min(window.innerWidth,rect.width+6)}px;height:${Math.min(window.innerHeight,rect.height+6)}px;`;document.body.append(spot);const tip=document.createElement('div');tip.className='tour-popover';tip.setAttribute('role','dialog');tip.setAttribute('aria-label','Storyloom guided tour');const left=Math.max(15,Math.min(window.innerWidth-w-15,ui.tour===3?rect.left-w-20:rect.left+22)),top=Math.max(18,Math.min(window.innerHeight-260,ui.tour===3?rect.top+25:rect.bottom+16));tip.style.left=left+'px';tip.style.top=top+'px';tip.innerHTML=`<div class="tour-counter">${ui.tour+1} of ${tourSteps.length}</div><h3>${step.title}</h3><p>${step.body}</p><div class="tour-actions"><button data-action="tour-end">Skip tour</button><span class="spacer"></span>${ui.tour?'<button class="btn" data-action="tour-back">Back</button>':''}<button class="primary" data-action="tour-next">${ui.tour===tourSteps.length-1?'Start mapping':'Next'}${icon('right')}</button></div>`;document.body.append(tip);tip.querySelector('.primary')?.focus();}

function showMenu(el,items,event){document.getElementById('context-menu').innerHTML='';const r=el.getBoundingClientRect(),x=event?.type==='contextmenu'?event.clientX:r.right-195,y=event?.type==='contextmenu'?event.clientY:r.bottom+5;const menu=document.createElement('div');menu.className='context-popup';menu.setAttribute('role','menu');menu.style.left=Math.max(8,Math.min(window.innerWidth-210,x))+'px';menu.style.top=Math.max(8,Math.min(window.innerHeight-items.length*38-20,y))+'px';menu.innerHTML=items.map(item=>item===null?'<div class="menu-separator"></div>':`<button role="menuitem" data-action="${item.action}" ${item.attrs||''} class="${item.danger?'danger':''}">${icon(item.icon)}${esc(item.title)}</button>`).join('');document.getElementById('context-menu').append(menu);menu.querySelector('button')?.focus();}

function action(name,el,event){const d=el?.dataset||{};if(name.startsWith('nav-'))return navigate(name.slice(4));if(name.startsWith('view-'))return navigate(name.slice(5));switch(name){
case 'toggle-sidebar':if(window.innerWidth<=960){ui.sidebarShown=!ui.sidebarShown;ui.sidebarHidden=false;}else ui.sidebarHidden=!ui.sidebarHidden;render();break;
case 'switch-map':guard(()=>{ui.mapId=d.id;ui.view='map';ui.query='';ui.statusFilter='';ui.personaFilter='';ui.releaseFilter='';ui.selection.clear();clearInspector();ui.sidebarShown=false;render();});break;
case 'new-story':newStory(d.step,d.release);break;
case 'new-map':createEntity('maps');break;
case 'new-activity':createEntity('activities');break;
case 'new-release':createEntity('releases');break;
case 'select-story':selectStory(d.id,!!event?.shiftKey);break;
case 'toggle-select':selectStory(d.id,true);break;
case 'close-inspector':guard(()=>{clearInspector();ui.selection.clear();renderInspector();renderContent();});break;
case 'save-story':saveStory();break;

case 'inspector-details':if(ui.inspectorTab==='markdown'&&ui.dirty){guard(()=>{ui.inspectorTab='details';ui.rawDraft=null;renderInspector();});}else{ui.inspectorTab='details';renderInspector();}break;
case 'story-source':selectStory(d.id);if(!ui.modal){ui.inspectorTab='markdown';renderInspector();}break;
case 'create-entity':createEntity(d.type,d.parent);break;
case 'edit-entity':editEntity(d.type,d.id);break;
case 'save-entity':saveEntity();break;
case 'delete-entity':deleteEntity(d.type,d.id);break;
case 'confirm-delete-entity':confirmDeleteEntity();break;
case 'duplicate-story':duplicateStory(d.id);break;
case 'delete-story':deleteStories([d.id]);break;
case 'delete-selected':deleteStories([...ui.selection]);break;
case 'confirm-delete-stories':{const ids=ui.deleteStoryIds;closeModal();clearInspector();ui.selection.clear();commit(`${ids.length} ${ids.length===1?'card':'cards'} deleted`,next=>{next.stories=next.stories.filter(s=>!ids.includes(s.id));for(const s of next.stories)s.dependencies=s.dependencies.filter(id=>!ids.includes(id));});break;}
case 'reorder-story':reorderStory(Number(d.direction));break;
case 'story-menu':storyMenu(d.id,el,event);break;
case 'entity-menu':entityMenu(d.type,d.id,el,event);break;
case 'clear-selection':guard(()=>{ui.selection.clear();clearInspector();renderContent();renderInspector();});break;
case 'clear-filters':ui.query='';ui.statusFilter='';ui.personaFilter='';ui.releaseFilter='';render();break;
case 'quick-status':guard(()=>{ui.statusFilter=d.status;ui.view='map';ui.sidebarShown=false;render();});break;
case 'release-filter':guard(()=>{ui.releaseFilter=['unplanned','unscheduled'].includes(d.id)?'unscheduled':d.id;ui.view='map';clearInspector();ui.selection.clear();render();});break;
case 'toggle-lane':ui.collapsed.has(d.id)?ui.collapsed.delete(d.id):ui.collapsed.add(d.id);renderContent();break;
case 'jump-activity':guard(()=>{ui.view='map';render();requestAnimationFrame(()=>document.querySelector(`[data-activity="${CSS.escape(d.id)}"]`)?.scrollIntoView?.({block:'start',inline:'center',behavior:'smooth'}));});break;
case 'toggle-dependencies':ui.dependencies=!ui.dependencies;el.setAttribute('aria-pressed',String(ui.dependencies));drawConnections();break;
case 'toggle-focus':guard(()=>{ui.focus=!ui.focus;ui.sidebarHidden=ui.focus;ui.sidebarShown=false;clearInspector();ui.selection.clear();render();});break;
case 'toggle-theme':guard(()=>commit('Appearance changed',next=>{next.settings.theme=document.documentElement.dataset.theme==='light'?'dark':'light';},{notify:false}));break;
case 'undo':guard(undo);break;
case 'redo':guard(redo);break;
case 'zoom-in':setZoom(ui.zoom+.1);break;
case 'zoom-out':setZoom(ui.zoom-.1);break;
case 'zoom-reset':setZoom(1);break;
case 'zoom-fit':if(ui.view!=='map'){ui.view='map';render();}requestAnimationFrame(fitBoard);break;
case 'sort':ui.sort={key:d.key,direction:ui.sort.key===d.key&&ui.sort.direction==='asc'?'desc':'asc'};renderContent();break;
case 'settings-save':saveSettings();break;
case 'settings-discard':ui.familySettingsDirty=false;render();toast('Unsaved settings discarded.');break;
case 'source-file':ui.filePath=d.path;renderContent();break;
case 'source-copy':{const f=getFiles().find(x=>x.path===d.path);if(f)copyText(f.content);break;}
case 'source-download':case 'download-note':{const f=getFiles().find(x=>x.path===d.path);if(f)download(f.path.split('/').pop(),f.content,'text/markdown;charset=utf-8');break;}
case 'open-note-in-inspector':if(d.type==='stories'){const s=state.stories.find(x=>x.id===d.id);if(s)ui.mapId=s.mapId;render();selectStory(d.id);ui.inspectorTab='markdown';renderInspector();}else if(d.type==='workspace'||!d.type)navigate('settings');else {const e=state[d.type]?.find(x=>x.id===d.id);if(e?.mapId)ui.mapId=e.mapId;if(d.type==='maps'&&e)ui.mapId=e.id;render();editEntity(d.type,d.id);}break;
case 'export-open':openExport();break;
case 'export-json':download('storyloom-'+(ui.exportScope==='map'?'map':'workspace')+'.json',D.toJSON(exportState()),'application/json');break;
case 'export-vault':download('storyloom-vault.zip',D.zip(D.files(exportState())),'application/zip');break;
case 'export-csv':download('storyloom-backlog.csv',D.toCSV(state,ui.mapId),'text/csv;charset=utf-8');break;

document.addEventListener('contextmenu',event=>{const card=event.target.closest('[data-card]'),struct=event.target.closest('[data-drag]');if(card){event.preventDefault();storyMenu(card.dataset.card,card,event);}else if(struct&&struct.dataset.drag!=='stories'){event.preventDefault();entityMenu(struct.dataset.drag,struct.dataset.id,struct,event);}});

let pan=null;

document.addEventListener('keydown',event=>{const editable=event.target.matches('input,textarea,select,[contenteditable=true]'),mod=event.ctrlKey||event.metaKey;

  const tabs=[...document.querySelectorAll('.view-tabs [role=tab]')],index=tabs.indexOf(event.target),at=event.key==='Home'?0:event.key==='End'?tabs.length-1:(index+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;

function assertFamilyClean(){
  if(ui.dirty||ui.familySettingsDirty||ui.familyEntityDirty)throw new Error('Save or discard your current changes before continuing.');
}
function familyOrigin(story){
  const origin=story.extraFrontmatter?.product_family_origin;
  if(!origin||typeof origin!=='object')return '';
  return `<div class="family-origin">Imported planning context<strong>${esc(origin.title||'Linked product record')}</strong>From ${esc(origin.workspaceTitle||origin.appId||'a product-family workspace')}. Refine this story’s user outcome and criteria independently.<code>${esc((story.extraFrontmatter?.product_family_refs||[])[0]||'')}</code></div>`;
}
function familyRows(){
  return COLLECTIONS.flatMap(collection=>state[collection].map(entity=>({
    id:entity.id,kind:'story.'+TYPE_LABELS[collection],title:entity.title,
    summary:entity.description||entity.goal||entity.role||'',status:entity.status||'',
    path:state.settings.folders[collection]+'/'+entity.id+'.md',updatedAt:entity.updated||entity.created||'',data:D.clone(entity)
  })));
}
function familySnapshot(){
  const current=map(),local=ui.inspectorId&&state.stories.find(s=>s.id===ui.inspectorId),selected=local||current;
  const viewTitles={map:current?.title||'Story map',backlog:'Story backlog',releases:'Release slices',personas:'Personas',files:'Vault files',settings:'Vault settings',help:'Mapping guide'};
  const primary=!current?{label:'New map',command:'create'}:ui.view==='personas'?{label:'New persona',command:'create'}:ui.view==='releases'?{label:'New release',command:'create'}:!sortedSteps().length?{label:mapActivities().length?'Add step':'Add activity',command:'create'}:{label:'Add story',command:'create'};
  return {
    appId:'storyloom',workspace:{id:state.extraFrontmatter.product_family_workspace_id,title:state.settings.vaultName},view:ui.view,title:viewTitles[ui.view]||'Storyloom',
    nav:[{id:'map',label:'Story map',icon:'map',count:mapStories().length},{id:'backlog',label:'Backlog',icon:'list',count:mapStories().filter(isStory).length},{id:'releases',label:'Releases',icon:'layers',count:mapReleases().length},
      ...state.maps.map(m=>({id:'map:'+m.id,label:m.title,icon:'map',count:state.stories.filter(s=>s.mapId===m.id).length,parent:'map'})),
      {id:'personas',label:'Personas',icon:'users',count:state.personas.length},{id:'files',label:'Vault files',icon:'folder',count:getFiles().length},{id:'settings',label:'Vault settings',icon:'settings'},{id:'help',label:'Mapping guide',icon:'circle-help'}],
    primary,selection:selected?{id:selected.id,kind:local?'story.story':'story.map',title:selected.title}:null,
    entities:familyRows(),save:storageError||corruptBackup||ui.externalChange?{state:'warning',label:ui.saveText||'Changes held in this session'}:ui.dirty||ui.familySettingsDirty||ui.familyEntityDirty?{state:'dirty',label:'Unsaved changes'}:{state:'saved',label:'Saved in this browser'},
    canUndo:history.length>0,canRedo:future.length>0

}
function familyNavigate({view,entityId}={}){
  assertFamilyClean();if(ui.modal)closeModal();endTour();
  if(view?.startsWith('map:')){
    const id=view.slice(4);if(!state.maps.some(m=>m.id===id))throw new Error('This story map no longer exists.');
    action('switch-map',{dataset:{id}});return;
  }
  if(view&&!['map','backlog','releases','personas','files','settings','help'].includes(view))throw new Error('That Storyloom view is unavailable.');
  if(entityId){
    const collection=COLLECTIONS.find(key=>state[key].some(e=>e.id===entityId));if(!collection)throw new Error('This planning record no longer exists.');
    const entity=state[collection].find(e=>e.id===entityId);clearInspector();ui.selection.clear();ui.query='';ui.statusFilter='';ui.personaFilter='';ui.releaseFilter='';
    if(collection==='maps')ui.mapId=entity.id;else if(entity.mapId)ui.mapId=entity.mapId;
    ui.view=view||(collection==='personas'?'personas':collection==='releases'?'releases':'map');

    else if(collection==='activities'||collection==='steps'){ui.view='map';render();requestAnimationFrame(()=>document.querySelector(`[data-id="${CSS.escape(entity.id)}"][data-drag]`)?.scrollIntoView({block:'nearest',inline:'center'}));}
    return;

function familyCommand({name}={}){
  assertFamilyClean();if(ui.modal)closeModal();
  switch(name){
    case'create':if(ui.view==='personas')createEntity('personas');else if(!map())createEntity('maps');else if(ui.view==='releases')createEntity('releases');else newStory(ui.draft?.stepId);break;
    case'new-map':createEntity('maps');break;
    case'undo':undo();break;
    case'redo':redo();break;
    case'import-native':openImport();break;
    case'export-native':openExport();break;
    case'help':navigate('help');break;
    case'settings':navigate('settings');break;
    case'fit':if(ui.view!=='map')navigate('map');requestAnimationFrame(fitBoard);break;
    case'command':case'search':showCommands();break;

function canAdoptStory(entity){

  if(!map()||!sortedSteps().length)return {allowed:false,label:'Create story draft',hint:'Create a story map and at least one journey step first.'};
  return {allowed:true,label:'Create story draft',hint:'Save an Idea card in the current map with a source reference. Refine its user outcome and acceptance criteria here.'};
}
window.FamilyAdapter=Object.freeze({
  getSnapshot:familySnapshot,navigate:familyNavigate,command:familyCommand,
  setTheme(theme){if(!['dark','light'].includes(theme))throw new Error('Choose light or dark appearance.');if(familyTheme===theme)return;familyTheme=theme;applyTheme();notifyFamily();},
  exportNative(){assertFamilyClean();return JSON.parse(D.toJSON(state));},
  inspectNative(data){
    const candidate=D.parseImport(typeof data==='string'?data:JSON.stringify(data));validateOrThrow(candidate);

    const origin={appId:String(entity.source?.appId||''),workspaceId:String(entity.source?.workspaceId||''),workspaceTitle:String(entity.source?.workspaceTitle||''),id:String(entity.id||''),kind:entity.kind,title:entity.title.slice(0,240),path:String(entity.path||''),importedAt:stamp};
    const record={id:D.uid('story'),mapId:ui.mapId,stepId,releaseId:null,kind:'story',title:(entity.kind==='dissect.scenario'?entity.title:'Use '+entity.title).slice(0,240),
      description:((entity.summary?String(entity.summary)+'\n\n':'')+'Planning context from '+entity.title+'.\nDescribe the user outcome and acceptance criteria before committing this card to a release.').slice(0,200000),
      status:'idea',priority:'should',points:null,personaIds:[...(map()?.personaIds||[])],tags:[],acceptance:'',dependencies:[],order:appendOrder(state.stories.filter(s=>s.stepId===stepId&&!s.releaseId)),created:stamp,updated:stamp,

    return {entityId:record.id,message:'Story draft saved in '+map().title+'. Its source remains a reference.'};
  }
});

window.StoryloomApp=Object.freeze({getState:()=>D.clone(state),getUI:()=>({mapId:ui.mapId,view:ui.view,zoom:ui.zoom,selection:[...ui.selection],dirty:ui.dirty,history:history.length}),exportCanvas,version:'1.0.0-prototype'});
