name: Real Obsidian
on:
  push:
    branches: [main]
  # Real Obsidian is end-to-end: it always runs on `main` (this project's Release tier) and on a manual run; on a pull
  # request it is opt-in, with the `e2e` label (every end-to-end check) or `run-obsidian` (this one only). It runs again
  # on each later push while the label stays. The pinned-host download below stays an explicit step opt-in.
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: real-obsidian-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-obsidian:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e') || contains(github.event.pull_request.labels.*.name, 'run-obsidian')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Select the pinned npm
        run: |
          npm install --prefix "$RUNNER_TEMP/pinned-npm" --ignore-scripts --no-fund --package-lock=false npm@11.19.1
          echo "PINNED_NPM=$RUNNER_TEMP/pinned-npm/node_modules/npm/bin/npm-cli.js" >> "$GITHUB_ENV"
      - name: Install exact dependencies
        run: node "$PINNED_NPM" ci --no-fund
      - name: Install Electron system libraries (no browser download)
        run: node node_modules/@playwright/test/cli.js install-deps chromium
      - name: Restore the pinned Obsidian download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .native-cache
          key: obsidian-host-${{ runner.os }}-app-1.13.7-launcher-3.2.1
      # The host's singleton socket lives under <project>/.nq/<scratch>/ (temporary data stays contained), and Linux
      # caps socket paths at 107 bytes. Inside the shell repository the project folder alone is 76 bytes, so the
      # Obsidian steps run from a bind mount of this same folder at a short path; writes still land in the project.
      - name: Mount the project at a short path (Linux socket path budget)
        run: sudo mkdir -p /wc && sudo mount --bind "$PWD" /wc
      - name: Real-Obsidian tests (private Xvfb display, fresh vault per test)
        working-directory: /wc
        env:
          OBSIDIAN_ALLOW_DOWNLOAD: '1'
          SOURCE_COMMIT: ${{ github.sha }}
        run: node "$PINNED_NPM" run test:obsidian
      - name: Agent loop smoke (build, launch, reload once, JSON summary)
        if: always()
        working-directory: /wc
        env:
          OBSIDIAN_ALLOW_DOWNLOAD: '1'
        run: |
          mkdir -p reports/obsidian
          node scripts/dev/obsidian-dev.mjs --json > reports/obsidian/dev-once.json
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-obsidian-evidence
          path: |
            reports/obsidian/
            .obsidian-sandbox/logs/
          retention-days: 7
          if-no-files-found: warn
