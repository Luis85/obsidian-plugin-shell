name: CI
# The `ui` job (browser journeys, UI review gallery) is end-to-end: it always runs on `main`, this project's Release
# tier, and on a pull request or manual run only when opted in (the `e2e` label, or the `e2e` input of a manual run).
# Adding the label starts it at once and it runs again on each later push while the label stays; `check` always runs.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      e2e:
        description: Also run the end-to-end browser journeys and the UI review gallery
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}${{ github.event.action == 'labeled' && format('-label-{0}', github.event.label.name) || '' }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Select the pinned npm
        run: |
          npm install --prefix "$RUNNER_TEMP/pinned-npm" --ignore-scripts --no-fund --package-lock=false npm@11.19.1
          echo "PINNED_NPM=$RUNNER_TEMP/pinned-npm/node_modules/npm/bin/npm-cli.js" >> "$GITHUB_ENV"
      - name: Install exact dependencies
        run: node "$PINNED_NPM" ci --no-fund
      - name: Gate (typecheck, lint, product tests)
        run: node "$PINNED_NPM" run check
      - name: Release build, UI-effect tests and test data (what verify:project adds to check)
        run: node "$PINNED_NPM" run verify:artifacts
      # Advisory: a new project has no author in manifest.json yet, which this mirror of the community-review
      # rules reports as a failure. Remove continue-on-error once the manifest is ready to publish.
      - name: Community-review rules (manifest, lint, bundle; advisory)
        continue-on-error: true
        run: node "$PINNED_NPM" run check:submission
  # Browser journeys and the UI review gallery: end-to-end, so opt-in except on `main`. The gallery is evidence for
  # human review, never acceptance. A step is skipped, with a warning, when its npm script does not exist.
  ui:
    if: github.event_name == 'push' || inputs.e2e == true || ((github.event.action != 'labeled' || github.event.label.name == 'e2e') && contains(github.event.pull_request.labels.*.name, 'e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Select the pinned npm
        run: |
          npm install --prefix "$RUNNER_TEMP/pinned-npm" --ignore-scripts --no-fund --package-lock=false npm@11.19.1
          echo "PINNED_NPM=$RUNNER_TEMP/pinned-npm/node_modules/npm/bin/npm-cli.js" >> "$GITHUB_ENV"
      - name: Install exact dependencies
        run: node "$PINNED_NPM" ci --no-fund
      - name: Install Chromium and its system libraries
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Browser journeys and UI quality (Playwright)
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['test:e2e'] ? 0 : 1)"; then
            node "$PINNED_NPM" run test:e2e
          else
            echo "::warning::package.json has no test:e2e script; no browser tests ran"
          fi
      - name: UI review gallery
        if: always()
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['ui:gallery'] ? 0 : 1)"; then
            node "$PINNED_NPM" run ui:gallery
            echo "UI review gallery: download the \`ui-review-gallery\` artifact and open \`gallery.html\`. It is evidence for human review, not acceptance." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::package.json has no ui:gallery script; no gallery was produced"
          fi
      - name: Keep the UI review gallery
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-review-gallery
          path: reports/ui-gallery/
          retention-days: 14
          if-no-files-found: warn
      - name: Keep the browser test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-e2e-reports
          path: reports/e2e/
          retention-days: 14
          if-no-files-found: warn
